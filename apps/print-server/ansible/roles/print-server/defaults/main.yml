---
print_box: ""
print_printer_hostname: ""
print_printer_ipv4_address: ""
print_printer_mac: ""
print_printer_uri: "ipp://{{ print_printer_ipv4_address }}/ipp/print"
print_queue_name: epson

print_service_root: /etc/klokast/print-server
print_config_root: "{{ print_service_root }}/config"
print_secret_root: "{{ print_service_root }}/secrets"

print_pod_name: klokast-print-server
print_image_name: localhost/klokast/print-server:latest
print_service_name: klokast-print-server
print_container_cups_name: print-cups
print_container_ingress_name: print-ingress

print_cups_etc_volume: klokast-print-cups-etc
print_cups_spool_volume: klokast-print-cups-spool
print_cups_cache_volume: klokast-print-cups-cache
print_tailscale_state_volume: klokast-print-ts-state

print_tailscale_authkey_wrapper: /usr/local/sbin/ts-authkey-print
print_tailscale_authkey_command_prefix: doas
print_tailscale_hostname: "{{ print_box }}-print"
print_tailscale_tag: tag:print
