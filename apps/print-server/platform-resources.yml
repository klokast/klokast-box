---
schema_version: 1
app: print-server
risk_class: private_local_printing
default_isolation: dedicated_disposable_alpine_vm
placement_mode: multi_box
features:
  - id: lan-printing
    type: boolean
    resource_bindings:
      "true": [lan-printing]
resources:
  compute:
    - id: cups
      type: app_vm
      zone: bak
      privilege: native_cups_service
      lifecycle: disposable
      isolation: dedicated_pvh_vm
      hostname_suffix: print
      tailnet_tag_default: tag:print
      guest_os: alpine
      container_runtime: none
      memory_mb: 2048
      vcpus: 2
      lv_size: 4G
      rationale: Disposable native print appliance; no login or runtime package manager.
    - id: printer
      type: managed_iot_device
      zone: iot
      privilege: external_low_trust
      lifecycle: steady
      hostname_suffix: iot-printer
      management_tag_default: tag:iot
      rationale: >-
        Reserves the Ethernet printer on the router-controlled IoT segment.
  network:
    - id: print-transport
      type: wan_egress
      required: true
      from_zone: bak
      tcp_ports: [443]
      udp_ports: [3478, 41641]
      rationale: Tailscale control, relay and peer transport for the dedicated print identity.
    - id: lan-printing
      type: rg_lan_ipp
      requires_capability: rg-lan
      required: false
      enabled_by_default: false
      rationale: Announces the backend queue and permits RG LAN print submission.
    - id: printer-ipp
      type: zone_to_device_tcp
      required: true
      from_zone: bak
      device: printer
      ports:
        - 631
      rationale: >-
        Allows only the local backend CUPS queue to submit IPP jobs to the
        managed IoT printer.
  tailnet:
    - id: print-ingress
      required: true
      hostname_pattern: "{box}-print"
      tag_default: tag:print
      grants:
        - src: group:family
          ports:
            - 631
