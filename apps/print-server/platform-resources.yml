---
schema_version: 1
app: print-server
risk_class: private_local_printing
default_isolation: zone_vm_rootless_podman_plus_low_trust_iot_device
placement_mode: multi_box
features:
  - id: lan-printing
    type: boolean
    resource_bindings:
      "true": [lan-printing]
resources:
  compute:
    - id: cups
      type: podman_workload
      zone: bak
      privilege: unprivileged
      lifecycle: steady
      rationale: >-
        Hosts the private CUPS queue and app-specific Tailscale ingress as a
        rootless Podman pod on the backend VM.
    - id: printer
      type: managed_iot_device
      zone: iot
      privilege: external_low_trust
      lifecycle: steady
      hostname_suffix: iot-printer
      management_tag_default: tag:iot
      rationale: >-
        Reserves the Ethernet printer on the router-controlled IoT segment.
  network:
    - id: lan-printing
      type: rg_lan_ipp
      requires_capability: rg-lan
      required: false
      enabled_by_default: false
      rationale: Announces the backend queue and permits RG LAN print submission.
    - id: printer-ipp
      type: zone_to_device_tcp
      required: true
      from_zone: bak
      device: printer
      ports:
        - 631
      rationale: >-
        Allows only the local backend CUPS queue to submit IPP jobs to the
        managed IoT printer.
  tailnet:
    - id: print-ingress
      required: true
      hostname_pattern: "{box}-bak-printer"
      tag_default: tag:print
      grants:
        - src: group:family
          ports:
            - 631
