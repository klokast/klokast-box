---
- name: Prepare the stable Nextcloud private ingress identity
  hosts: all
  gather_facts: false
  vars:
    nextcloud_private_tailscale_hostname: next
    nextcloud_private_tailscale_tag: tag:nextcloud
    nextcloud_private_tailscale_delete_confirm: delete stale tailscale machine for nextcloud private ingress
  tasks:
    - name: Delete stale offline exact-name private ingress identities
      ansible.builtin.import_role:
        name: tailscale-stale-device
      vars:
        tailscale_device_expected_hostname: "{{ nextcloud_private_tailscale_hostname }}"
        tailscale_device_expected_tag: "{{ nextcloud_private_tailscale_tag }}"
        tailscale_device_apply: true
        tailscale_device_confirm: "{{ nextcloud_private_tailscale_delete_confirm }}"
        tailscale_device_expected_confirm: "{{ nextcloud_private_tailscale_delete_confirm }}"
        tailscale_device_fail_on_online_exact: false
      run_once: true
