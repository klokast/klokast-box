---
- name: Restrict DMZ-only removal to the selected DMZ guest
  ansible.builtin.assert:
    that:
      - node_domain_role == 'dmz'
      - inventory_hostname == node_name ~ '-dmz'
      - not (nextcloud_wipe_data | default(false) | bool)
  when: nextcloud_remove_dmz_only | default(false) | bool

- name: Check Nextcloud service files before stopping them
  ansible.builtin.stat:
    path: '/etc/init.d/{{ item }}'
  loop:
    - nextcloud-private-ingress
    - nextcloud-private-ingress-proxy
    - nextcloud-cloudflared
    - nextcloud
    - nextcloud-firewall
  register: nextcloud_remove_services

- name: Stop managed Nextcloud services
  ansible.builtin.service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  become: true
  when: item.stat.exists
  loop: '{{ nextcloud_remove_services.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Stop the exact private ingress supervisor when its OpenRC marker is absent
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import subprocess
        from pathlib import Path
        pidfile='/run/nextcloud-private-ingress/tailscaled.pid'
        expected=[b'supervise-daemon',b'nextcloud-private-ingress',b'--start',
                  b'--pidfile',pidfile.encode()]
        matches=[]
        for p in Path('/proc').iterdir():
          if not p.name.isdigit(): continue
          try: argv=(p/'cmdline').read_bytes().split(b'\0')
          except FileNotFoundError: continue
          if argv[:5]==expected: matches.append(p.name)
        assert len(matches)<=1, 'multiple private ingress supervisors; files are preserved'
        if matches:
          p=Path(pidfile)
          assert not p.is_symlink() and p.stat().st_size<32, 'unsafe private ingress pidfile'
          assert p.read_text().strip()==matches[0], 'private ingress pidfile differs from its supervisor'
          subprocess.run(['/sbin/supervise-daemon','nextcloud-private-ingress','--stop',
                          '--pidfile',pidfile],check=True,timeout=30,
                         env={'PATH':'/usr/sbin:/usr/bin:/sbin:/bin','RC_SVCNAME':'nextcloud-private-ingress'})
          print('stopped')
  when: node_domain_role == 'dmz'
  register: nextcloud_remove_orphan_supervisor
  changed_when: "'stopped' in nextcloud_remove_orphan_supervisor.stdout_lines"

- name: Verify no native Nextcloud ingress writer remains before file removal
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os,re
        from pathlib import Path
        roots=('/etc/klokast/nextcloud','/etc/klokast/nextcloud-cloudflared',
               '/etc/klokast/nextcloud-private-ingress','/var/lib/klokast/nextcloud-private-ingress',
               '/var/log/klokast/nextcloud-private-ingress','/var/log/klokast/nextcloud-cloudflared',
               '/run/nextcloud-private-ingress')
        mounts=[re.sub(r'\\([0-7]{3})',lambda m:chr(int(m[1],8)),v.split()[4])
                for v in Path('/proc/self/mountinfo').read_text().splitlines()]
        for root in roots:
          path=Path(root)
          assert not any(p.is_symlink() for p in path.parents), 'app path has a symlink parent'
          assert not any(m==root or m.startswith(root+'/') for m in mounts), 'app data has a mount boundary'
        needles=tuple(x.encode() for x in roots)+ (b'/usr/local/sbin/nextcloud-',)
        for p in Path('/proc').iterdir():
          if not p.name.isdigit() or int(p.name)==os.getpid(): continue
          try: argv=(p/'cmdline').read_bytes().split(b'\0')
          except FileNotFoundError: continue
          assert not any(n in a for a in argv for n in needles), 'a Nextcloud ingress process remains; files are preserved'
  when: node_domain_role == 'dmz'
  changed_when: false

- name: Remove managed Nextcloud containers and pod on backend
  ansible.builtin.command:
    argv:
      - podman
      - pod
      - rm
      - -f
      - nextcloud
  become: true
  become_user: "{{ vm_admin_user_name }}"
  register: nextcloud_remove_backend_pod
  changed_when: nextcloud_remove_backend_pod.rc == 0
  failed_when: false
  when: node_domain_role == 'backend'

- name: Remove stale Cloudflare connector container on DMZ
  ansible.builtin.command:
    argv:
      - podman
      - rm
      - -f
      - nextcloud-cloudflared
  become: true
  become_user: "{{ vm_admin_user_name }}"
  register: nextcloud_remove_dmz_container
  changed_when: nextcloud_remove_dmz_container.rc == 0
  failed_when: false
  when: node_domain_role == 'dmz'

- name: Remove managed service files and helper scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/init.d/nextcloud
    - /etc/init.d/nextcloud-firewall
    - /etc/init.d/nextcloud-cloudflared
    - /etc/init.d/nextcloud-private-ingress
    - /etc/init.d/nextcloud-private-ingress-proxy
    - /usr/local/sbin/nextcloud-backend-deploy
    - /usr/local/sbin/nextcloud-cloudflared-deploy
    - /usr/local/sbin/nextcloud-private-ingress-converge
    - /usr/local/sbin/nextcloud-occ
    - /usr/local/sbin/nextcloud-backup-run
    - /usr/local/sbin/nextcloud-image-source-preflight
    - /etc/periodic/hourly/nextcloud-backup

- name: Remove managed configuration roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/klokast/nextcloud
    - /etc/klokast/nextcloud-cloudflared
    - /etc/klokast/nextcloud-private-ingress

- name: Wipe managed persistent data only when explicitly requested
  ansible.builtin.file:
    path: /srv/nextcloud
    state: absent
  become: true
  when:
    - nextcloud_wipe_data | default(false) | bool
    - node_domain_role == 'backend'

- name: Remove private ingress Tailscale state
  ansible.builtin.file:
    path: /var/lib/klokast/nextcloud-private-ingress
    state: absent
  become: true
  when: node_domain_role == 'dmz'

- name: Remove stopped DMZ ingress runtime and logs
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /run/nextcloud-private-ingress
    - /var/log/klokast/nextcloud-private-ingress
    - /var/log/klokast/nextcloud-cloudflared
  when: node_domain_role == 'dmz'
