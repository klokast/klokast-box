---
- name: Assert the music audio endpoint inputs are valid
  ansible.builtin.assert:
    that:
      - node_domain_role == 'audio_endpoint'
      - node_name == music_box
      - music_endpoint_hostname is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - music_endpoint_tailnet_tag is match('^tag:[A-Za-z0-9][A-Za-z0-9_-]*$')
      - music_endpoint_backend_host is match('^[0-9.]+$')
    fail_msg: >-
      music-audio-endpoint must target the selected managed Raspberry Pi.

- name: Set Raspberry Pi hostname
  ansible.builtin.hostname:
    name: "{{ music_endpoint_hostname }}"
  become: true

- name: Ensure Raspberry Pi endpoint packages are installed
  ansible.builtin.apt:
    name: "{{ music_endpoint_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure snapclient system user exists
  ansible.builtin.user:
    name: snapclient
    system: true
    shell: /usr/sbin/nologin
    groups:
      - audio
    append: true
  become: true

- name: Ensure managed admin user exists on the endpoint
  ansible.builtin.user:
    name: "{{ music_endpoint_admin_user }}"
    shell: /bin/bash
    groups:
      - sudo
    append: true
  become: true
  when: music_endpoint_manage_admin_user | bool

- name: Allow managed admin user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-klokast-{{ music_endpoint_admin_user }}"
    content: "{{ music_endpoint_admin_user }} ALL=(root) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: music_endpoint_manage_admin_user | bool

- name: Ensure streamer power user exists
  ansible.builtin.user:
    name: "{{ music_endpoint_power_user }}"
    shell: /bin/sh
    create_home: false
    password_lock: true
    system: true
  become: true

- name: Allow streamer power user to power off only
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/91-klokast-{{ music_endpoint_power_user }}"
    content: "{{ music_endpoint_power_user }} ALL=(root) NOPASSWD: {{ music_endpoint_poweroff_path }}\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  become: true

- name: Install Tailscale on the Raspberry Pi endpoint
  ansible.builtin.import_role:
    name: debian-tailscale-client
  vars:
    node_hostname: "{{ music_endpoint_hostname }}"
    tailscale_enable_ssh: true

- name: Collect current endpoint Tailscale runtime status
  ansible.builtin.command: tailscale status --json
  register: music_endpoint_tailscale_status_json
  changed_when: false
  failed_when: false

- name: Parse current endpoint Tailscale runtime status
  ansible.builtin.set_fact:
    music_endpoint_tailscale_status: "{{ music_endpoint_tailscale_status_json.stdout | from_json }}"
  when:
    - music_endpoint_tailscale_status_json.rc == 0
    - music_endpoint_tailscale_status_json.stdout | length > 0

- name: Collect endpoint Tailscale preference state when available
  ansible.builtin.command: tailscale debug prefs
  register: music_endpoint_tailscale_prefs_json
  changed_when: false
  failed_when: false
  when: music_endpoint_tailscale_status.BackendState | default('') == 'Running'

- name: Parse endpoint Tailscale preference state when available
  ansible.builtin.set_fact:
    music_endpoint_tailscale_prefs: "{{ music_endpoint_tailscale_prefs_json.stdout | from_json }}"
  when:
    - music_endpoint_tailscale_prefs_json.rc | default(1) == 0
    - music_endpoint_tailscale_prefs_json.stdout | default('') | length > 0

- name: Decide whether endpoint Tailscale enrollment is needed
  ansible.builtin.set_fact:
    music_endpoint_tailscale_enrollment_needed: >-
      {{
        (music_endpoint_tailscale_status.BackendState | default('')) != 'Running'
        or (music_endpoint_tailscale_status.Self.HostName | default('') != music_endpoint_hostname)
        or (music_endpoint_tailnet_tag not in (music_endpoint_tailscale_status.Self.Tags | default([])))
        or (not (music_endpoint_tailscale_prefs.RunSSH | default(false)))
      }}
  changed_when: false

- name: Read the endpoint Tailscale auth key from the ops wrapper
  ansible.builtin.set_fact:
    music_endpoint_tailscale_authkey:
      stdout: >-
        {{
          lookup(
            'ansible.builtin.pipe',
            'sudo -n ' ~ (music_endpoint_tailscale_authkey_wrapper | quote)
            ~ ' --hostname ' ~ (music_endpoint_hostname | quote)
            ~ ' --tags ' ~ (music_endpoint_tailnet_tag | quote)
          ) | trim
        }}
  changed_when: false
  no_log: true
  when: music_endpoint_tailscale_enrollment_needed | bool

- name: Assert the endpoint Tailscale auth key is available
  ansible.builtin.assert:
    that:
      - music_endpoint_tailscale_authkey.stdout | default('') | trim | length > 0
    fail_msg: >-
      The endpoint Tailscale auth-key wrapper
      {{ music_endpoint_tailscale_authkey_wrapper }} did not return a usable
      auth key.
  no_log: true
  when: music_endpoint_tailscale_enrollment_needed | bool

- name: Enroll or re-enroll the endpoint into Tailscale
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ music_endpoint_tailscale_authkey.stdout | trim }}"
      - "--hostname={{ music_endpoint_hostname }}"
      - "--advertise-tags={{ music_endpoint_tailnet_tag }}"
      - "--accept-dns={{ music_endpoint_tailscale_accept_dns | ternary('true', 'false') }}"
      - --ssh
      - --accept-risk=lose-ssh
      - --force-reauth
      - --timeout=30s
  become: true
  no_log: true
  when: music_endpoint_tailscale_enrollment_needed | bool

- name: Render endpoint nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/nft -c -f %s"
  become: true
  register: music_endpoint_nftables_render

- name: Ensure endpoint nftables is enabled and started
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  become: true

- name: Apply endpoint nftables policy
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.conf
  become: true
  changed_when: music_endpoint_nftables_render.changed

- name: Render Klokast Snapclient service
  ansible.builtin.template:
    src: klokast-snapclient.service.j2
    dest: "/etc/systemd/system/{{ music_endpoint_snapclient_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: music_endpoint_snapclient_service_render

- name: Stop generic snapclient service if present
  ansible.builtin.systemd:
    name: snapclient
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Reload systemd after Snapclient service changes
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: music_endpoint_snapclient_service_render.changed

- name: Keep Klokast Snapclient running
  ansible.builtin.systemd:
    name: "{{ music_endpoint_snapclient_service_name }}"
    enabled: true
    state: restarted
  become: true

- name: Collect endpoint Tailscale runtime status after enrollment
  ansible.builtin.command: tailscale status --json
  register: music_endpoint_tailscale_status_verify_json
  changed_when: false

- name: Parse endpoint Tailscale runtime status after enrollment
  ansible.builtin.set_fact:
    music_endpoint_tailscale_status_verify: "{{ music_endpoint_tailscale_status_verify_json.stdout | from_json }}"
  changed_when: false

- name: Assert endpoint Tailscale enrollment converged
  ansible.builtin.assert:
    that:
      - music_endpoint_tailscale_status_verify.BackendState | default('') == 'Running'
      - music_endpoint_tailscale_status_verify.Self.HostName | default('') == music_endpoint_hostname
      - music_endpoint_tailnet_tag in (music_endpoint_tailscale_status_verify.Self.Tags | default([]))
    fail_msg: >-
      Endpoint Tailscale enrollment did not converge for {{ inventory_hostname }}.
