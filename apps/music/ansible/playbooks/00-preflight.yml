---
- name: Preflight the music backend target
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert the selected backend VM is targeted
      ansible.builtin.assert:
        that:
          - music_box is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
          - node_name == music_box
          - node_domain_role == platform_zones.bak.role
        fail_msg: >-
          Music backend playbooks only target the selected backend VM.

    - name: Assert Podman exists on the backend VM
      ansible.builtin.stat:
        path: /usr/bin/podman
      register: music_preflight_podman

    - name: Fail when Podman is missing
      ansible.builtin.assert:
        that:
          - music_preflight_podman.stat.exists
        fail_msg: >-
          Podman is required on {{ inventory_hostname }} before music can be
          installed. Run the Platform Podman VM phases first.
