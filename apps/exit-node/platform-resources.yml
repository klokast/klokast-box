---
schema_version: 1
app: exit-node
risk_class: tailnet_web_exit
default_isolation: dedicated_disposable_alpine_vm
placement_mode: multi_box
resources:
  compute:
    - id: exit
      type: app_vm
      zone: dmz
      privilege: kernel_forwarding_only
      lifecycle: disposable
      isolation: dedicated_pvh_vm
      hostname_suffix: exit
      tailnet_tag_default: tag:exit
      guest_os: alpine
      container_runtime: none
      memory_mb: 512
      vcpus: 2
      lv_size: 4G
      rationale: Disposable web exit for Tailnet members; no login, data or runtime package manager.
  network:
    - id: exit-egress
      type: wan_egress
      required: true
      from_zone: dmz
      tcp_ports: [80, 443]
      udp_ports: [443, 3478, 41641]
      rationale: >-
        Forwarded client web traffic (HTTP, HTTPS, QUIC) and Tailscale control,
        relay and peer transport. The Platform restricts it to public destinations.
  tailnet:
    - id: exit-route
      required: true
      hostname_pattern: "{box}-exit"
      tag_default: tag:exit
