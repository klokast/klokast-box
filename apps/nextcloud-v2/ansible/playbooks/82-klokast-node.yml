---
- name: Install the Nextcloud v2 runner on selected Podman VMs
  hosts: podman_vms
  gather_facts: false
  pre_tasks:
    - name: Wait for Podman VM management connectivity
      ansible.builtin.wait_for_connection:
        delay: 2
        sleep: 3
        timeout: 180

  tasks:
    - name: Install the target-local Nextcloud v2 reconciler
      ansible.builtin.import_role:
        name: "{{ playbook_dir }}/../roles/klokast-node"
