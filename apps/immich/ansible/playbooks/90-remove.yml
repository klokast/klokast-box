---
- name: Remove Immich services
  hosts: all
  gather_facts: false
  vars:
    immich_private_tailscale_hostname: photos
    immich_private_tailscale_tag: tag:immich
    immich_private_tailscale_delete_confirm: delete stale tailscale machine for immich private ingress
    immich_active_master: ""
    immich_passive_backup: ""
    immich_restic_sftp_repository_root: /srv/immich-restic
    immich_restic_sftp_repository_path: "{{ immich_restic_sftp_repository_root }}/{{ immich_active_master }}"
    immich_restic_sshd_config_path: /etc/ssh/sshd_config.d/30-immich-restic-sftp.conf
    immich_restic_ssh_root: /etc/klokast/immich/ssh
    immich_restic_ssh_key_path: "{{ immich_restic_ssh_root }}/restic-sftp"
    immich_active_backend_host: "{{ immich_active_master }}-bak"
    immich_passive_backend_host: "{{ immich_passive_backup }}-bak"
  tasks:
    - name: Remove Immich runtime artifacts
      ansible.builtin.import_role:
        name: immich-remove

    - name: Allow the stopped private ingress identity to go offline
      ansible.builtin.pause:
        seconds: 8
      run_once: true

    - name: Delete stale offline private ingress Tailscale identity
      ansible.builtin.import_role:
        name: tailscale-stale-device
      vars:
        tailscale_device_expected_hostname: "{{ immich_private_tailscale_hostname }}"
        tailscale_device_expected_tag: "{{ immich_private_tailscale_tag }}"
        tailscale_device_apply: true
        tailscale_device_confirm: "{{ immich_private_tailscale_delete_confirm }}"
        tailscale_device_expected_confirm: "{{ immich_private_tailscale_delete_confirm }}"
        tailscale_device_fail_on_online_exact: false
      run_once: true
