---
- name: Preflight the active and passive Immich targets
  hosts: all
  gather_facts: false
  vars_files:
    - ../../images.lock.yml
  tasks:
    - name: Assert the app wrapper passed the selected boxes
      ansible.builtin.assert:
        that:
          - immich_active_master is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
          - immich_passive_backup is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
          - immich_active_master != immich_passive_backup
        fail_msg: >-
          Pass box names with --active-master and --passive-backup.

    - name: Assert the host belongs to the selected Immich box pair
      ansible.builtin.assert:
        that:
          - node_name in [immich_active_master, immich_passive_backup]
          - node_domain_role in ['backend', 'dmz']
        fail_msg: >-
          Immich app playbooks only target the selected backend and DMZ VMs.

    - name: Assert Podman is installed on selected Podman VMs
      ansible.builtin.stat:
        path: /usr/bin/podman
      register: immich_preflight_podman

    - name: Fail when Podman is missing
      ansible.builtin.assert:
        that:
          - immich_preflight_podman.stat.exists
        fail_msg: >-
          Podman is required on {{ inventory_hostname }} before Immich can be
          installed. Run the Platform Podman VM phases first.
