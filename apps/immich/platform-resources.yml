---
schema_version: 1
app: immich
risk_class: private_service
default_isolation: zone_vm_rootless_podman
resources:
  compute:
    - id: backend
      type: podman_workload
      zone: bak
      privilege: rootless
      lifecycle: steady
    - id: private-ingress
      type: podman_workload
      zone: dmz
      privilege: rootless
      lifecycle: steady
  network:
    - id: backend-http-upstream
      type: interzone_tcp
      required: true
      rationale: >-
        Allows only the DMZ-hosted Immich private ingress to reach the backend
        HTTP upstream. Family devices must never reach the backend VM directly.
      from_zone: dmz
      to_zone: bak
      ports:
        - 2283
  tailnet:
    - id: private-ingress
      required: true
      access:
        intent: private-service-ingress
        capability: overlay
      hostname_default: photos
      tag_default: tag:immich
      grants:
        - src: group:family
          ports:
            - 443
  artifacts:
    - id: backend-images
      type: oci_images
      lock_file: images.lock.yml
      require_digest: true
