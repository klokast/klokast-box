---
schema_version: 1

boxes:
  box-001:
    access:
      declared_capabilities:
        - overlay
        - rg-lan
        - direct-egress
        - direct-ingress
      enabled_capabilities:
        - overlay
      prohibited_capabilities:
        - rg-lan
        - direct-egress
        - direct-ingress
      policy:
        local-presence-control: overlay
        private-service-ingress: overlay
        file-upload: overlay
        household-wan-egress: none
        public-ingress: none

apps:
  nextcloud:
    enabled: false
    placement:
      mode: single_box
      box: box-001
    resources:
      cloudflare-tunnel-egress: false
