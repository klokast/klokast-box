---
schema_version: 1

instance:
  name: example-klokast

tailnet:
  magicdns_suffix: example.ts.net
  groups:
    operators:
      - admin@example.com
    family:
      - admin@example.com
      - family@example.com

sites:
  site-001:
    country: XX
    timezone: Etc/UTC
    physical_location: Example location

boxes:
  box-001:
    hostname_prefix: k001
    site: site-001

control_plane:
  controller:
    active_box: box-001
  airunners:
    - id: airunner-001
      kind: controller_container
      box: box-001
