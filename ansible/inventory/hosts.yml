all:
  vars:
    platform_magicdns_suffix: >-
      {{
        lookup('env', 'KLOKAST_MAGICDNS_SUFFIX')
        | default('example.ts.net', true)
      }}
  children:
    bootstrap:
      hosts:
        duh-bootstrap: {}
    dom0:
      hosts:
        duh-dom0: {}
    # Keep the VM lifecycle playbooks separate from the destructive bootstrap
    # dom0 group so `bootstrap-dom0 --node duh` still stays node-scoped.
    vm_dom0:
      children:
        yii_dom0: {}
        duh_dom0: {}
    yii:
      children:
        yii_dom0:
          hosts:
            yii-dom0: {}
        yii_router:
          hosts:
            yii-router: {}
        yii_backend:
          hosts:
            yii-bak: {}
        yii_dmz:
          hosts:
            yii-dmz: {}
        yii_iot:
          hosts:
            yii-iot: {}
    duh:
      children:
        duh_dom0:
          hosts:
            duh-dom0: {}
        duh_router:
          hosts:
            duh-router: {}
        duh_backend:
          hosts:
            duh-bak: {}
        duh_dmz:
          hosts:
            duh-dmz: {}
        duh_iot:
          hosts:
            duh-iot: {}
    router:
      children:
        yii_router: {}
        duh_router: {}
    jump:
      hosts: {}
    backend:
      children:
        yii_backend: {}
        duh_backend: {}
    dmz:
      children:
        yii_dmz: {}
        duh_dmz: {}
    iot:
      children:
        yii_iot: {}
        duh_iot: {}
    usr:
      children: {}
    podman_vms:
      children:
        backend: {}
        dmz: {}
        iot: {}
        usr: {}
