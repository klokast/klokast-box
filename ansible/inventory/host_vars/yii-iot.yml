---
node_domain_role: iot
node_hostname: yii-iot
ansible_host: "{{ node_hostname }}.{{ platform_magicdns_suffix }}"

iot_bootstrap_host: "{{ platform_zones.iot.vm_ipv4_address }}"
iot_bootstrap_proxyjump: "neo@{{ hostvars['yii-dom0'].ansible_host | default('yii-dom0') }}"
iot_bootstrap_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/github-klokast-codex"
iot_bootstrap_known_hosts_file: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts_klokast_bootstrap"
