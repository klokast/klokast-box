---
# One-time cleanup of the four classified Static Site backup staging operations.
# Keep controller copies under the approved checkout's ignored .run directory.
- name: Preserve and verify every DMZ Static Site backup before guest cleanup
  hosts: dmz
  gather_facts: false
  any_errors_fatal: true
  become: true
  become_method: doas
  vars:
    stage_operations:
      - 623ecdce63065238edb22fb3
      - 68a5e291f7c6c8373a489378
      - 9876db5374f6e5149f823741
      - b75afb6595b65fcd02ce2e08
    stage_controller_root: /home/smith/src/klokast/klokast-box/.run/vm-update-backups/static-site
    stage_guest_root: /var/tmp/klokast-static-site-backup
  pre_tasks:
    - name: Require only the two selected DMZ guests
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == ['k001-dmz', 'k002-dmz']
          - inventory_hostname in ['k001-dmz', 'k002-dmz']
          - node_domain_role == 'dmz'

    - name: Verify the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: stage_controller_guard

    - name: Require active controller authority
      ansible.builtin.assert:
        that:
          - (stage_controller_guard.stdout | from_json).configured
          - (stage_controller_guard.stdout | from_json).active
          - (stage_controller_guard.stdout | from_json).role == 'active'

    - name: Require the fixed guest staging tree and no active backup user
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import os,stat
            from pathlib import Path
            root=Path('/var/tmp/klokast-static-site-backup')
            ops={'623ecdce63065238edb22fb3','68a5e291f7c6c8373a489378','9876db5374f6e5149f823741','b75afb6595b65fcd02ce2e08'}
            info=root.lstat()
            assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o700
            assert {p.name for p in root.iterdir()}==ops|{'helper.py','async'}
            helper=(root/'helper.py').lstat(); jobs=(root/'async').lstat()
            assert stat.S_ISREG(helper.st_mode) and helper.st_uid==0 and stat.S_IMODE(helper.st_mode)==0o600
            assert stat.S_ISDIR(jobs.st_mode) and jobs.st_uid==0 and stat.S_IMODE(jobs.st_mode)==0o700
            assert not any((root/'async').iterdir())
            for process in Path('/proc').iterdir():
              if not process.name.isdecimal() or int(process.name)==os.getpid(): continue
              try:
                for fd in (process/'fd').iterdir():
                  if os.readlink(fd).startswith(str(root)+'/'):
                    raise RuntimeError('backup staging has an open file')
                if str(root/'helper.py').encode() in (process/'cmdline').read_bytes():
                  raise RuntimeError('backup helper is still running')
              except OSError:
                continue
            print('fixed staging tree has no active user')
      changed_when: false

    - name: Require the missing operation copy to be new on the controller
      ansible.builtin.stat:
        path: '{{ stage_controller_root }}/623ecdce63065238edb22fb3/{{ inventory_hostname }}'
        follow: false
      delegate_to: localhost
      become: false
      register: stage_missing_copy

    - name: Refuse to overwrite existing controller evidence
      ansible.builtin.assert:
        that:
          - not stage_missing_copy.stat.exists

  tasks:
    - name: Create the missing operation's protected controller directory
      ansible.builtin.file:
        path: '{{ stage_controller_root }}/623ecdce63065238edb22fb3/{{ inventory_hostname }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Preserve the missing guest archive, manifest, and receipt
      ansible.builtin.fetch:
        src: '{{ stage_guest_root }}/623ecdce63065238edb22fb3/{{ item }}'
        dest: '{{ stage_controller_root }}/623ecdce63065238edb22fb3/{{ inventory_hostname }}/{{ item }}'
        flat: true
        validate_checksum: true
      loop: [static-site.tar, manifest.json, receipt.json]
      no_log: true

    - name: Restrict the new controller evidence files
      ansible.builtin.file:
        path: '{{ stage_controller_root }}/623ecdce63065238edb22fb3/{{ inventory_hostname }}/{{ item }}'
        mode: '0600'
      loop: [static-site.tar, manifest.json, receipt.json]
      delegate_to: localhost
      become: false

    - name: Verify all four independent controller backup copies
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import hashlib,json,os,stat,sys
            from pathlib import Path
            root=Path(sys.argv[1]); op=sys.argv[2]; host=sys.argv[3]
            names={'static-site.tar','manifest.json','receipt.json'}
            assert {p.name for p in root.iterdir()}==names
            parent=root.lstat()
            assert stat.S_ISDIR(parent.st_mode) and parent.st_uid==os.geteuid() and stat.S_IMODE(parent.st_mode)==0o700
            for name in names:
              file=(root/name).lstat()
              assert stat.S_ISREG(file.st_mode) and file.st_uid==os.geteuid() and file.st_nlink==1 and stat.S_IMODE(file.st_mode)==0o600
            receipt=json.loads((root/'receipt.json').read_bytes())
            assert receipt['kind']=='klokast.static-site-backup.v1'
            assert receipt['operation_id']==op and receipt['host']==host
            assert receipt['restore_verified'] is True and receipt['source_unchanged'] is True
            for name,key in [('static-site.tar','archive_sha256'),('manifest.json','manifest_sha256')]:
              with (root/name).open('rb') as source:
                digest=hashlib.sha256()
                for block in iter(lambda:source.read(1048576),b''): digest.update(block)
                os.fsync(source.fileno())
              assert digest.hexdigest()==receipt[key]
            assert (root/'static-site.tar').stat().st_size==receipt['archive_bytes']
            print(json.dumps({'operation_id':op,'archive_sha256':receipt['archive_sha256'],'manifest_sha256':receipt['manifest_sha256']}))
          - '{{ stage_controller_root }}/{{ item }}/{{ inventory_hostname }}'
          - '{{ item }}'
          - '{{ inventory_hostname }}'
      loop: '{{ stage_operations }}'
      delegate_to: localhost
      become: false
      changed_when: false
      register: stage_verified_copies

- name: Remove only guest staging with matching verified controller bytes
  hosts: dmz
  gather_facts: false
  any_errors_fatal: true
  become: true
  become_method: doas
  tasks:
    - name: Require all four controller checks from this execution
      ansible.builtin.assert:
        that:
          - stage_verified_copies is defined
          - stage_verified_copies.results | length == 4
          - stage_verified_copies.results | selectattr('rc', 'equalto', 0) | list | length == 4

    - name: Install the checked cleanup helper in the existing protected staging
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../apps/static-site/ansible/roles/static-site-backup/files/static-site-backup'
        dest: /var/tmp/klokast-static-site-backup/helper.py
        owner: root
        group: root
        mode: '0600'

    - name: Retire the four exact operations after guest hash checks
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /var/tmp/klokast-static-site-backup/helper.py
          - --operation
          - "{{ (item.stdout | from_json).operation_id }}"
          - --retire-staging
          - --controller-archive-sha
          - "{{ (item.stdout | from_json).archive_sha256 }}"
          - --controller-manifest-sha
          - "{{ (item.stdout | from_json).manifest_sha256 }}"
      loop: '{{ stage_verified_copies.results }}'
      loop_control:
        label: "{{ (item.stdout | from_json).operation_id }}"
      register: stage_retired

    - name: Require the exact guest staging root to be gone
      ansible.builtin.stat:
        path: /var/tmp/klokast-static-site-backup
        follow: false
      register: stage_final_root

    - name: Fail if guest backup staging remains
      ansible.builtin.assert:
        that:
          - not stage_final_root.stat.exists
