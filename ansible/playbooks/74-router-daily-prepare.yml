---
- name: Prepare one required router candidate from the activated controller engine
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Prepare the next eligible router without production cutover
      ansible.builtin.command:
        argv:
          - '{{ playbook_dir }}/../bin/platform-router-update'
          - daily-prepare
      register: router_daily_preparation
      changed_when: >-
        (router_daily_preparation.stdout | from_json).get('status') == 'prepared'
        and not (router_daily_preparation.stdout | from_json).get('reused', false)

    - name: Show the retained preparation or deferred check result
      ansible.builtin.debug:
        msg: '{{ router_daily_preparation.stdout | from_json }}'
