---
- name: Enroll the dmz VM into Tailscale over the dom0 bootstrap SSH path
  hosts: dmz
  gather_facts: false
  vars:
    ansible_user: neo
    ansible_become: true
    ansible_become_method: doas
    ansible_host: "{{ dmz_bootstrap_host }}"
    ansible_ssh_private_key_file: "{{ dmz_bootstrap_private_key_file }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ dmz_bootstrap_known_hosts_file }}
      -J {{ dmz_bootstrap_proxyjump }}
  pre_tasks:
    - name: Ensure Python 3 is present on the dmz VM
      ansible.builtin.raw: "test -x /usr/bin/python3 || doas apk add --no-cache python3"
      register: dmz_python_bootstrap
      changed_when: dmz_python_bootstrap.stdout | default('') | length > 0

    - name: Gather dmz bootstrap facts
      ansible.builtin.setup:

  tasks:
    - name: Ensure the dmz Tailscale client is installed and running
      ansible.builtin.import_role:
        name: tailscale-client

    - name: Enroll the dmz VM into Tailscale through the auth-key wrapper
      ansible.builtin.import_role:
        name: vm-tailscale-enrollment

    - name: Show the converged dmz Tailscale state
      ansible.builtin.debug:
        msg:
          - "The dmz VM now answers as {{ node_hostname }}.{{ platform_magicdns_suffix }} with {{ vm_tailscale_authkey_expected_tag }}."
          - "The next steady-state dmz phases should connect directly over Tailscale SSH."
