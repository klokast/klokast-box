---
- name: Test independent disk backup with disposable synthetic LVs
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  tasks:
    - name: Validate the selected backup test target
      ansible.builtin.assert:
        that:
          - backup_test_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - backup_test_operation_id is match('^[0-9a-f]{24}$')
          - inventory_hostname == backup_test_box ~ '-dom0'
          - backup_test_action | default('test') in ['test', 'cleanup']
          - backup_test_candidate_id is not defined or backup_test_candidate_id is match('^[0-9a-f]{24}$')
          - backup_test_layout | default('legacy-root') in ['legacy-root', 'retained-data']
          - backup_test_layout | default('legacy-root') != 'retained-data' or backup_test_candidate_id is defined

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: backup_test_authority

    - name: Check configured active controller authority
      ansible.builtin.assert:
        that:
          - (backup_test_authority.stdout | from_json).configured | bool
          - (backup_test_authority.stdout | from_json).active | bool

    - name: Check persistent dom0 storage
      ansible.builtin.command: /bin/mountpoint -q /mnt/dom0_data
      changed_when: false

    - name: Create private disposable test records
      ansible.builtin.file:
        path: "/mnt/dom0_data/klokast-vm-backup-tests/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: ['', "{{ backup_test_operation_id }}", "{{ backup_test_operation_id }}/async"]

    - name: Stage the public synthetic backup test
      ansible.builtin.copy:
        src: "../roles/vm-retained-data/files/{{ item }}"
        dest: "/mnt/dom0_data/klokast-vm-backup-tests/{{ backup_test_operation_id }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop: [vm_disk_backup.py, vm-disk-backup-test]

    - name: Stage isolated restore code for the complete synthetic backup pipeline
      ansible.builtin.copy:
        src: "../{{ item.source }}"
        dest: "/mnt/dom0_data/klokast-vm-backup-tests/{{ backup_test_operation_id }}/{{ item.target }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - {source: roles/vm-retained-data/files/retained_data.py, target: retained_data.py}
        - {source: roles/vm-retained-data/files/vm_backup_verify.py, target: vm_backup_verify.py}
        - {source: roles/vm-template-builder/files/vm-template-build-dom0, target: vm-template-build-dom0}
        - {source: lib/vm_app_compatibility.py, target: vm_app_compatibility.py}
      when: backup_test_candidate_id is defined

    - name: Test snapshot copy and source-write preservation independently of SSH
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/timeout', ('1260' if backup_test_candidate_id is defined else '360'), '/usr/bin/python3',
          '/mnt/dom0_data/klokast-vm-backup-tests/' ~ backup_test_operation_id ~ '/vm-disk-backup-test',
          '--box', backup_test_box, '--operation-id', backup_test_operation_id,
          '--layout', backup_test_layout | default('legacy-root')]
          + (['--cleanup'] if backup_test_action | default('test') == 'cleanup' else [])
          + (['--candidate-id', backup_test_candidate_id] if backup_test_candidate_id is defined else []) }}"
      async: "{{ 1320 if backup_test_candidate_id is defined else 420 }}"
      poll: 5
      vars:
        ansible_async_dir: "/mnt/dom0_data/klokast-vm-backup-tests/{{ backup_test_operation_id }}/async"
      register: backup_test_result

    - name: Report the native synthetic backup result
      ansible.builtin.debug:
        msg: "{{ backup_test_result.stdout | from_json }}"
