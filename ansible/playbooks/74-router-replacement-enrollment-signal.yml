---
- name: Publish one checked B enrollment result to the waiting dom0 worker
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact bounded enrollment signal target
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_replacement_box ~ '-dom0'
          - router_replacement_operation is match('^[0-9a-f]{24}$')
          - router_replacement_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_replacement_operation
          - router_replacement_enrollment.kind == 'klokast.router-replacement-enrollment-result.v1'
          - router_replacement_enrollment.box == router_replacement_box
          - router_replacement_enrollment.operation_id == router_replacement_operation

    - name: Stage the checked enrollment without replacing a previous result
      ansible.builtin.copy:
        content: '{{ router_replacement_enrollment | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/controller-enrollment.json'
        force: false
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Read the staged enrollment signal
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/controller-enrollment.json'
      register: router_replacement_staged_enrollment
      no_log: true

    - name: Refuse a changed or competing signal
      ansible.builtin.assert:
        that: [(router_replacement_staged_enrollment.content | b64decode | from_json) == router_replacement_enrollment]
        fail_msg: Replacement enrollment signal changed. Reconcile the exact attempt.
      no_log: true

    - name: Publish the narrow result through the installed engine
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/router-update-transaction
          - signal-enrollment
          - --box
          - '{{ router_replacement_box }}'
          - --operation-id
          - '{{ router_replacement_operation }}'
      register: router_replacement_signal_result
      changed_when: (router_replacement_signal_result.stdout | from_json).result == 'exact-enrollment-published'

    - name: Fetch the published exact enrollment result
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/enrollment-result.json'
        dest: '{{ router_replacement_result_dir }}/dom0-enrollment-result.json'
        flat: true
