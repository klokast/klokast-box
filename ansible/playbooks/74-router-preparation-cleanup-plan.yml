---
- name: Read exact unused replacement resources without granting cleanup
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require exact unused preparation selectors
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_cleanup_box ~ '-dom0'
          - router_cleanup_operation is match('^[0-9a-f]{24}$')
          - router_cleanup_token is match('^[0-9a-f]{12}$')
          - router_cleanup_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_cleanup_operation

    - name: Require the active controller before inspecting cleanup
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read the root-selected unused preparation plan
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, preparation-cleanup-plan,
               --box, '{{ router_cleanup_box }}', --operation-id, '{{ router_cleanup_operation }}']
      register: router_cleanup_native
      changed_when: false

    - name: Retain this exact native planning response
      ansible.builtin.copy:
        content: '{{ router_cleanup_native.stdout }}'
        dest: '{{ router_cleanup_result_dir }}/preparation-plan-{{ router_cleanup_token }}.json'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false

