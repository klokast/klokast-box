---
- name: Configure the iot VM over the dom0 bootstrap SSH path
  hosts: iot
  gather_facts: false
  vars:
    ansible_user: neo
    ansible_become: true
    ansible_become_method: doas
    ansible_host: "{{ iot_bootstrap_host }}"
    ansible_ssh_private_key_file: "{{ iot_bootstrap_private_key_file }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ iot_bootstrap_known_hosts_file }}
      -J {{ iot_bootstrap_proxyjump }}
  pre_tasks:
    - name: Ensure Python 3 is present on the iot VM
      ansible.builtin.raw: "test -x /usr/bin/python3 || doas apk add --no-cache python3"
      register: iot_python_bootstrap
      changed_when: iot_python_bootstrap.stdout | default('') | length > 0

    - name: Gather iot bootstrap facts
      ansible.builtin.setup:

  tasks:
    - name: Converge the iot VM base system
      ansible.builtin.import_role:
        name: vm-base

    - name: Show the next iot step
      ansible.builtin.debug:
        msg:
          - "The iot VM now has a stable neo/doas/python3 bootstrap path through {{ node_name }}-dom0."
          - "Run the iot Tailscale enrollment playbook next to switch the guest onto its steady-state Tailscale identity."
