---
- name: Remove final stale Tailscale identities after dom0 wipe
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Review and optionally delete every stale Tailscale identity for the box prefix
      ansible.builtin.import_role:
        name: tailscale-box-stale-devices
      vars:
        tailscale_box_device_prefix: "{{ decommission_box_name }}-"
        tailscale_box_device_apply: "{{ decommission_tailscale_apply | default(false) }}"
        tailscale_box_device_confirm: "{{ decommission_tailscale_confirm | default('') }}"
        tailscale_box_device_expected_confirm: "decommission tailscale identities for {{ decommission_box_name }}"
        tailscale_box_device_offline_retries: 60
        tailscale_box_device_offline_delay: 2
