---
- name: Install the controller nightly schedule
  hosts: ops
  gather_facts: false
  pre_tasks:
    - name: Require current active controller authority for schedule installation
      ansible.builtin.command: /usr/local/sbin/platform-source controllers
      delegate_to: localhost
      become: false
      changed_when: false
      register: ops_nightly_authority
      tags: always
    - name: Select local transport for the verified invoking controller
      ansible.builtin.set_fact:
        ansible_connection: local
        ansible_host: localhost
      when: inventory_hostname == (ops_nightly_authority.stdout | from_json).controllers.active.hostname
      tags: always
    - name: Select the approved public implementation for the coordinator
      ansible.builtin.command: git rev-parse HEAD
      args:
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: ops_nightly_source
      tags: ops-nightly-tools
    - name: Install the approved coordinator source on each controller
      ansible.builtin.import_tasks: ../roles/ops-controller/tasks/public-revision.yml
      vars:
        ops_controller_frozen_commit: '{{ ops_nightly_source.stdout }}'
      tags: ops-nightly-tools
  tasks:
    - name: Install the existing controller coordinator and cron entry
      ansible.builtin.import_tasks: ../roles/ops-controller/tasks/nightly.yml
