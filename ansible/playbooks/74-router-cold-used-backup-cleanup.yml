---
- import_playbook: 74-router-diagnostic-lbu-commit.yml
  vars:
    router_diagnostic_lbu_box: '{{ router_cold_cleanup_box }}'

- name: Retire exact used cold resources after original-router recovery
  hosts: k001-dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one exact used-backup cleanup selector
      ansible.builtin.assert:
        that:
          - router_cold_cleanup_box == 'k001'
          - router_cold_cleanup_operation is match('^[0-9a-f]{24}$')
          - router_cold_cleanup_engine is match('^[0-9a-f]{40}$')
          - router_cold_cleanup_source_engine is match('^[0-9a-f]{40}$')
          - router_cold_cleanup_token is match('^[0-9a-f]{12}$')
          - router_cold_cleanup_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_cleanup_operation
          - router_cold_cleanup_action in ['cold-retire-used-backup', 'cold-retire-used-inspector']
          - router_cold_cleanup_kind == ('klokast.router-cold-used-backup-retirement.v1' if router_cold_cleanup_action == 'cold-retire-used-backup' else 'klokast.router-cold-used-inspector-cleanup.v1')
          - router_cold_cleanup_status == ('used-backup-retired' if router_cold_cleanup_action == 'cold-retire-used-backup' else 'used-inspector-retired')
          - router_cold_cleanup_prefix == ('cold-used-backup-cleanup-' if router_cold_cleanup_action == 'cold-retire-used-backup' else 'cold-used-inspector-cleanup-')

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Retire only the completed test's selected owned resources
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, '{{ router_cold_cleanup_action }}',
               --box, k001, --operation-id, '{{ router_cold_cleanup_operation }}']
        stdin: '{{ router_cold_cleanup_device_receipt | to_json }}'
        stdin_add_newline: false
      register: router_cold_cleanup_receipt
      no_log: true
      changed_when: true

    - name: Require the exact current-engine retirement result
      ansible.builtin.assert:
        that:
          - (router_cold_cleanup_receipt.stdout | from_json).kind == 'klokast.router-command-result.v1'
          - (router_cold_cleanup_receipt.stdout | from_json).box == 'k001'
          - (router_cold_cleanup_receipt.stdout | from_json).action == router_cold_cleanup_action
          - (router_cold_cleanup_receipt.stdout | from_json).engine_commit == router_cold_cleanup_engine
          - (router_cold_cleanup_receipt.stdout | from_json).result.kind == router_cold_cleanup_kind
          - (router_cold_cleanup_receipt.stdout | from_json).result.operation_id == router_cold_cleanup_operation
          - (router_cold_cleanup_receipt.stdout | from_json).result.source_engine_commit == router_cold_cleanup_source_engine
          - (router_cold_cleanup_receipt.stdout | from_json).result.cleanup_engine_commit == router_cold_cleanup_engine
          - router_cold_cleanup_action == 'cold-retire-used-inspector' or (router_cold_cleanup_receipt.stdout | from_json).result.device_cleanup_sha256 == router_cold_cleanup_device_receipt.record_sha256
          - (router_cold_cleanup_receipt.stdout | from_json).result.status == router_cold_cleanup_status

    - name: Save the exact used-backup cleanup receipt
      ansible.builtin.copy:
        content: '{{ router_cold_cleanup_receipt.stdout }}'
        dest: '{{ router_cold_cleanup_result }}/{{ router_cold_cleanup_prefix }}{{ router_cold_cleanup_token }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true

- import_playbook: 74-router-diagnostic-lbu-commit.yml
  vars:
    router_diagnostic_lbu_box: '{{ router_cold_cleanup_box }}'
