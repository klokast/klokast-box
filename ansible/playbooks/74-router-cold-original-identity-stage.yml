---
- name: Stage only the checked original K001 router identity
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact K001 cold identity operation
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'k001-dom0'
          - router_cold_identity_box == 'k001'
          - router_cold_identity_operation is match('^[0-9a-f]{24}$')
          - router_cold_identity_engine is match('^[0-9a-f]{40}$')
          - router_cold_identity_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_identity_operation
          - router_cold_identity_proof.kind == 'klokast.router-cold-original-identity.v1'
          - router_cold_identity_proof.box == 'k001'
          - router_cold_identity_proof.operation_id == router_cold_identity_operation
          - router_cold_identity_proof.engine_commit == router_cold_identity_engine

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require the exact current development implementation checkout
      ansible.builtin.command:
        argv: [/usr/local/sbin/platform-source, implementation]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_identity_authority

    - name: Read the deployment source commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_identity_commit

    - name: Read the deployment source changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_identity_changes

    - name: Bind the stage to the current implementation
      ansible.builtin.assert:
        that:
          - router_cold_identity_commit.stdout == router_cold_identity_engine
          - (router_cold_identity_authority.stdout | from_json).commit == router_cold_identity_engine

    - name: Inspect private controller stage evidence
      ansible.builtin.stat:
        path: '{{ router_cold_identity_result }}'
        follow: false
      delegate_to: localhost
      become: false
      register: router_cold_identity_evidence

    - name: Require private controller stage evidence
      ansible.builtin.assert:
        that:
          - router_cold_identity_evidence.stat.isdir | default(false)
          - not (router_cold_identity_evidence.stat.islnk | default(false))
          - router_cold_identity_evidence.stat.pw_name == 'smith'
          - router_cold_identity_evidence.stat.mode == '0700'

    - name: Inspect a prior identity input
      ansible.builtin.stat:
        path: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_identity_operation }}/original-identity-input.json'
        follow: false
      register: router_cold_identity_prior

    - name: Read a prior identity input without replacing it
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_identity_operation }}/original-identity-input.json'
      when: router_cold_identity_prior.stat.exists
      register: router_cold_identity_prior_content
      no_log: true

    - name: Refuse a changed staged identity input
      ansible.builtin.assert:
        that:
          - not router_cold_identity_prior.stat.exists or
            (router_cold_identity_prior.stat.isreg | default(false) and
             router_cold_identity_prior.stat.uid == 0 and
             router_cold_identity_prior.stat.mode == '0600' and
             (router_cold_identity_prior_content.content | b64decode | from_json) == router_cold_identity_proof)

    - name: Stage the fixed identity input for the installed reader
      ansible.builtin.copy:
        content: '{{ router_cold_identity_proof | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_identity_operation }}/original-identity-input.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Let the installed engine check and record the live original identity
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-stage-identity,
               --box, k001, --operation-id, '{{ router_cold_identity_operation }}']
      changed_when: false
      register: router_cold_identity_staged

    - name: Require the exact installed-engine stage result
      ansible.builtin.assert:
        that:
          - (router_cold_identity_staged.stdout | from_json).action == 'cold-stage-identity'
          - (router_cold_identity_staged.stdout | from_json).box == 'k001'
          - (router_cold_identity_staged.stdout | from_json).engine_commit == router_cold_identity_engine
          - (router_cold_identity_staged.stdout | from_json).result == router_cold_identity_proof

    - name: Keep a bounded controller stage receipt
      ansible.builtin.copy:
        content: '{{ router_cold_identity_staged.stdout }}'
        dest: '{{ router_cold_identity_result }}/cold-original-identity-stage.json'
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Pin the running non-router Xen guests before the outage
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-baseline-capture,
               --box, k001, --operation-id, '{{ router_cold_identity_operation }}']
      changed_when: false
      register: router_cold_dependent_baseline

    - name: Require a baseline bound to the staged original identity
      ansible.builtin.assert:
        that:
          - (router_cold_dependent_baseline.stdout | from_json).action == 'cold-baseline-capture'
          - (router_cold_dependent_baseline.stdout | from_json).box == 'k001'
          - (router_cold_dependent_baseline.stdout | from_json).engine_commit == router_cold_identity_engine
          - (router_cold_dependent_baseline.stdout | from_json).result.kind == 'klokast.router-cold-dependent-baseline.v1'
          - (router_cold_dependent_baseline.stdout | from_json).result.operation_id == router_cold_identity_operation
          - (router_cold_dependent_baseline.stdout | from_json).result.identity_sha256 == router_cold_identity_proof.record_sha256

    - name: Keep the exact pre-outage dependent guest set on the controller
      ansible.builtin.copy:
        content: '{{ router_cold_dependent_baseline.stdout }}'
        dest: '{{ router_cold_identity_result }}/cold-dependent-baseline.json'
        mode: '0600'
      delegate_to: localhost
      become: false
