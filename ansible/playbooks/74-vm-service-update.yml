---
- name: Run one bounded service VM replacement step
  hosts: dom0
  gather_facts: false
  become: true
  vars:
    ansible_async_dir: /run/klokast-vm-service-async
    service_helpers: {}
    service_helper_sources:
      - {source: '../roles/vm-service-update/files/vm-service-update', name: vm-service-update}
      - {source: '../roles/vm-service-update/files/vm_service_engine.py', name: vm_service_engine.py}
      - {source: '../roles/vm-service-update/files/vm_service_finalization.py', name: vm_service_finalization.py}
      - {source: '../roles/vm-service-update/files/vm_dmz_creation.py', name: vm_dmz_creation.py}
      - {source: '../roles/vm-update-recovery/files/vm-update-transaction', name: vm-update-transaction}
      - {source: '../roles/vm-update-recovery/files/vm_update_engine.py', name: vm_update_engine.py}
      - {source: '../roles/vm-update-recovery/files/vm_update_native.py', name: vm_update_native.py}
      - {source: '../lib/xen_build_runtime.py', name: xen_build_runtime.py}
      - {source: '../lib/vm_local_images.py', name: vm_local_images.py}
      - {source: '../lib/platform_updates.py', name: platform_updates.py}
      - {source: '../lib/vm_service_retirement.py', name: vm_service_retirement.py}
      - {source: '../lib/ops_retirement.py', name: ops_retirement.py}
  pre_tasks:
    - name: Require one declared service operation
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == service_box ~ '-dom0'
          - service_role in ['bak', 'dmz', 'iot', 'vpn-egress']
          - service_action in ['status', 'prepare', 'advance', 'checks', 'reboot-start', 'reboot-complete', 'abandon', 'retire', 'retire-plan', 'creation-evidence']
    - name: Recheck current execution authority independently of frozen inventory
      ansible.builtin.command:
        argv: [/usr/local/sbin/platform-source, controllers]
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Inspect the installed recovery implementation
      ansible.builtin.stat:
        path: /usr/local/sbin/{{ item }}
        checksum_algorithm: sha256
      loop: [vm-update-transaction, vm_update_engine.py, vm_update_native.py]
      register: service_recovery_files
    - name: Start recovery implementation comparison
      ansible.builtin.set_fact:
        service_recovery_changed: false
    - name: Compare all installed recovery implementation files
      ansible.builtin.set_fact:
        service_recovery_changed: "{{ service_recovery_changed or item.stat.checksum | default('') != lookup('file', '../roles/vm-update-recovery/files/' ~ item.item, rstrip=False) | hash('sha256') }}"
      loop: '{{ service_recovery_files.results }}'
      loop_control:
        label: '{{ item.item }}'
    - name: Refuse changing recovery code while a transaction is unfinished
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json,pathlib
            root=pathlib.Path('/mnt/dom0_data/klokast-vm-updates')
            for pointer in (root/'active').glob('*.json'):
                selected=json.loads(pointer.read_text())
                journal=json.loads((root/'operations'/selected['operation_id']/'journal.json').read_text())
                if journal['stage'] not in ('complete','adopted','recovered'):
                    raise SystemExit('Resume the existing VM operation before changing recovery code')
      changed_when: false
      when: service_action not in ['status', 'retire-plan'] and service_recovery_changed
    - name: Install the existing recovery boot chain when its implementation changes
      ansible.builtin.include_role:
        name: vm-update-recovery
      when: service_action not in ['status', 'retire-plan'] and service_recovery_changed
  tasks:
    - name: Create private volatile helper storage
      ansible.builtin.tempfile:
        state: directory
        path: /run
        prefix: klokast-service-
      register: service_stage
    - name: Execute and collect the service step
      block:
        - name: Read the fixed helpers from the selected public checkout
          ansible.builtin.set_fact:
            service_helpers: "{{ service_helpers | combine({item.name: lookup('file', item.source, rstrip=False)}) }}"
          loop: '{{ service_helper_sources }}'
          no_log: true
        - name: Stage the fixed helpers and operation inputs in one transfer
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json, os, pathlib, sys
                root = pathlib.Path(sys.argv[1])
                files = json.load(sys.stdin)
                if not files or any(not name or pathlib.Path(name).name != name or name in ('.', '..')
                                    or not isinstance(content, str) for name, content in files.items()):
                    raise SystemExit('Service helper bundle contains an invalid filename or content')
                os.umask(0o077)
                for name, content in files.items():
                    with (root / name).open('x') as stream:
                        stream.write(content)
                print('Staged', len(files), 'fixed service helper files')
              - '{{ service_stage.path }}'
            stdin: >-
              {{ service_helpers | combine({'config.json': service_payload | default({}) | to_json,
                 'receipt.json': service_receipt | default({}) | to_json}) | to_json }}
          no_log: true
        - name: Recheck current authority immediately before the step
          ansible.builtin.command:
            argv: [/usr/local/sbin/platform-source, controllers]
          delegate_to: localhost
          become: false
          changed_when: false
        - name: Wait for the bounded native service operation
          ansible.builtin.command:
            argv:
              - python3
              - '{{ service_stage.path }}/vm-service-update'
              - --box
              - '{{ service_box }}'
              - --role
              - '{{ service_role }}'
              - --action
              - '{{ service_action }}'
              - --operation
              - '{{ service_operation | default("") }}'
              - --config
              - '{{ service_stage.path }}/config.json'
              - --receipt
              - '{{ service_stage.path }}/receipt.json'
              - --inputs-sha256
              - '{{ service_inputs_sha256 | default("") }}'
          async: 3900
          poll: 5
          register: service_job
          changed_when: service_action != 'status'
        - name: Publish the collected result on the controller
          ansible.builtin.copy:
            content: '{{ service_job.stdout }}'
            dest: '{{ service_result_path }}'
            mode: '0600'
          delegate_to: localhost
          become: false
      always:
        - name: Remove only the completed helper stage
          ansible.builtin.file:
            path: '{{ service_stage.path }}'
            state: absent
          when: service_job is not defined or service_job.finished | default(false) | bool
