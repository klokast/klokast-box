---
- name: Reconcile online same-box proxy clients
  hosts: ops:air:backend:dmz:iot
  gather_facts: false
  pre_tasks:
    - name: Verify current controller authority for client configuration
      ansible.builtin.command: /usr/local/sbin/platform-source controllers
      delegate_to: localhost
      become: false
      changed_when: false
      register: vpn_client_authority
    - name: Use local transport on the active controller
      ansible.builtin.set_fact:
        ansible_connection: local
        ansible_host: localhost
      when: inventory_hostname == (vpn_client_authority.stdout | from_json).controllers.active.hostname
  roles: [vpn-egress-client]
  post_tasks:
    - name: Verify DNS bootstrap and Tailscale DNS health after convergence
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, signal, socket, subprocess
            signal.alarm(30)
            state = json.loads(subprocess.check_output(['tailscale', 'status', '--json'], timeout=10))
            assert not any('dns' in message.lower() for message in state.get('Health', [])), 'Tailscale DNS health is not clear'
            assert socket.getaddrinfo('controlplane.tailscale.com', 443), 'System DNS has no control-plane answer'
            preferences = json.loads(subprocess.check_output(['tailscale', 'debug', 'prefs'], timeout=10))
            if preferences['CorpDNS']:
                assert socket.getaddrinfo(state['Self']['DNSName'], 22), 'Local Tailnet DNS failed'
            print('System DNS and Tailscale DNS health passed')
      changed_when: false
