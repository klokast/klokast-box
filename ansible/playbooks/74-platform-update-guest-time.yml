---
- name: Correct bounded UTC drift on one accepted shared VM
  hosts: dmz
  gather_facts: false
  become: true
  become_method: doas
  tasks:
    - name: Require the selected accepted guest
      ansible.builtin.assert:
        that:
          - update_time_guest == 'k001-dmz'
          - inventory_hostname == update_time_guest

    - name: Verify active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_time_controller

    - name: Require the configured active controller
      ansible.builtin.assert:
        that:
          - (update_time_controller.stdout | from_json).configured | bool
          - (update_time_controller.stdout | from_json).active | bool

    - name: Require no guest time daemon or new boot service
      ansible.builtin.command:
        argv: [/sbin/rc-service, ntpd, status]
      register: update_time_guest_daemon
      changed_when: false
      failed_when: false

    - name: Confirm the accepted guest has no active time daemon
      ansible.builtin.assert:
        that:
          - update_time_guest_daemon.rc != 0

    - name: Read controller UTC epoch
      ansible.builtin.command:
        argv: [date, -u, +%s]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_time_controller_epoch

    - name: Read guest UTC epoch
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: update_time_guest_epoch

    - name: Require a bounded clock correction
      ansible.builtin.assert:
        that:
          - >-
            ((update_time_guest_epoch.stdout | int) -
             (update_time_controller_epoch.stdout | int)) | abs <= 600

    - name: Set guest UTC from the active controller when needed
      ansible.builtin.command:
        argv: [date, -u, -s, "@{{ update_time_controller_epoch.stdout }}"]
      when: >-
        ((update_time_guest_epoch.stdout | int) -
         (update_time_controller_epoch.stdout | int)) | abs > 30

    - name: Verify guest UTC against the active controller
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: update_time_guest_verified
      changed_when: false
      until: >-
        ((update_time_guest_verified.stdout | int) -
         (lookup('pipe', 'date -u +%s') | int)) | abs <= 30
      retries: 3
      delay: 2
