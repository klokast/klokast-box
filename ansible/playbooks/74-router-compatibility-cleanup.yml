---
- name: Reclaim exact detached isolated router compatibility disks
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  pre_tasks:
    - name: Require an exact isolated compatibility operation
      ansible.builtin.assert:
        that:
          - router_compatibility_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - router_compatibility_operation is match('^[0-9a-f]{24}$')
          - inventory_hostname == router_compatibility_box ~ '-dom0'
    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
  tasks:
    - name: Create separate cleanup code storage without changing qualification source
      ansible.builtin.file:
        path: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/cleanup-code'
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage the candidate allocation module and native guards for exact cleanup
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../lib/{{ item }}.py'
        dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/cleanup-code/{{ item }}.py'
        owner: root
        group: root
        mode: '0600'
      loop:
        - router_candidate_disk
        - router_native
        - router_records
        - router_initial_installation
        - router_transaction
        - router_generations
        - router_personalize
        - router_finalize
        - xen_build_runtime
    - name: Stage the current fixed reconciliation helper without replacing operation source
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-state-copy/files/router-compatibility-dom0'
        dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/cleanup-code/router-compatibility-cleanup.py'
        owner: root
        group: root
        mode: '0600'
    - name: Reconcile only an explicitly inspected snapshot UUID
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/cleanup-code/router-compatibility-cleanup.py'
          - --box
          - '{{ router_compatibility_box }}'
          - --operation-id
          - '{{ router_compatibility_operation }}'
          - --retire-snapshot-uuid
          - '{{ router_compatibility_snapshot_uuid }}'
      when: router_compatibility_snapshot_uuid is defined
    - name: Reconcile only an explicitly inspected candidate LV UUID
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/cleanup-code/router-compatibility-cleanup.py'
          - --box
          - '{{ router_compatibility_box }}'
          - --operation-id
          - '{{ router_compatibility_operation }}'
          - --retire-candidate-uuid
          - '{{ router_compatibility_candidate_uuid }}'
      when: router_compatibility_candidate_uuid is defined
    - name: Reclaim only recorded private test disks after Xen and attachment checks
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/cleanup-code/router-compatibility-cleanup.py'
          - --box
          - '{{ router_compatibility_box }}'
          - --operation-id
          - '{{ router_compatibility_operation }}'
          - --cleanup
      register: router_compatibility_cleanup
      changed_when: (router_compatibility_cleanup.stdout | from_json).bytes_reclaimed | int > 0
