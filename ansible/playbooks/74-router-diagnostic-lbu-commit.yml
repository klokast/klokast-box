---
- name: Persist only LVM metadata from completed router diagnostic tests
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one exact dom0 target
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_diagnostic_lbu_box ~ '-dom0'
          - router_diagnostic_lbu_box is match('^[a-z0-9][a-z0-9-]{0,30}$')

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Persist the reviewed LVM metadata and require clean LBU state
      ansible.builtin.shell: |
        set -eu
        status="$(lbu status)"
        if [ -z "$status" ]; then
          exit 0
        fi
        printf '%s\n' "$status" | awk '
          ($1 == "A" && $2 ~ /^etc\/lvm\/archive\/vg0_[0-9]+-[0-9]+\.vg$/ && NF == 2) ||
          ($1 == "U" && $2 == "etc/lvm/backup/vg0" && NF == 2) { next }
          { print "Unexpected LBU change: " $0 > "/dev/stderr"; bad = 1 }
          END { exit bad }
        '
        backupdir="$(awk -F= '$1 == "LBU_BACKUPDIR" {print $2}' /etc/lbu/lbu.conf | tail -n 1)"
        if [ -z "$backupdir" ] || ! mountpoint -q "$backupdir"; then
          echo 'LBU backup mount is unavailable' >&2
          exit 1
        fi
        mount_info="$(awk -v path="$backupdir" '$2 == path {print $1 " " $4; exit}' /proc/mounts)"
        if [ -z "$mount_info" ]; then
          echo 'LBU backup mount has no exact mount record' >&2
          exit 1
        fi
        set -- $mount_info
        case ",$2," in
          *,ro,*) mount -o remount,rw "$1" "$backupdir" ;;
        esac
        lbu commit -d
        if [ -n "$(lbu status)" ]; then
          echo 'LBU still has uncommitted changes after the LVM metadata commit' >&2
          exit 1
        fi
        echo 'LVM metadata committed'
      args:
        executable: /bin/sh
      register: router_diagnostic_lbu_commit
      changed_when: "'LVM metadata committed' in router_diagnostic_lbu_commit.stdout"
