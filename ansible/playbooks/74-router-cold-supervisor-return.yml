---
- name: Request exact K001 original-router return from an open cold window
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact K001 operation and private controller result
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'k001-dom0'
          - router_cold_return_box == 'k001'
          - router_cold_return_operation is match('^[0-9a-f]{24}$')
          - router_cold_return_engine is match('^[0-9a-f]{40}$')
          - router_cold_return_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_return_operation

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read development implementation metadata
      ansible.builtin.command:
        argv: [/usr/local/sbin/platform-source, implementation]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_return_authority

    - name: Read clean controller source commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_return_commit

    - name: Read controller source changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_return_changes

    - name: Bind return signal to the current development implementation
      ansible.builtin.assert:
        that:
          - (router_cold_return_authority.stdout | from_json).commit == router_cold_return_engine
          - router_cold_return_commit.stdout == router_cold_return_engine

    - name: Inspect private controller result directory
      ansible.builtin.stat:
        path: '{{ router_cold_return_result }}'
        follow: false
      delegate_to: localhost
      become: false
      register: router_cold_return_evidence

    - name: Require owner-only controller result storage
      ansible.builtin.assert:
        that:
          - router_cold_return_evidence.stat.isdir | default(false)
          - not (router_cold_return_evidence.stat.islnk | default(false))
          - router_cold_return_evidence.stat.pw_name == 'smith'
          - router_cold_return_evidence.stat.mode == '0700'

    - name: Signal only the installed engine's exact open cold window
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-signal-return,
               --box, k001, --operation-id, '{{ router_cold_return_operation }}']
      changed_when: false
      register: router_cold_return_signal

    - name: Require a matching immutable return signal
      ansible.builtin.assert:
        that:
          - (router_cold_return_signal.stdout | from_json).kind == 'klokast.router-command-result.v1'
          - (router_cold_return_signal.stdout | from_json).box == 'k001'
          - (router_cold_return_signal.stdout | from_json).action == 'cold-signal-return'
          - (router_cold_return_signal.stdout | from_json).engine_commit == router_cold_return_engine
          - (router_cold_return_signal.stdout | from_json).result.kind == 'klokast.router-cold-supervisor-return-request.v1'
          - (router_cold_return_signal.stdout | from_json).result.operation_id == router_cold_return_operation
          - (router_cold_return_signal.stdout | from_json).result.engine_commit == router_cold_return_engine

    - name: Keep the exact return signal on the controller
      ansible.builtin.copy:
        content: '{{ router_cold_return_signal.stdout }}'
        dest: '{{ router_cold_return_result }}/cold-supervisor-return-signal.json'
        mode: '0600'
      delegate_to: localhost
      become: false
