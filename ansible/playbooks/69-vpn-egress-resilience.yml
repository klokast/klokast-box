---
- name: Exercise gateway failure and boot recovery
  hosts: vpn_egress
  gather_facts: false
  tasks:
    - name: Require a declared client for the outage probe
      ansible.builtin.assert:
        that: [platform_vpn_egress_clients | length > 0]

    - name: Test failure without direct fallback
      block:
        - name: Stop the proxy during the bounded outage test
          ansible.builtin.service:
            name: vpn-egress
            state: stopped
        - name: Require the client request to fail while the proxy is stopped
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --connect-timeout, '3', --max-time, '5', --proxy, 'http://{{ platform_vpn_egress.ipv4_address }}:7890', --noproxy, '', https://github.com]
          delegate_to: '{{ platform_vpn_egress_clients[0] }}'
          changed_when: false
          register: vpn_egress_outage
          failed_when: vpn_egress_outage.rc == 0
        - name: Require DNS outage and refuse direct public resolver bypass
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import socket, struct, sys
                query = struct.pack('!6H', 19191, 0x100, 1, 0, 0, 0) + b'\x0ccontrolplane\x09tailscale\x03com\0' + struct.pack('!2H', 1, 1)
                for address in (sys.argv[1], '223.5.5.5', '119.29.29.29', '1.1.1.1', '8.8.8.8'):
                    for transport in (socket.SOCK_DGRAM, socket.SOCK_STREAM):
                        with socket.socket(socket.AF_INET, transport) as sock:
                            sock.settimeout(3)
                            try:
                                sock.connect((address, 53))
                                if transport == socket.SOCK_DGRAM: sock.send(query)
                                else: sock.sendall(struct.pack('!H', len(query)) + query)
                                data = sock.recv(4096)
                            except (OSError, TimeoutError):
                                continue
                            assert not data, 'DNS unexpectedly answered during the gateway outage: ' + address
                print('Gateway DNS outage and direct DNS bypass checks passed')
              - '{{ vpn_egress_dns_address }}'
          delegate_to: '{{ platform_vpn_egress_clients[0] }}'
          changed_when: false
      always:
        - name: Restore the proxy after the outage test
          ansible.builtin.service:
            name: vpn-egress
            state: started

    - name: Reboot the dedicated gateway and wait for its maintenance path
      ansible.builtin.reboot:
        reboot_command: /sbin/reboot
        reboot_timeout: 180
        connect_timeout: 10
        post_reboot_delay: 5
