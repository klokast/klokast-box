---
- name: Bootstrap runner-owned repositories and Git access separately from discussions
  hosts: air
  gather_facts: false
  vars:
    air_github_known_hosts: '{{ (lookup("file", playbook_dir ~ "/../inventory-policy/group_vars/ops.yml") | from_yaml).ops_github_known_hosts }}'
  pre_tasks:
    - name: Require active development controller authority
      ansible.builtin.command: /usr/local/sbin/platform-source controllers
      delegate_to: localhost
      become: false
      changed_when: false
      tags: always
    - name: Install the controller runner Git broker
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../klokast-ops/secret-authority/bin/ksa-air-git'
        dest: /usr/local/sbin/ksa-air-git
        owner: root
        group: root
        mode: '0755'
      delegate_to: localhost
      become: true
      become_method: community.general.doas
      become_user: root
      tags: air-git-broker
  roles:
    - air-user-bootstrap
    - air-workspace
