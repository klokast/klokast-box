---
- name: Check declared router updates from the activated controller engine
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Check enabled router targets without preparing or replacing guests
      ansible.builtin.command:
        argv:
          - '{{ playbook_dir }}/../bin/platform-router-update'
          - daily-check
      register: router_daily_check
      changed_when: false

    - name: Show the router check summary and private evidence path
      ansible.builtin.debug:
        msg: '{{ router_daily_check.stdout | from_json }}'
