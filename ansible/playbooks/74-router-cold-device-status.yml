---
- name: Read exact test device source after the original router passed recovery
  hosts: k001-dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one protected K001 cold device operation
      ansible.builtin.assert:
        that:
          - router_cold_device_box == 'k001'
          - router_cold_device_operation is match('^[0-9a-f]{24}$')
          - router_cold_device_engine is match('^[0-9a-f]{40}$')
          - router_cold_device_token is match('^[0-9a-f]{12}$')
          - router_cold_device_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_device_operation

    - name: Require active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Check original recovery and archived test identity in the installed engine
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-test-device-status,
               --box, k001, --operation-id, '{{ router_cold_device_operation }}']
      changed_when: false
      register: router_cold_device_source

    - name: Require exact installed-engine device source
      ansible.builtin.assert:
        that:
          - (router_cold_device_source.stdout | from_json).kind == 'klokast.router-command-result.v1'
          - (router_cold_device_source.stdout | from_json).action == 'cold-test-device-status'
          - (router_cold_device_source.stdout | from_json).box == 'k001'
          - (router_cold_device_source.stdout | from_json).engine_commit == router_cold_device_engine
          - (router_cold_device_source.stdout | from_json).result.kind == 'klokast.router-cold-device-source.v1'
          - (router_cold_device_source.stdout | from_json).result.operation_id == router_cold_device_operation

    - name: Save the checked device source for exact controller retries
      ansible.builtin.copy:
        content: '{{ router_cold_device_source.stdout }}'
        dest: '{{ router_cold_device_result }}/cold-device-status-{{ router_cold_device_token }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
