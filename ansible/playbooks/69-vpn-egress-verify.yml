---
- name: Verify gateway identity and confinement
  hosts: vpn_egress
  gather_facts: false
  tasks:
    - name: Verify selective routing and failure-triggered relay selection without scheduled checks
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys, urllib.request, yaml
            config = yaml.safe_load(open('/etc/vpn-egress/config.yml'))
            expected = json.loads(sys.argv[1])
            expected_providers = json.loads(sys.argv[2])
            expected_group = json.loads(sys.argv[3])
            expected_health_check = json.loads(sys.argv[4])
            assert config['dns']['listen'] == sys.argv[5] + ':1053', 'Gateway DNS listener differs'
            assert config['dns']['nameserver'] == ['https://1.1.1.1/dns-query#VPN', 'https://8.8.8.8/dns-query#VPN'], 'Normal DNS must use the VPN'
            assert config['dns']['proxy-server-nameserver'] == json.loads(sys.argv[6]), 'Relay bootstrap DNS differs from country policy'
            assert not config['dns'].get('fallback'), 'Public DNS fallback is forbidden'
            assert config['mode'] == 'rule', 'Gateway must use rule mode'
            assert config['rules'] == expected, 'Gateway routing rules differ from Platform rules'
            assert config['rule-providers'] == expected_providers, 'Rule provider differs from Platform configuration'
            assert config['proxy-groups'] == [expected_group], 'Relay selection differs from Platform configuration'
            assert not config.get('proxies'), 'Direct proxy entries can enable periodic health checks'
            assert set(config['proxy-providers']) == {'relays'}, 'Unexpected relay provider'
            relays = config['proxy-providers']['relays']
            assert set(relays) == {'type', 'payload', 'health-check'} and relays['type'] == 'inline', 'Relay provider must be Platform-owned inline data'
            assert relays['health-check'] == expected_health_check, 'Scheduled relay health checks must be disabled'
            names = [proxy['name'] for proxy in relays['payload']]
            assert names and 'DIRECT' not in names, 'VPN group must not fall back to direct'
            assert config['profile']['store-selected'] is False, 'Stored manual selection must not override automatic selection'
            opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
            def api(path):
                request = urllib.request.Request('http://127.0.0.1:19090/' + path,
                    headers={'Authorization': 'Bearer ' + config['secret']})
                with opener.open(request, timeout=5) as response:
                    return json.load(response)
            assert api('configs')['mode'] == 'rule', 'Live gateway must use rule mode'
            live_group = api('proxies/VPN')
            assert live_group['type'] == 'URLTest' and not live_group['fixed'], 'Live VPN group must select by measured latency'
            assert live_group['now'] in names, 'Selected relay is not in the validated subscription'
            live_provider = api('providers/proxies')['providers']['relays']
            assert live_provider['vehicleType'] == 'Inline', 'Live relay provider must be inline'
            assert [proxy['name'] for proxy in live_provider['proxies']] == names, 'Live relays differ from the validated subscription'
            live_rules = api('rules')['rules']
            assert live_rules[-1]['type'] == 'Match' and live_rules[-1]['proxy'] == 'DIRECT', 'Live default must be direct'
            assert [(rule['type'], rule['payload']) for rule in live_rules if rule['proxy'] == 'VPN'] == [('RuleSet', 'gfw')], 'Live VPN rule must use the maintained list'
            provider = api('providers/rules')['providers']['gfw']
            assert provider['ruleCount'] > 0, 'Maintained blocked-domain list is empty or unavailable'
            print('Selective routing: maintained GFW list (%s rules); other public destinations DIRECT' % provider['ruleCount'])
          - '{{ vpn_egress_expected_rules | to_json }}'
          - '{{ vpn_egress_expected_rule_providers | to_json }}'
          - '{{ vpn_egress_expected_relay_group | to_json }}'
          - '{{ vpn_egress_expected_relay_health_check | to_json }}'
          - '{{ vpn_egress_dns_address }}'
          - '{{ vpn_egress_bootstrap_dns | to_json }}'
      changed_when: false
      register: vpn_egress_routing_check
      retries: 6
      delay: 10
      until: vpn_egress_routing_check.rc == 0
    - name: Verify the proxy runs without root privileges or capabilities
      ansible.builtin.shell: |
        set -eu
        pid=$(cat /run/vpn-egress.pid)
        test "$(awk '/^Uid:/ {print $2}' /proc/"$pid"/status)" = "$(id -u vpn-egress)"
        test "$(awk '/^CapEff:/ {print $2}' /proc/"$pid"/status)" = 0000000000000000
        /sbin/rc-service vpn-egress status
        /sbin/rc-update show default | grep -q vpn-egress
        test ! -e /sys/class/net/Meta
        /usr/sbin/nft list table inet vpn_egress >/dev/null
      changed_when: false
    - name: Verify independent gateway DNS after startup
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, signal, socket, subprocess, sys
            signal.alarm(30)
            state = json.loads(subprocess.check_output(['tailscale', 'status', '--json'], timeout=10))
            assert not any('dns' in message.lower() for message in state.get('Health', [])), 'Gateway Tailscale DNS health failed'
            source = subprocess.check_output(['resolvconf', '-l', 'eth0.klokast'], text=True, timeout=10)
            assert [line.split()[1] for line in source.splitlines() if line.startswith('nameserver ')] == json.loads(sys.argv[1]), 'Gateway bootstrap DNS differs from country policy'
            assert socket.getaddrinfo('controlplane.tailscale.com', 443), 'Gateway system DNS failed'
            preferences = json.loads(subprocess.check_output(['tailscale', 'debug', 'prefs'], timeout=10))
            if preferences['CorpDNS']:
                assert socket.getaddrinfo(state['Self']['DNSName'], 22), 'Local Tailnet DNS failed'
            print('Independent gateway bootstrap DNS passed')
          - '{{ vpn_egress_bootstrap_dns | to_json }}'
      changed_when: false

    - name: Verify gateway enrollment
      ansible.builtin.command: tailscale status --json
      changed_when: false
      register: vpn_egress_identity
    - name: Require the exact gateway identity
      ansible.builtin.assert:
        that:
          - (vpn_egress_identity.stdout | from_json).Self.HostName == node_hostname
          - (vpn_egress_identity.stdout | from_json).Self.Tags | sort == ['tag:vm', 'tag:vpn-egress']
          - (vpn_egress_identity.stdout | from_json).BackendState == 'Running'

- name: Verify declared clients can use the VPN proxy
  hosts: ops:air:backend:dmz:iot
  gather_facts: false
  pre_tasks:
    - name: Skip VMs that are not clients
      ansible.builtin.meta: end_host
      when: inventory_hostname not in (platform_vpn_egress_clients | default([]))
    - name: Use local transport on the active controller
      ansible.builtin.set_fact:
        ansible_connection: local
      when: inventory_hostname == vpn_egress_controller_hostname
  tasks:
    - name: Verify UDP and TCP DNS through the gateway before selecting it
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import secrets, socket, struct, sys
            for transport in (socket.SOCK_DGRAM, socket.SOCK_STREAM):
                ident = secrets.randbelow(65536)
                name = b''.join(bytes([len(label)]) + label.encode() for label in 'controlplane.tailscale.com'.split('.')) + b'\0'
                query = struct.pack('!6H', ident, 0x100, 1, 0, 0, 0) + name + struct.pack('!2H', 1, 1)
                with socket.socket(socket.AF_INET, transport) as sock:
                    sock.settimeout(20)
                    sock.connect((sys.argv[1], 53))
                    if transport == socket.SOCK_DGRAM:
                        sock.send(query); reply = sock.recv(4096)
                    else:
                        sock.sendall(struct.pack('!H', len(query)) + query)
                        def read(size):
                            data = b''
                            while len(data) < size:
                                chunk = sock.recv(size - len(data))
                                if not chunk: raise RuntimeError('DNS TCP response ended early')
                                data += chunk
                            return data
                        reply = read(struct.unpack('!H', read(2))[0])
                header = struct.unpack('!6H', reply[:12])
                assert header[0] == ident and header[1] & 0x8000 and header[1] & 15 == 0 and header[3] > 0, 'Gateway DNS query failed'
            print('Gateway DNS: UDP and TCP passed')
          - '{{ vpn_egress_dns_address }}'
      changed_when: false

    - name: Verify public HTTPS through the explicit proxy
      ansible.builtin.command:
        argv: [curl, --fail, --silent, --show-error, --location, --connect-timeout, '10', --max-time, '60', --proxy, 'http://{{ platform_vpn_egress.ipv4_address }}:7890', --noproxy, '', --output, /dev/null, '{{ item }}']
      # The rate-limit endpoint remains usable when a shared relay's anonymous
      # API quota is exhausted. This check verifies transport, not API allowance.
      loop: [https://github.com, https://api.github.com/rate_limit, https://raw.githubusercontent.com, https://www.google.com/generate_204, https://www.baidu.com, http://www.baidu.com]
      changed_when: false
      register: vpn_egress_probe
      retries: 3
      delay: 10
      until: vpn_egress_probe.rc == 0

    - name: Verify the proxy refuses private destinations
      ansible.builtin.command:
        argv: [curl, --fail, --silent, --max-time, '5', --proxy, 'http://{{ platform_vpn_egress.ipv4_address }}:7890', --noproxy, '', 'https://{{ item }}']
      loop: [127.0.0.1, 192.168.125.10, 100.100.100.100, 169.254.169.254, localhost]
      changed_when: false
      register: vpn_egress_denied
      failed_when: vpn_egress_denied.rc == 0
