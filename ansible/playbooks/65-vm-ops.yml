---
- name: Clone and enroll a current stable Alpine controller image without OpenSSH
  hosts: vm_dom0
  gather_facts: false
  any_errors_fatal: true
  vars:
    ops_enrollment_target: "{{ infrastructure_box }}-ops"
  pre_tasks:
    - name: Ensure the current controller has a local sbin for Tailscale wrappers
      ansible.builtin.file:
        path: /usr/local/sbin
        state: directory
        owner: root
        group: root
        mode: "0755"
      delegate_to: localhost
      become: true
      vars:
        ansible_become: true
        ansible_become_method: doas
        ansible_become_flags: -n

    - name: Install current-controller Tailscale wrapper executables before ops enrollment
      ansible.builtin.copy:
        src: "{{ hostvars[ops_enrollment_target].ops_controller_tailscale_wrapper_source_root }}/{{ item }}"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ hostvars[ops_enrollment_target].ops_controller_tailscale_wrappers }}"
      delegate_to: localhost
      become: true
      vars:
        ansible_become: true
        ansible_become_method: doas
        ansible_become_flags: -n

    - name: Check the current controller can mint the ops enrollment key
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /usr/local/sbin/ts-authkey-ops
          - --check-config
          - --hostname
          - "{{ ops_enrollment_target }}"
          - --tags
          - tag:ops
      delegate_to: localhost
      become: false
      changed_when: false
  roles:
    - infrastructure-guest

- name: Verify the exact enrolled controller through Tailscale SSH
  hosts: ops
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for Tailscale maintenance access
      ansible.builtin.wait_for_connection:
        timeout: 180
    - name: Read the controller device and Xen identities
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import json, pathlib, subprocess
            status = json.loads(subprocess.check_output(['tailscale', 'status', '--json']))
            prefs = json.loads(subprocess.check_output(['tailscale', 'debug', 'prefs']))
            print(json.dumps({'hostname': status['Self']['HostName'], 'tags': status['Self']['Tags'],
                              'device_id': status['Self']['ID'], 'online': status['BackendState'] == 'Running',
                              'ssh': prefs['RunSSH'],
                              'uuid': pathlib.Path('/sys/hypervisor/uuid').read_text().strip()}))
      register: ops_enrolled
      changed_when: false
    - name: Require the assigned Xen VM and enrolled Tailscale device
      ansible.builtin.assert:
        that:
          - (ops_enrolled.stdout | from_json).hostname == node_hostname
          - (ops_enrolled.stdout | from_json).tags == ['tag:ops']
          - (ops_enrolled.stdout | from_json).online
          - (ops_enrolled.stdout | from_json).ssh
          - (ops_enrolled.stdout | from_json).uuid == ops_assignment.uuid
          - ops_assignment.enrollment_result is not defined or (ops_enrolled.stdout | from_json).device_id == ops_assignment.enrollment_result.device_id
      vars:
        ops_assignment: '{{ (hostvars[node_name ~ "-dom0"].infrastructure_enrollment.stdout | from_json).state }}'

- name: Persist only the verified controller permanent boot recipe
  hosts: vm_dom0
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install the permanent controller Xen configuration
      ansible.builtin.copy:
        src: /mnt/dom0_data/klokast-infrastructure/ops/ops.cfg
        dest: /etc/xen/ops.cfg
        remote_src: true
        owner: root
        group: root
        mode: '0600'
    - name: Enable the verified controller at dom0 boot
      ansible.builtin.file:
        src: /etc/xen/ops.cfg
        dest: /etc/xen/auto/ops.cfg
        state: link
    - name: Persist controller boot links on diskless dom0
      ansible.builtin.command: lbu commit -d
      changed_when: false

- name: Wait for the ops controller VM to be reachable over steady-state Tailscale SSH
  hosts: ops
  gather_facts: false
  tasks:
    - name: Wait for ops VM connectivity after enrollment
      ansible.builtin.wait_for_connection:
        delay: 2
        sleep: 3
        timeout: 180

- name: Converge the ops controller VM baseline
  hosts: ops
  gather_facts: false
  pre_tasks:
    - name: Gather ops VM steady-state facts
      ansible.builtin.setup:

  tasks:
    - name: Keep the ops VM Tailscale client converged first
      ansible.builtin.import_role:
        name: tailscale-client

    - name: Reset the ops VM SSH connection after Tailscale SSH changes
      ansible.builtin.meta: reset_connection

    - name: Keep the ops VM base system converged
      ansible.builtin.import_role:
        name: vm-base

    - name: Converge the ops VM firewall baseline
      ansible.builtin.import_role:
        name: podman-vm-firewall

    - name: Converge the ops controller authority split
      ansible.builtin.import_role:
        name: ops-controller

    - name: Show the ops VM state
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} controller baseline is installed."
          - "Complete independent Instance and credential setup before promotion."
          - "Tailscale identity: {{ ansible_host }}"
          - "Infra access: tailscale ssh {{ ops_infra_user }}@{{ node_hostname }}"
