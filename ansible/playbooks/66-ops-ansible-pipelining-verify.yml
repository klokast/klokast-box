---
- name: Verify privileged pipelining on explicitly selected managed hosts
  hosts: all
  serial: 1
  gather_facts: false
  become: true
  become_method: community.general.doas
  tasks:
    - name: Require the verified current become plugin in the controller runtime
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            from pathlib import Path
            from ansible.plugins.loader import init_plugin_loader, become_loader
            init_plugin_loader()
            plugin = become_loader.get('community.general.doas')
            expected = '/usr/local/share/klokast/ansible/current/ansible_collections/community/general/plugins/become/doas.py'
            assert Path(plugin._original_path).resolve() == Path(expected).resolve(), 'controller loaded an unqualified doas plugin'
            plugin.set_options(direct={'allow_pipelining': True})
            assert plugin.pipelining, 'doas plugin refuses pipelining'
            print('Verified current doas plugin supports privileged pipelining')
      environment:
        ANSIBLE_CONFIG: '{{ playbook_dir }}/../ansible.cfg'
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require explicit passwordless pipelining intent
      ansible.builtin.assert:
        that:
          - ansible_doas_allow_pipelining | default(false) | bool
          - ansible_become_flags == '-n'
          - ansible_limit | default('') | length > 0
        fail_msg: Select managed nopass hosts with --limit before testing pipelining.

    - name: Verify the privileged remote execution identity
      ansible.builtin.command:
        argv: [/usr/bin/id, -u]
      changed_when: false
      register: ops_pipelining_identity

    - name: Require root execution through the configured become plugin
      ansible.builtin.assert:
        that: ops_pipelining_identity.stdout | trim == '0'
