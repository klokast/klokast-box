---
- name: Create the private operations journal on the selected controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_method: community.general.doas
  become_flags: -n
  pre_tasks:
    - name: Require active authority or explicit same-box image authority
      ansible.builtin.command:
        argv: "{{ ['/usr/local/sbin/klokast-controller-guard', '--status', '--json'] + (['--require-local-image-box', local_image_box] if local_image_box is defined else ['--require-active']) }}"
      become: false
      changed_when: false
      register: journal_controller

    - name: Refuse an unconfigured controller or incorrect operation scope
      ansible.builtin.assert:
        that:
          - (journal_controller.stdout | from_json).configured
          - (journal_controller.stdout | from_json).local_image_box | default('') == local_image_box if local_image_box is defined else (journal_controller.stdout | from_json).active

  tasks:
    - name: Create owner-only journal directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ops_infra_user }}"
        group: "{{ ops_infra_user }}"
        mode: "0700"
      loop:
        - /var/lib/klokast/operations-journal
        - /var/lib/klokast/operations-journal/cases
        - /var/lib/klokast/operations-journal/forum
