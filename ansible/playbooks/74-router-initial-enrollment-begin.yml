---
- name: Fence one first-router Tailnet enrollment before minting a key
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require exact router enrollment target and grant
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_initial_box ~ '-dom0'
          - router_initial_operation is match('^[0-9a-f]{24}$')
          - router_initial_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_initial_operation
          - router_initial_enrollment_grant.box == router_initial_box
          - router_initial_enrollment_grant.operation_id == router_initial_operation

    - name: Require the activated router engine
      ansible.builtin.import_role:
        name: router-update-recovery

    - name: Bind enrollment grant to the activated engine
      ansible.builtin.assert:
        that: [router_initial_enrollment_grant.engine_commit == router_recovery_commit.stdout]

    - name: Stage the closed first enrollment module
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../lib/router_initial_enrollment.py'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/router_initial_enrollment.py'
        owner: root
        group: root
        mode: '0600'

    - name: Stage the first enrollment command
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-initial-preparation/files/router-initial-enrollment-dom0'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/router-initial-enrollment-dom0'
        owner: root
        group: root
        mode: '0700'

    - name: Stage the short enrollment grant
      ansible.builtin.copy:
        content: '{{ router_initial_enrollment_grant | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/initial-enrollment-grant.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Record or reconcile the first enrollment attempt
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/router-initial-enrollment-dom0'
          - --box
          - '{{ router_initial_box }}'
          - --operation-id
          - '{{ router_initial_operation }}'
          - --engine
          - '{{ router_initial_enrollment_grant.engine_commit }}'
      changed_when: true

    - name: Fetch the durable enrollment attempt record
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/initial-enrollment-begin.json'
        dest: '{{ router_initial_result_dir }}/initial-enrollment-begin.json'
        flat: true
