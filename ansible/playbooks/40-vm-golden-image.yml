---
- name: Build the Alpine VIRT Podman golden image for the selected node
  hosts: vm_dom0
  gather_facts: false
  tasks:
    - name: Unlock reviewed Podman image maintenance packages in RAM
      ansible.builtin.import_role:
        name: dom0-apk-policy
        tasks_from: maintenance-unlock.yml
      vars:
        dom0_maintenance_packages:
          - curl
          - kpartx
          - sfdisk
          - xorriso

    - name: Build the Podman image with transient dom0 tooling
      block:
        - name: Prepare shared Alpine VIRT assets on dom0
          ansible.builtin.import_role:
            name: alpine-virt-assets

        - name: Build the sealed Alpine Podman template root disk
          ansible.builtin.import_role:
            name: podman-template-rootfs
      always:
        - name: Remove Podman image maintenance packages and lock APK
          ansible.builtin.import_role:
            name: dom0-apk-policy
            tasks_from: maintenance-lock.yml

    - name: Persist Podman golden-image build state on the diskless dom0 host
      ansible.builtin.shell: |
        set -eu
        apk cache sync >/dev/null
        backupdir="$(awk -F= '$1 == "LBU_BACKUPDIR" {print $2}' /etc/lbu/lbu.conf | tail -n 1)"
        if [ -n "$backupdir" ]; then
          mount_info="$(awk -v backupdir="$backupdir" '$2 == backupdir {print $1 " " $4; exit}' /proc/mounts)"
          if [ -n "$mount_info" ]; then
            set -- $mount_info
            case ",$2," in
              *,ro,*) mount -o remount,rw "$1" "$backupdir" ;;
            esac
          fi
        fi
        lbu commit -d
      args:
        executable: /bin/sh
      changed_when: false
