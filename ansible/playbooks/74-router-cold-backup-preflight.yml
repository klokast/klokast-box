---
- name: Check the accepted K001 router before a supervised cold backup
  hosts: "{{ router_cold_box }}-dom0"
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require an exact K001 preflight target and private output
      ansible.builtin.assert:
        that:
          - router_cold_box == 'k001'
          - inventory_hostname == 'k001-dom0'
          - router_cold_operation is match('^[0-9a-f]{24}$')
          - router_cold_expected_generation is match('^[0-9a-f]{64}$')
          - router_cold_output == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_operation ~ '/cold-preflight.json'

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Verify the running accepted router with the installed recovery reader
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, verify-boot-assignment, --box, k001]
      register: router_cold_boot
      changed_when: false

    - name: Read the protected accepted assignment
      ansible.builtin.slurp:
        src: /mnt/dom0_data/klokast-router-updates/accepted.json
      register: router_cold_assignment_file
      no_log: true

    - name: Read pending and installation markers without following links
      ansible.builtin.stat:
        path: '/mnt/dom0_data/klokast-router-updates/{{ item }}'
        follow: false
      loop: [pending.json, installation.json]
      register: router_cold_markers

    - name: Require the exact accepted legacy assignment and no other transaction
      ansible.builtin.assert:
        that:
          - (router_cold_assignment_file.content | b64decode | from_json).kind == 'klokast.router-assignment.v1'
          - (router_cold_assignment_file.content | b64decode | from_json).box == 'k001'
          - (router_cold_assignment_file.content | b64decode | from_json).current_sha256 == router_cold_expected_generation
          - (router_cold_assignment_file.content | b64decode | from_json).previous_sha256 is none
          - not router_cold_markers.results[0].stat.exists
          - not router_cold_markers.results[1].stat.exists
          - (router_cold_boot.stdout | from_json).result == 'accepted-assignment-verified'

    - name: Read the exact accepted generation
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/records/{{ router_cold_expected_generation }}.json'
      register: router_cold_generation_file
      no_log: true

    - name: Read the router and backup LV inventory
      ansible.builtin.command:
        argv: [/sbin/lvs, --reportformat, json, --units, b, --nosuffix, -o, 'lv_name,lv_path,lv_uuid,lv_size,origin,lv_tags', vg0]
      register: router_cold_lvs
      changed_when: false

    - name: Read free space in the physical volume group
      ansible.builtin.command:
        argv: [/sbin/vgs, --reportformat, json, --units, b, --nosuffix, -o, 'vg_name,vg_free', vg0]
      register: router_cold_vgs
      changed_when: false

    - name: Read the independent dom0 WAN route
      ansible.builtin.command:
        argv: [/sbin/ip, -4, route, get, 1.1.1.1]
      register: router_cold_route
      changed_when: false

    - name: Require clean diskless dom0 persistence before a backup
      ansible.builtin.command:
        argv: [/usr/sbin/lbu, status]
      register: router_cold_lbu
      changed_when: false

    - name: Bind the exact legacy disk, Xen identity, and backup space
      ansible.builtin.assert:
        that:
          - (router_cold_generation_file.content | b64decode | from_json).record_sha256 == router_cold_expected_generation
          - (router_cold_generation_file.content | b64decode | from_json).origin == 'legacy'
          - (router_cold_generation_file.content | b64decode | from_json).disk.path == '/dev/vg0/lv_router'
          - (router_cold_generation_file.content | b64decode | from_json).disk.bytes == 2147483648
          - (router_cold_generation_file.content | b64decode | from_json).xen.uuid == '7cd7d3df-4c98-4c88-b87e-169272274723'
          - router_cold_router_lvs | length == 1
          - router_cold_router_lvs[0].lv_uuid == (router_cold_generation_file.content | b64decode | from_json).disk.uuid
          - (router_cold_router_lvs[0].lv_size | int) == 2147483648
          - router_cold_router_lvs[0].origin == ''
          - router_cold_hold_lvs | length == 0
          - router_cold_candidate_lvs | length == 0
          - (router_cold_vgs.stdout | from_json).report[0].vg[0].vg_name == 'vg0'
          - ((router_cold_vgs.stdout | from_json).report[0].vg[0].vg_free | float) > 6442450944
          - "'dev br-wan' in router_cold_route.stdout"
          - router_cold_lbu.stdout | trim == ''
        fail_msg: K001's accepted router, backup space, or dom0 persistence changed; keep the router running.
      vars:
        router_cold_router_lvs: >-
          {{ (router_cold_lvs.stdout | from_json).report[0].lv
             | selectattr('lv_path', 'equalto', '/dev/vg0/lv_router') | list }}
        router_cold_hold_lvs: >-
          {{ (router_cold_lvs.stdout | from_json).report[0].lv
             | selectattr('lv_name', 'match', '^routercold_') | list }}
        router_cold_candidate_lvs: >-
          {{ (router_cold_lvs.stdout | from_json).report[0].lv
             | selectattr('lv_name', 'match', '^routergen_') | list }}

    - name: Inspect the controller evidence directory
      ansible.builtin.stat:
        path: '{{ router_cold_output | dirname }}'
        follow: false
      delegate_to: localhost
      become: false
      register: router_cold_output_directory

    - name: Refuse an unsafe or reused controller evidence path
      ansible.builtin.assert:
        that:
          - router_cold_output_directory.stat.isdir | default(false)
          - not (router_cold_output_directory.stat.islnk | default(false))
          - router_cold_output_directory.stat.pw_name == 'smith'
          - router_cold_output_directory.stat.mode == '0700'
        fail_msg: The K001 cold-backup preflight needs a new private controller operation directory.
      delegate_to: localhost
      become: false

    - name: Check that the controller preflight receipt is new
      ansible.builtin.stat:
        path: '{{ router_cold_output }}'
        follow: false
      delegate_to: localhost
      become: false
      register: router_cold_existing_receipt

    - name: Refuse to overwrite a cold-backup preflight receipt
      ansible.builtin.assert:
        that: [not router_cold_existing_receipt.stat.exists]
      delegate_to: localhost
      become: false

    - name: Store bounded read-only preflight evidence on the controller
      ansible.builtin.copy:
        dest: '{{ router_cold_output }}'
        mode: '0600'
        content: >-
          {{ {
            'kind': 'klokast.router-cold-backup-preflight.v1',
            'box': 'k001',
            'operation_id': router_cold_operation,
            'accepted_sha256': router_cold_expected_generation,
            'disk': (router_cold_generation_file.content | b64decode | from_json).disk,
            'boot': (router_cold_generation_file.content | b64decode | from_json).boot,
            'xen_uuid': (router_cold_generation_file.content | b64decode | from_json).xen.uuid,
            'boot_verified': true,
            'pending_absent': true,
            'installation_absent': true,
            'hold_lv_absent': true,
            'candidate_lv_absent': true,
            'lbu_clean': true,
            'vg_free_bytes': ((router_cold_vgs.stdout | from_json).report[0].vg[0].vg_free | float | int),
            'independent_wan_route': router_cold_route.stdout
          } | to_nice_json }}
      delegate_to: localhost
      become: false
      no_log: true
