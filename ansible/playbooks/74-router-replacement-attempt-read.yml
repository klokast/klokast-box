---
- name: Read the one durable B enrollment attempt while A is stopped
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact operation and controller evidence destination
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_replacement_box ~ '-dom0'
          - router_replacement_operation is match('^[0-9a-f]{24}$')
          - router_replacement_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_replacement_operation

    - name: Fetch the protected one-time enrollment attempt
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/enrollment-attempt.json'
        dest: '{{ router_replacement_result_dir }}/dom0-enrollment-attempt.json'
        flat: true

    - name: Fetch the current pending router transaction
      ansible.builtin.fetch:
        src: /mnt/dom0_data/klokast-router-updates/pending.json
        dest: '{{ router_replacement_result_dir }}/dom0-enrollment-pending.json'
        flat: true
