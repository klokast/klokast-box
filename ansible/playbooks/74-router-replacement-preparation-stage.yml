---
- name: Stage one retained replacement router preparation without starting it
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require exact replacement selectors and bounded source paths
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_replacement_box ~ '-dom0'
          - router_replacement_operation is match('^[0-9a-f]{24}$')
          - router_replacement_request.box == router_replacement_box
          - router_replacement_request.operation_id == router_replacement_operation
          - router_replacement_request.mode == 'replacement'
          - router_replacement_input_dir == '/var/cache/klokast/updates/router/replacement-' ~ router_replacement_operation
          - router_replacement_transfer_parts is sequence
          - router_replacement_transfer_parts | length >= 2
          - router_replacement_transfer_parts | length <= 528
          - router_replacement_finalizer_request.box == router_replacement_box
          - router_replacement_finalizer_request.operation_id == router_replacement_operation
          - router_replacement_finalizer_request.engine_commit == router_replacement_request.engine_commit
          - router_replacement_finalizer_request.preparation_sha256 is match('^[0-9a-f]{64}$')
          - router_replacement_finalizer_parts is sequence
          - router_replacement_finalizer_parts | length >= 2
          - router_replacement_finalizer_parts | length <= 528

    - name: Install the activated router record reader and boot protection
      ansible.builtin.import_role:
        name: router-update-recovery

    - name: Require the current activated engine for this preparation
      ansible.builtin.assert:
        that:
          - router_replacement_request.engine_commit == router_recovery_commit.stdout

    - name: Create the private replacement preparation directory
      ansible.builtin.file:
        path: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: ['', parts, parts/kernel, parts/initramfs]

    - name: Declare the immutable replacement preparation inputs
      ansible.builtin.set_fact:
        router_replacement_documents:
          - {name: request, value: '{{ router_replacement_request }}'}
          - {name: candidate-job, value: '{{ router_replacement_job }}'}
          - {name: release, value: '{{ router_replacement_release }}'}
          - {name: candidate-source, value: '{{ router_replacement_source }}'}
          - {name: check, value: '{{ router_replacement_check }}'}
          - {name: policy, value: '{{ router_replacement_policy }}'}
          - {name: accepted, value: '{{ router_replacement_accepted }}'}
          - {name: accepted-profile, value: '{{ router_replacement_accepted_profile }}'}
          - {name: parts, value: '{{ router_replacement_transfer_parts }}'}
          - name: profile
            value: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../update-profiles/router-alpine-v2.json') | from_json }}"
      no_log: true

    - name: Stage replacement preparation inputs without replacing an existing request
      ansible.builtin.copy:
        content: '{{ item.value | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/{{ item.name }}.json'
        force: false
        owner: root
        group: root
        mode: '0600'
      loop: '{{ router_replacement_documents }}'
      no_log: true

    - name: Read the staged replacement preparation inputs
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/{{ item.name }}.json'
      loop: '{{ router_replacement_documents }}'
      register: router_replacement_staged_documents
      no_log: true

    - name: Refuse changes to any existing replacement preparation request
      ansible.builtin.assert:
        that: [(item.content | b64decode | from_json) == item.item.value]
        fail_msg: Replacement router preparation inputs changed. Resume the exact recorded operation.
      loop: '{{ router_replacement_staged_documents.results }}'
      no_log: true

    - name: Require closed part names before copying to dom0
      ansible.builtin.assert:
        that:
          - item.artifact in ['kernel', 'initramfs']
          - item.name is match('^part-[0-9]{4}$')
          - item.sha256 is match('^[0-9a-f]{64}$')
          - item.bytes | int > 0
          - item.bytes | int <= 2097152
      loop: '{{ router_replacement_transfer_parts }}'

    - name: Transfer the exact bounded replacement preparation boot parts
      ansible.builtin.copy:
        src: '{{ router_replacement_input_dir }}/transfer/{{ item.artifact }}/{{ item.name }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/parts/{{ item.artifact }}/{{ item.name }}'
        owner: root
        group: root
        mode: '0600'
      loop: '{{ router_replacement_transfer_parts }}'
      loop_control:
        label: '{{ item.artifact }}/{{ item.name }}'
      register: router_replacement_part_copy
      retries: 3
      delay: 3
      until: router_replacement_part_copy is succeeded

    - name: Stage the closed replacement preparation module set
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../lib/{{ item }}.py'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/{{ item }}.py'
        owner: root
        group: root
        mode: '0600'
      loop: [router_replacement_preparation, router_replacement_finalization, router_replacement_enrollment,
             router_preparation_assets, router_initial_installation, router_candidate,
             router_candidate_preparation, router_candidate_disk, router_copy_native, router_copy_contract, router_generations,
             router_native, router_records, router_transaction, router_finalize,
             router_personalize, router_overlay_ipv6, router_initial_contact, router_updates, router_tailscale, router_state,
             platform_updates, platform_update_metadata, xen_build_runtime]

    - name: Stage the shared bounded input assembler
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-alpine-rootfs/files/router-template-assemble-dom0'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/router-input-assembler.py'
        owner: root
        group: root
        mode: '0600'

    - name: Stage the fixed retained preparation command
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-replacement-preparation/files/router-replacement-prepare-dom0'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/router-replacement-prepare-dom0'
        owner: root
        group: root
        mode: '0700'

    - name: Assemble and verify the two exact networkless boot inputs
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/router-replacement-prepare-dom0'
          - --box
          - '{{ router_replacement_box }}'
          - --operation-id
          - '{{ router_replacement_operation }}'
          - --engine
          - '{{ router_replacement_request.engine_commit }}'
          - --assemble-only
      register: router_replacement_assembled
      changed_when: (router_replacement_assembled.stdout | from_json).assembled | bool

    - name: Create private replacement cleanup input directories
      ansible.builtin.file:
        path: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: ['', parts, parts/kernel, parts/initramfs]

    - name: Stage immutable replacement cleanup documents
      ansible.builtin.set_fact:
        router_replacement_finalizer_documents:
          - {name: request, value: '{{ router_replacement_finalizer_request }}'}
          - {name: parts, value: '{{ router_replacement_finalizer_parts }}'}
      no_log: true

    - name: Copy immutable replacement cleanup documents
      ansible.builtin.copy:
        content: '{{ item.value | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/{{ item.name }}.json'
        force: false
        owner: root
        group: root
        mode: '0600'
      loop: '{{ router_replacement_finalizer_documents }}'
      no_log: true

    - name: Read immutable replacement cleanup documents
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/{{ item.name }}.json'
      loop: '{{ router_replacement_finalizer_documents }}'
      register: router_replacement_finalizer_staged
      no_log: true

    - name: Refuse a changed replacement cleanup source
      ansible.builtin.assert:
        that: [(item.content | b64decode | from_json) == item.item.value]
        fail_msg: Replacement cleanup inputs changed. Resume the exact recorded operation.
      loop: '{{ router_replacement_finalizer_staged.results }}'
      no_log: true

    - name: Require bounded cleanup boot part identities
      ansible.builtin.assert:
        that:
          - item.artifact in ['kernel', 'initramfs']
          - item.name is match('^part-[0-9]{4}$')
          - item.sha256 is match('^[0-9a-f]{64}$')
          - item.bytes | int > 0
          - item.bytes | int <= 2097152
      loop: '{{ router_replacement_finalizer_parts }}'

    - name: Transfer immutable replacement cleanup boot parts
      ansible.builtin.copy:
        src: '{{ router_replacement_input_dir }}/finalization/transfer/{{ item.artifact }}/{{ item.name }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/parts/{{ item.artifact }}/{{ item.name }}'
        owner: root
        group: root
        mode: '0600'
      loop: '{{ router_replacement_finalizer_parts }}'
      loop_control:
        label: '{{ item.artifact }}/{{ item.name }}'

    - name: Stage the bounded cleanup input assembler
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-alpine-rootfs/files/router-template-assemble-dom0'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/router-input-assembler.py'
        owner: root
        group: root
        mode: '0600'

    - name: Stage the fixed replacement cleanup command
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-replacement-finalization/files/router-replacement-finalize-dom0'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/router-replacement-finalize-dom0'
        owner: root
        group: root
        mode: '0700'

    - name: Assemble the exact networkless cleanup boot inputs
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/finalization/router-replacement-finalize-dom0'
          - --box
          - '{{ router_replacement_box }}'
          - --operation-id
          - '{{ router_replacement_operation }}'
          - --engine
          - '{{ router_replacement_request.engine_commit }}'
          - --assemble-only
      register: router_replacement_finalizer_assembled
      changed_when: (router_replacement_finalizer_assembled.stdout | from_json).assembled | bool
