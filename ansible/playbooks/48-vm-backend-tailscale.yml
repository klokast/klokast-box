---
- name: Enroll the backend VM into Tailscale over the dom0 bootstrap SSH path
  hosts: backend
  gather_facts: false
  vars:
    ansible_host: "{{ backend_bootstrap_host }}"
    ansible_ssh_private_key_file: "{{ backend_bootstrap_private_key_file }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ backend_bootstrap_known_hosts_file }}
      -J {{ backend_bootstrap_proxyjump }}
  pre_tasks:
    - name: Ensure Python 3 is present on the backend VM
      ansible.builtin.raw: "test -x /usr/bin/python3 || apk add --no-cache python3"
      register: backend_python_bootstrap
      changed_when: backend_python_bootstrap.stdout | default('') | length > 0

    - name: Gather backend bootstrap facts
      ansible.builtin.setup:

  tasks:
    - name: Ensure the backend Tailscale client is installed and running
      ansible.builtin.import_role:
        name: tailscale-client

    - name: Enroll the backend VM into Tailscale through the auth-key wrapper
      ansible.builtin.import_role:
        name: vm-tailscale-enrollment

    - name: Show the converged backend Tailscale state
      ansible.builtin.debug:
        msg:
          - "The backend VM now answers as {{ node_hostname }}.{{ platform_magicdns_suffix }} with {{ vm_tailscale_authkey_expected_tag }}."
          - "The next steady-state backend phases should connect directly over Tailscale SSH."
