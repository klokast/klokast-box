---
- name: Preserve the declared maintenance transport
  ansible.builtin.set_fact:
    infrastructure_maintenance_ssh_args: '{{ ansible_ssh_common_args | default("") }}'
- name: Detect an existing online infrastructure guest identity
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, status, --json]
  delegate_to: localhost
  become: false
  changed_when: false
  register: infrastructure_controller_tailnet
- name: Select exact enrolled infrastructure guest peers
  ansible.builtin.set_fact:
    infrastructure_online_peers: "{{ ((infrastructure_controller_tailnet.stdout | from_json).Peer | default({})).values() | selectattr('HostName', 'equalto', node_hostname) | selectattr('Online', 'equalto', true) | list }}"
- name: Refuse ambiguous live infrastructure guest identities
  ansible.builtin.assert:
    that: [infrastructure_online_peers | length <= 1]
- name: Skip bootstrap when the exact enrolled infrastructure guest is online
  ansible.builtin.meta: end_host
  when:
    - infrastructure_online_peers | length == 1
    - infrastructure_online_peers[0].Tags | default([]) == (['tag:vm', 'tag:' ~ infrastructure_role])
- name: Select the temporary underlay bootstrap transport
  ansible.builtin.set_fact:
    ansible_host: '{{ infrastructure_config.address.split("/")[0] }}'
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/github-klokast-codex"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.ssh/known_hosts_klokast_{{ node_name }}_{{ infrastructure_role | replace("-", "_") }}
      -o ProxyCommand='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -W %h:%p neo@{{ node_name }}-dom0'
- name: Wait for the new infrastructure guest bootstrap connection
  ansible.builtin.wait_for_connection:
    timeout: 120
