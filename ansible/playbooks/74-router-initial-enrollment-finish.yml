---
- name: Bind the pinned guest enrollment to its retained first-router disk
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact first enrollment completion
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_initial_box ~ '-dom0'
          - router_initial_operation is match('^[0-9a-f]{24}$')
          - router_initial_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_initial_operation
          - router_initial_finish_grant.box == router_initial_box
          - router_initial_finish_grant.operation_id == router_initial_operation

    - name: Require the activated router engine
      ansible.builtin.import_role:
        name: router-update-recovery

    - name: Bind enrollment completion to the activated engine
      ansible.builtin.assert:
        that: [router_initial_finish_grant.engine_commit == router_recovery_commit.stdout]

    - name: Stage the exact checked guest enrollment receipt
      ansible.builtin.copy:
        content: '{{ router_initial_guest_receipt | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/initial-enrollment-guest.json'
        force: false
        owner: root
        group: root
        mode: '0600'

    - name: Read back the staged guest identity
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/initial-enrollment-guest.json'
      register: router_initial_guest_staged

    - name: Refuse changed guest identity on retry
      ansible.builtin.assert:
        that: [(router_initial_guest_staged.content | b64decode | from_json) == router_initial_guest_receipt]
        fail_msg: First enrollment guest receipt changed. Reconcile the exact operation.

    - name: Stage the short enrollment completion grant
      ansible.builtin.copy:
        content: '{{ router_initial_finish_grant | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/initial-enrollment-finish-grant.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Record the exact first router Tailnet identity
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/router-initial-enrollment-dom0'
          - --box
          - '{{ router_initial_box }}'
          - --operation-id
          - '{{ router_initial_operation }}'
          - --engine
          - '{{ router_initial_finish_grant.engine_commit }}'
          - --finish
      changed_when: true

    - name: Fetch the retained first router enrollment result
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/initial-enrollment-result.json'
        dest: '{{ router_initial_result_dir }}/initial-enrollment-result.json'
        flat: true
