---
# status reads; check tests the relay in use one test at a time and renews a due
# list; refresh renews the list, then checks. See doc/vpn-egress.md#relay-check.
- name: Operate the native subscription provider
  hosts: vpn_egress
  gather_facts: false
  tasks:
    - name: Read or update the native subscription
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/vpn-egress-relays
          - '{{ vpn_egress_provider_action | default("status") }}'
      changed_when: vpn_egress_provider_action | default('status') != 'status'
