---
- name: Verify explicit controller convergence before publishing its revisions
  hosts: ops
  gather_facts: false
  any_errors_fatal: true
  roles:
    - ops-controller-verification
  tasks:
    - name: Read the independently installed Instance revision
      ansible.builtin.command:
        argv: [git, -C, /home/smith/private/klokast/instance, rev-parse, HEAD]
      become_user: smith
      changed_when: false
      register: ops_converged_instance
    - name: Require the selected Instance revision before recording convergence
      ansible.builtin.assert:
        that: ops_converged_instance.stdout == ops_controller_frozen_instance_commit
    - name: Pass successful verification to the record writer in this run only
      ansible.builtin.set_fact:
        ops_convergence_verified: '{{ ops_convergence }}'

- name: Record verified explicit controller configuration
  hosts: dom0
  gather_facts: false
  tasks:
    - name: Recheck active controller authority
      ansible.builtin.command: /usr/local/sbin/platform-source controllers
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Require the exact convergence target
      ansible.builtin.assert:
        that:
          - inventory_hostname == ops_replace_box ~ '-dom0'
          - hostvars[ops_replace_box ~ '-ops'].ops_convergence_verified | default({}) == ops_convergence
    - name: Create protected controller record staging
      ansible.builtin.file:
        path: /mnt/dom0_data/klokast-infrastructure/staging
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage the controller record writer
      ansible.builtin.copy:
        src: '../roles/infrastructure-guest/files/{{ item }}'
        dest: '/mnt/dom0_data/klokast-infrastructure/staging/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [infrastructure-guest-dom0, ops-controller-replacement]
    - name: Stage shared record runtime
      ansible.builtin.copy:
        src: ../lib/xen_build_runtime.py
        dest: /mnt/dom0_data/klokast-infrastructure/staging/xen_build_runtime.py
        owner: root
        group: root
        mode: '0600'
    - name: Stage verified convergence revisions
      ansible.builtin.copy:
        content: '{{ ops_convergence | to_json }}'
        dest: /mnt/dom0_data/klokast-infrastructure/staging/ops-convergence.json
        owner: root
        group: root
        mode: '0600'
    - name: Record convergence against the exact live assignment
      ansible.builtin.command:
        argv: [/usr/bin/python3, /mnt/dom0_data/klokast-infrastructure/staging/ops-controller-replacement,
               --box, '{{ ops_replace_box }}', --action, converged, --config,
               /mnt/dom0_data/klokast-infrastructure/staging/ops-convergence.json]
      register: convergence_result
      changed_when: (convergence_result.stdout | from_json).changed
