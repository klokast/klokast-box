---
- name: Configure a freshly created DMZ or IoT root from its frozen Platform inputs
  hosts: podman_vms
  gather_facts: false
  become: true
  vars:
    podman_host_image_configuration: true
    podman_vm_firewall_image_configuration: true
    shared_guest_role: dmz
  pre_tasks:
    - name: Require the selected shared guest target
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - shared_guest_role in ['dmz', 'iot']
          - inventory_hostname == dmz_box ~ '-' ~ shared_guest_role
    - name: Recheck active controller authority
      ansible.builtin.command: /usr/local/sbin/platform-source controllers
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Wait for the new guest maintenance connection
      ansible.builtin.wait_for_connection:
        timeout: 180
    - name: Verify the persistent data mount before configuring storage consumers
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/vm_dmz_personalize.py, --verify, '{{ shared_guest_role }}']
      changed_when: false
  tasks:
    - name: Configure the image-provided rootless Podman runtime
      ansible.builtin.import_role:
        name: podman-host
    - name: Configure the VM firewall from Platform declarations
      ansible.builtin.import_role:
        name: podman-vm-firewall
    - name: Configure managed DNS from the frozen routing profile
      ansible.builtin.import_role:
        name: vm-dns
    - name: Stop and disable the first-contact SSH listener
      ansible.builtin.service:
        name: sshd
        state: stopped
        enabled: false
    - name: Remove the first-contact public key
      ansible.builtin.file:
        path: /home/neo/.ssh/authorized_keys
        state: absent
