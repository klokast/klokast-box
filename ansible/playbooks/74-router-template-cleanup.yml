---
- name: Reclaim only one inactive router template operation
  hosts: "{{ router_cleanup_box }}-dom0"
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  pre_tasks:
    - name: Require the active controller before template cleanup
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cleanup_controller

    - name: Require configured active controller and exact selector
      ansible.builtin.assert:
        that:
          - (router_cleanup_controller.stdout | from_json).configured | bool
          - (router_cleanup_controller.stdout | from_json).active | bool
          - router_cleanup_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - router_cleanup_operation is match('^[0-9a-f]{24}$')
          - router_cleanup_kind | default('failed') in ['failed', 'scratch', 'staged', 'obsolete']
          - inventory_hostname == router_cleanup_box ~ '-dom0'
          - not (router_cleanup_references_only | default(false) | bool) or router_cleanup_kind | default('failed') == 'obsolete'

  tasks:
    - name: Create protected template cleanup code storage
      ansible.builtin.file:
        path: '/mnt/dom0_data/klokast-router-templates/{{ router_cleanup_operation }}/cleanup-code'
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Stage fixed template reference validators
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../lib/{{ item }}.py'
        dest: '/mnt/dom0_data/klokast-router-templates/{{ router_cleanup_operation }}/cleanup-code/{{ item }}.py'
        owner: root
        group: root
        mode: '0600'
      loop: [router_template_retention, router_records, router_generations, router_initial_installation, router_transaction, router_personalize, router_finalize]

    - name: Stage the fixed template collector
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-alpine-rootfs/files/router-template-cleanup-dom0'
        dest: '/mnt/dom0_data/klokast-router-templates/{{ router_cleanup_operation }}/cleanup-code/router-template-cleanup.py'
        owner: root
        group: root
        mode: '0600'

    - name: Reclaim the exact inactive operation's selected files
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/python3',
              '/mnt/dom0_data/klokast-router-templates/' ~ router_cleanup_operation ~ '/cleanup-code/router-template-cleanup.py',
              '--box', router_cleanup_box, '--operation-id', router_cleanup_operation,
              '--kind', router_cleanup_kind | default('failed')]
             + (['--references-only'] if router_cleanup_references_only | default(false) | bool else []) }}
      register: router_cleanup_result
      changed_when: >-
        not (router_cleanup_references_only | default(false) | bool) and
        (router_cleanup_result.rc != 0 or (router_cleanup_result.stdout | from_json).removed_now | length > 0)

    - name: Create controller evidence storage for this exact template
      ansible.builtin.file:
        path: '/var/lib/klokast/updates/discovery/router/{{ router_cleanup_operation }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      when: not (router_cleanup_references_only | default(false) | bool)

    - name: Inspect exact template cleanup receipts
      ansible.builtin.stat:
        path: '/mnt/dom0_data/klokast-router-templates/{{ router_cleanup_operation }}/cleanup-{{ router_cleanup_kind | default("failed") }}-{{ item }}.json'
        follow: false
        get_checksum: false
      loop: [plan, progress, complete]
      register: router_cleanup_evidence
      when: not (router_cleanup_references_only | default(false) | bool)

    - name: Require bounded regular cleanup receipts
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.size | default(1048577) <= 1048576
      loop: '{{ router_cleanup_evidence.results | default([]) }}'
      when: not (router_cleanup_references_only | default(false) | bool)

    - name: Fetch exact template cleanup proof
      ansible.builtin.fetch:
        src: '{{ item.stat.path }}'
        dest: '/var/lib/klokast/updates/discovery/router/{{ router_cleanup_operation }}/cleanup-{{ router_cleanup_kind | default("failed") }}-{{ item.item }}.json'
        flat: true
      loop: '{{ router_cleanup_evidence.results | default([]) }}'
      when: not (router_cleanup_references_only | default(false) | bool)

    - name: Report exact reclaimed bytes and files
      ansible.builtin.debug:
        msg: "{{ router_cleanup_result.stdout | from_json }}"

    - name: Validate optional controller reference receipt destination
      ansible.builtin.assert:
        that:
          - router_cleanup_references_only | default(false) | bool
          - router_cleanup_reference_token is match('^[0-9a-f]{12}$')
          - router_cleanup_reference_output == '/var/lib/klokast/updates/discovery/router/' ~ router_cleanup_operation ~ '/cache-reference-' ~ router_cleanup_reference_token ~ '.json'
      when: router_cleanup_reference_output is defined

    - name: Save the fresh native unused-template reference receipt
      ansible.builtin.copy:
        dest: '{{ router_cleanup_reference_output }}'
        content: '{{ router_cleanup_result.stdout }}'
        mode: '0600'
      delegate_to: localhost
      become: false
      when: router_cleanup_reference_output is defined
