---
- name: Build reviewed Klokast artifacts in an ephemeral Xen guest
  hosts: vm_dom0
  gather_facts: false
  vars:
    xen_shared_installer_iso_path: "{{ dom0_xen_images_path }}/alpine-virt.iso"
    xen_shared_installer_kernel_path: "{{ dom0_xen_images_path }}/vmlinuz-virt"
    xen_shared_installer_initramfs_path: "{{ dom0_xen_images_path }}/initramfs-virt"
    builder_manifest_data: "{{ lookup('file', builder_manifest) | from_json }}"
  tasks:
    - name: Ensure the traversable builder scratch root exists
      ansible.builtin.file:
        path: /mnt/dom0_data/klokast-builder
        state: directory
        owner: root
        group: root
        mode: "0711"

    - name: Ensure the bounded builder transfer parent exists
      ansible.builtin.file:
        path: /mnt/dom0_data/klokast-builder/transfer
        state: directory
        owner: root
        group: root
        mode: "0711"

    - name: Create operation-specific Ansible transfer scratch space
      ansible.builtin.file:
        path: "/mnt/dom0_data/klokast-builder/transfer/{{ builder_operation_id }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Move Ansible transfer scratch space off the dom0 system filesystem
      ansible.builtin.set_fact:
        ansible_remote_tmp: "/mnt/dom0_data/klokast-builder/transfer/{{ builder_operation_id }}"

    - name: Check that the dom0 builder tools already exist
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - >-
            for tool in curl kpartx sfdisk xorriso; do
              command -v "$tool" >/dev/null 2>&1 || exit 1;
            done
      changed_when: false
      register: builder_host_tools

    - name: Require installed dom0 builder tools without changing its package set
      ansible.builtin.assert:
        that:
          - builder_host_tools.rc == 0
        fail_msg: >-
          The dom0 builder tools are not installed. Install them through an
          approved dom0 maintenance workflow before building. This builder
          will not change dom0 packages or upgrade Xen.

    - name: Run the sealed Klokast CLI builder lifecycle
      block:
        - name: Prepare pinned Alpine 3.23 VIRT boot assets on dom0
          ansible.builtin.import_role:
            name: alpine-virt-assets

        - name: Run the sealed Klokast CLI builder lifecycle
          ansible.builtin.import_role:
            name: klokast-cli-builder
      always:
        - name: Remove operation-specific Ansible transfer scratch space
          ansible.builtin.file:
            path: "/mnt/dom0_data/klokast-builder/transfer/{{ builder_operation_id }}"
            state: absent
