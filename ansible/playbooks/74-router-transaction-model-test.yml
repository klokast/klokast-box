---
- name: Verify router lifecycle and crash recovery without Platform access
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Run the complete deterministic router test suite
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - unittest
          - discover
          - -s
          - '{{ playbook_dir }}/../tests'
          - -p
          - test_router_*.py
      changed_when: false
