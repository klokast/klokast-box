---
- name: Stage only the checked K001 original-router health receipt
  hosts: k001-dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one exact K001 cold recovery receipt
      ansible.builtin.assert:
        that:
          - router_cold_recovery_box == 'k001'
          - router_cold_recovery_operation is match('^[0-9a-f]{24}$')
          - router_cold_recovery_engine is match('^[0-9a-f]{40}$')
          - router_cold_recovery_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_recovery_operation
          - router_cold_health_receipt.kind == 'klokast.router-cold-health.v1'
          - router_cold_health_receipt.box == 'k001'
          - router_cold_health_receipt.operation_id == router_cold_recovery_operation
          - router_cold_health_receipt.engine_commit == router_cold_recovery_engine

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require a current development implementation checkout
      ansible.builtin.command:
        argv: [/usr/local/sbin/platform-source, implementation]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_health_authority

    - name: Read the deployment source commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_health_commit

    - name: Read the deployment source changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_health_changes

    - name: Bind the stage to the current implementation
      ansible.builtin.assert:
        that:
          - router_cold_health_commit.stdout == router_cold_recovery_engine
          - (router_cold_health_authority.stdout | from_json).commit == router_cold_recovery_engine

    - name: Inspect private controller health evidence
      ansible.builtin.stat:
        path: '{{ router_cold_recovery_result }}'
        follow: false
      delegate_to: localhost
      become: false
      register: router_cold_health_evidence

    - name: Require owner-only controller health evidence
      ansible.builtin.assert:
        that:
          - router_cold_health_evidence.stat.isdir | default(false)
          - not (router_cold_health_evidence.stat.islnk | default(false))
          - router_cold_health_evidence.stat.pw_name == 'smith'
          - router_cold_health_evidence.stat.mode == '0700'

    - name: Inspect the protected cold bundle directory
      ansible.builtin.stat:
        path: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_recovery_operation }}'
        follow: false
      register: router_cold_health_bundle

    - name: Require one root-owned private cold bundle
      ansible.builtin.assert:
        that:
          - router_cold_health_bundle.stat.isdir | default(false)
          - not (router_cold_health_bundle.stat.islnk | default(false))
          - router_cold_health_bundle.stat.uid == 0
          - router_cold_health_bundle.stat.mode == '0700'

    - name: Stage the exact checked receipt as installed-reader input
      ansible.builtin.copy:
        content: '{{ router_cold_health_receipt | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_recovery_operation }}/health-input.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Let the installed engine check the restored router and receipt
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-health-stage,
               --box, k001, --operation-id, '{{ router_cold_recovery_operation }}']
      changed_when: false
      register: router_cold_health_staged

    - name: Require exact installed-engine health stage result
      ansible.builtin.assert:
        that:
          - (router_cold_health_staged.stdout | from_json).action == 'cold-health-stage'
          - (router_cold_health_staged.stdout | from_json).box == 'k001'
          - (router_cold_health_staged.stdout | from_json).engine_commit == router_cold_recovery_engine
          - (router_cold_health_staged.stdout | from_json).result == router_cold_health_receipt

    - name: Keep a private controller receipt for the installed-engine stage
      ansible.builtin.copy:
        content: '{{ router_cold_health_staged.stdout }}'
        dest: '{{ router_cold_recovery_result }}/cold-health-stage.json'
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Complete the freshly verified recovery when requested
      ansible.builtin.import_tasks: tasks/router-cold-recovery-completion.yml
      when: router_cold_health_finish | default(false) | bool
