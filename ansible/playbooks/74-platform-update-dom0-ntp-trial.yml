---
- name: Isolate k001 NTP from dom0 clock jumps for a bounded live trial
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  tasks:
    - name: Require only k001 dom0
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'k001-dom0'

    - name: Verify active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_ntp_controller

    - name: Require the configured active controller
      ansible.builtin.assert:
        that:
          - (update_ntp_controller.stdout | from_json).configured | bool
          - (update_ntp_controller.stdout | from_json).active | bool

    - name: Read recent NTP messages before the trial
      ansible.builtin.shell: |
        (logread 2>/dev/null || true) | grep -i ntpd | tail -30 || true
      changed_when: false
      register: update_ntp_messages

    - name: Show recent NTP messages
      ansible.builtin.debug:
        var: update_ntp_messages.stdout_lines

    - name: Stop NTP for a reversible runtime trial
      ansible.builtin.service:
        name: ntpd
        state: stopped

    - name: Read controller UTC epoch
      ansible.builtin.command:
        argv: [date, -u, +%s]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_ntp_controller_epoch

    - name: Read dom0 UTC epoch
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: update_ntp_dom0_epoch

    - name: Require a bounded clock correction
      ansible.builtin.assert:
        that:
          - >-
            ((update_ntp_dom0_epoch.stdout | int) -
             (update_ntp_controller_epoch.stdout | int)) | abs <= 600

    - name: Correct dom0 UTC from the active controller
      ansible.builtin.command:
        argv: [date, -u, -s, "@{{ update_ntp_controller_epoch.stdout }}"]
      when: >-
        ((update_ntp_dom0_epoch.stdout | int) -
         (update_ntp_controller_epoch.stdout | int)) | abs > 30

    - name: Verify dom0 UTC after NTP stopped
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: update_ntp_dom0_after
      until: >-
        ((update_ntp_dom0_after.stdout | int) -
         (lookup('pipe', 'date -u +%s') | int)) | abs <= 30
      retries: 12
      delay: 5
