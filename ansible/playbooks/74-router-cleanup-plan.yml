---
- name: Plan exact obsolete router resources without retiring them
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact target and private controller destination
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_cleanup_box ~ '-dom0'
          - router_cleanup_operation is match('^[0-9a-f]{24}$')
          - router_cleanup_result_dir is match('^/var/lib/klokast/updates/discovery/router/[0-9a-f]{24}$')

    - name: Require active controller authority before reading cleanup
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read the exact protected native cleanup
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/router-update-transaction
          - cleanup-plan
          - --box
          - '{{ router_cleanup_box }}'
          - --operation-id
          - '{{ router_cleanup_operation }}'
      register: router_cleanup_native
      changed_when: false

    - name: Retain cleanup evidence on the controller
      ansible.builtin.copy:
        content: '{{ router_cleanup_native.stdout }}'
        dest: '{{ router_cleanup_result_dir }}/cleanup.json'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
      no_log: true
