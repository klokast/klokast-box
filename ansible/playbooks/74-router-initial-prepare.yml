---
- name: Allocate and prepare the exact retained first-router disk
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact retained preparation target and evidence path
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_initial_box ~ '-dom0'
          - router_initial_operation is match('^[0-9a-f]{24}$')
          - router_initial_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_initial_operation
          - router_initial_grant.request_sha256 == router_initial_request_sha256

    - name: Recheck active controller authority before allocation
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_initial_controller

    - name: Recheck the current current implementation
      ansible.builtin.command:
        argv: [/usr/local/sbin/platform-source, implementation]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_initial_engine

    - name: Bind initial preparation to the active approved engine
      ansible.builtin.assert:
        that:
          - (router_initial_controller.stdout | from_json).active | bool
          - (router_initial_controller.stdout | from_json).configured | bool
          - router_initial_grant.engine_commit == (router_initial_engine.stdout | from_json).commit

    - name: Stage the fresh grant for the exact immutable preparation request
      ansible.builtin.copy:
        content: '{{ router_initial_grant | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/authorization.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Retain one recorded disk after networkless initial preparation
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/router-initial-prepare-dom0'
          - --box
          - '{{ router_initial_box }}'
          - --operation-id
          - '{{ router_initial_operation }}'
          - --engine
          - '{{ router_initial_grant.engine_commit }}'
      changed_when: true

    - name: Fetch retained preparation evidence without private identity contents
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_initial_operation }}/{{ item }}.json'
        dest: '{{ router_initial_result_dir }}/{{ item }}.json'
        flat: true
      loop: [candidate-disk, preparation, preparation-result, initial-preparation-result]
