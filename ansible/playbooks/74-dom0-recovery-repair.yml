---
- name: Repair the common-router boot delegation during a recorded host update
  hosts: dom0
  gather_facts: false
  tasks:
    - name: Require active peer authority
      ansible.builtin.command: /usr/local/sbin/klokast-controller-guard --require-active
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Read the protected pending host transaction
      ansible.builtin.slurp:
        src: /mnt/dom0_data/klokast-dom0-updates/pending.json
      register: dom0_repair_pending
    - name: Require the exact booted host transaction
      ansible.builtin.assert:
        that:
          - inventory_hostname == dom0_repair_box ~ '-dom0'
          - (dom0_repair_pending.content | b64decode | from_json).operation == dom0_repair_operation
          - (dom0_repair_pending.content | b64decode | from_json).state in ['rebooting', 'boot-verified']
    - name: Install the corrected router boot delegation
      ansible.builtin.copy:
        src: ../roles/router-update-recovery/files/router-update-transaction
        dest: /usr/local/sbin/router-update-transaction
        owner: root
        group: root
        mode: '0700'
    - name: Verify common VM boot assignments and restore their autostart links
      ansible.builtin.command: /usr/local/sbin/vm-update-transaction boot-recover
      changed_when: false
    - name: Start the checked router boot recovery service
      ansible.builtin.command: /sbin/rc-service klokast-router-update-recovery start
      changed_when: true
    - name: Start the verified existing guest assignments
      ansible.builtin.command: /sbin/rc-service xendomains start
      async: 300
      poll: 5
      register: dom0_repair_start
      vars:
        ansible_async_dir: '/mnt/dom0_data/klokast-dom0-updates/operations/{{ dom0_repair_operation }}/async'
      changed_when: true
    - name: Stage the versioned post-boot persistence correction
      ansible.builtin.copy:
        src: ../roles/dom0-update/files/dom0_update.py
        dest: '/mnt/dom0_data/klokast-dom0-updates/repair-{{ dom0_repair_operation }}.py'
        owner: root
        group: root
        mode: '0600'
    - name: Stage the approved router correction for exact-byte verification
      ansible.builtin.copy:
        src: ../roles/router-update-recovery/files/router-update-transaction
        dest: '/mnt/dom0_data/klokast-dom0-updates/router-{{ dom0_repair_operation }}.py'
        owner: root
        group: root
        mode: '0600'
        force: false
    - name: Persist only verified identity and known boot outputs
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import importlib.machinery,importlib.util,json,sys
            from pathlib import Path
            loader=importlib.machinery.SourceFileLoader('dom0_repair',sys.argv[1])
            spec=importlib.util.spec_from_loader(loader.name,loader)
            module=importlib.util.module_from_spec(spec);loader.exec_module(module)
            current=module.read(module.BASE/'pending.json')
            if current['operation']!=sys.argv[2] or module.boot_id()==current['boot_before']:
                raise SystemExit('repair requires the exact post-boot transaction')
            module.persist_runtime(current)
          - '/mnt/dom0_data/klokast-dom0-updates/repair-{{ dom0_repair_operation }}.py'
          - '{{ dom0_repair_operation }}'
      changed_when: true
