---
- name: Switch the backend VM to installed-stage boot for the selected node
  hosts: vm_dom0
  gather_facts: false
  vars:
    backend_installed_spec: >-
      {{ node_xen_guest_specs.backend | combine({'stage': 'installed'}, recursive=True) }}
  tasks:
    - name: Ensure the backend guest is stopped before extracting boot artifacts
      ansible.builtin.import_role:
        name: xen-guest-instance
      vars:
        xen_guest_name: "{{ node_xen_guest_specs.backend.guest_name }}"
        xen_guest_config_path: "{{ node_xen_guest_specs.backend.config_path }}"
        xen_guest_runtime_state: stopped

    - name: Unlock reviewed backend install maintenance packages in RAM
      ansible.builtin.import_role:
        name: dom0-apk-policy
        tasks_from: maintenance-unlock.yml
      vars:
        dom0_maintenance_packages:
          - kpartx

    - name: Prepare the backend disk with transient dom0 tooling
      block:
        - name: Copy the installed backend kernel and initramfs into dom0 shared storage
          ansible.builtin.import_role:
            name: xen-guest-artifacts
          vars:
            xen_guest_name: "{{ node_xen_guest_specs.backend.guest_name }}"
            xen_guest_lv_path: "{{ node_xen_guest_specs.backend.required_lvs | first }}"
            xen_guest_kernel_source_name: vmlinuz-virt
            xen_guest_initramfs_source_name: initramfs-virt
            xen_guest_kernel_dest_path: "{{ dom0_xen_images_path }}/bak-kernel"
            xen_guest_initramfs_dest_path: "{{ dom0_xen_images_path }}/bak-initramfs"

        - name: Seed first-boot backend guest access on the installed root filesystem
          ansible.builtin.import_role:
            name: xen-guest-bootstrap
          vars:
            xen_guest_name: "{{ node_xen_guest_specs.backend.guest_name }}"
            xen_guest_lv_path: "{{ node_xen_guest_specs.backend.required_lvs | first }}"
            xen_guest_bootstrap_authorized_key_file: "{{ lookup('env', 'HOME') }}/.ssh/github-klokast-codex.pub"
      always:
        - name: Remove backend install maintenance packages and lock APK
          ansible.builtin.import_role:
            name: dom0-apk-policy
            tasks_from: maintenance-lock.yml

    - name: Render the backend Xen config in installed stage
      ansible.builtin.import_role:
        name: xen-guest
      vars:
        xen_guest_spec: "{{ backend_installed_spec }}"

    - name: Start the backend guest in installed stage
      ansible.builtin.import_role:
        name: xen-guest-instance
      vars:
        xen_guest_name: "{{ node_xen_guest_specs.backend.guest_name }}"
        xen_guest_config_path: "{{ node_xen_guest_specs.backend.config_path }}"
        xen_guest_runtime_state: running

    - name: Show the next manual installed-guest bootstrap steps
      ansible.builtin.debug:
        msg:
          - "Connect to the guest console with: doas xl console {{ node_xen_guest_specs.backend.guest_name }}"
          - "Log in as root with the temporary install password, then bootstrap neo, doas, and Tailscale."
          - "Keep lv_nc_db detached until the base backend VM is remotely manageable."
