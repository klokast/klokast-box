---
- name: Verify authority and standby recovery before replacement
  hosts: ops
  gather_facts: false
  tasks:
    - name: Verify current authority and standby access
      ansible.builtin.import_tasks: ../roles/ops-replacement/tasks/preflight.yml

- name: Replace or recover the recorded controller disk on its own box
  hosts: dom0
  gather_facts: false
  roles:
    - ops-replacement

- name: Reconstruct and verify the replacement controller
  hosts: ops
  gather_facts: false
  vars:
    vm_manage_sshd: false
    vm_preserve_account_passwords: true
    ops_account_migration_enabled: false
    ops_controller_deployment_lifecycle: development
    ops_controller_prune_package_drift: true
  pre_tasks:
    - name: Finish adoption or disk rollback without guest convergence
      ansible.builtin.meta: end_host
      when: ops_replace_action not in ['replace', 'resume']
    - name: Load the frozen replacement record
      ansible.builtin.set_fact:
        ops_replacement: '{{ hostvars[ops_replace_box ~ "-dom0"].ops_replace_record.content | b64decode | from_json }}'
    - name: Require unchanged authority and code inputs on resume
      ansible.builtin.assert:
        that:
          - ops_replacement.requested_configuration.active_box == ops_replace_active_box
    - name: Require an accepted operation before the explicit reboot test
      ansible.builtin.assert:
        that:
          - ops_replace_action == 'resume'
          - ops_replacement.stage == 'accepted'
      when: ops_replace_verify_reboot | default(false) | bool
    - name: Wait for preserved controller identity
      ansible.builtin.wait_for_connection:
        delay: 2
        sleep: 3
        timeout: 180
  tasks:
    - name: Reconstruct managed controller configuration
      when: ops_replacement.stage != 'accepted'
      block:
        - name: Create the public source parent
          ansible.builtin.file:
            path: /home/smith/src/klokast
            state: directory
            owner: smith
            group: smith
            mode: '0750'
        - name: Install the frozen public implementation
          ansible.builtin.import_tasks: ../roles/ops-controller/tasks/public-revision.yml
          vars:
            ops_controller_frozen_commit: '{{ ops_replacement.requested_configuration.engine_commit }}'
        - name: Gather controller facts
          ansible.builtin.setup:
        - name: Converge the controller base access model
          ansible.builtin.import_role:
            name: vm-base
        - name: Converge the preserved Tailscale client
          ansible.builtin.import_role:
            name: tailscale-client
        - name: Converge the controller firewall
          ansible.builtin.import_role:
            name: podman-vm-firewall
        - name: Reconstruct controller tools and independent Instance checkout
          ansible.builtin.import_role:
            name: ops-controller
          vars:
            ops_controller_frozen_commit: '{{ ops_replacement.requested_configuration.engine_commit }}'
            ops_controller_frozen_instance_commit: '{{ ops_replacement.requested_configuration.instance_commit }}'
    - name: Qualify reboot persistence of an accepted standby
      when: ops_replace_verify_reboot | default(false) | bool
      block:
        - name: Record standby authority and identity before reboot
          ansible.builtin.shell: &ops_replacement_identity_probe |
            python3 - <<'PY'
            import hashlib, json, pathlib, subprocess
            root = pathlib.Path
            guard = json.loads(subprocess.check_output(['/usr/local/sbin/klokast-controller-guard', '--status', '--json']))
            tailscale = json.loads(subprocess.check_output(['tailscale', 'status', '--json']))
            assert tailscale['BackendState'] == 'Running'
            files = {
                'machine_id': '/etc/machine-id',
                'ssh_host_key': '/etc/ssh/ssh_host_ed25519_key.pub',
                'instance_read_key': '/home/smith/.ssh/github-klokast-instance.pub',
                'recovery_keys': '/home/smith/.ssh/authorized_keys',
            }
            identity = {name: hashlib.sha256(root(path).read_bytes()).hexdigest() if root(path).is_file() else None
                        for name, path in files.items()}
            assert all(identity[name] is not None for name in files if name != 'machine_id'), 'required controller identity or recovery key is absent'
            identity['tailscale_id'] = tailscale['Self']['ID']
            print(json.dumps({'guard': guard, 'identity': identity,
                              'boot_id': root('/proc/sys/kernel/random/boot_id').read_text().strip()}))
            PY
          become_user: smith
          changed_when: false
          register: ops_reboot_before
        - name: Require the verified standby before reboot
          ansible.builtin.assert:
            that:
              - (ops_reboot_before.stdout | from_json).guard.role == 'standby'
              - (ops_reboot_before.stdout | from_json).guard.box == ops_replace_box
              - (ops_reboot_before.stdout | from_json).guard.active_box == ops_replace_active_box
        - name: Select the durable pre-reboot identity on resume
          ansible.builtin.set_fact:
            ops_reboot_baseline: '{{ ops_replacement.reboot_verification.before if (ops_replacement.reboot_verification | default({})).get("status") == "pending" else (ops_reboot_before.stdout | from_json) }}'
        - name: Refuse changed identity before reboot or resumed verification
          ansible.builtin.assert:
            that:
              - ops_reboot_baseline.identity == (ops_reboot_before.stdout | from_json).identity
              - ops_reboot_baseline.guard.active_box == ops_replace_active_box
        - name: Recheck current authority before reboot
          ansible.builtin.command: /usr/local/sbin/platform-source controllers
          delegate_to: localhost
          become: false
          changed_when: false
          register: ops_reboot_authority
        - name: Require the current declared standby before reboot
          ansible.builtin.assert:
            that:
              - (ops_reboot_authority.stdout | from_json).controllers.active.box == ops_replace_active_box
              - (ops_reboot_authority.stdout | from_json).controllers.standby.box == ops_replace_box
        - name: Stage the reboot baseline on protected dom0 storage
          ansible.builtin.copy:
            content: '{{ ops_reboot_baseline | to_json }}'
            dest: /mnt/dom0_data/klokast-infrastructure/staging/ops-reboot-before.json
            owner: root
            group: root
            mode: '0600'
          delegate_to: '{{ ops_replace_box }}-dom0'
        - name: Persist pending reboot verification before requesting reboot
          ansible.builtin.command:
            argv: [/usr/bin/python3, /mnt/dom0_data/klokast-infrastructure/staging/ops-controller-replacement,
                   --box, '{{ ops_replace_box }}', --action, reboot-start, --operation,
                   '{{ ops_replacement.operation_id }}', --config,
                   /mnt/dom0_data/klokast-infrastructure/staging/ops-reboot-before.json]
          delegate_to: '{{ ops_replace_box }}-dom0'
          changed_when: true
        - name: Reboot only the accepted standby controller
          ansible.builtin.reboot:
            reboot_command: /sbin/reboot
            reboot_timeout: 300
            connect_timeout: 10
            post_reboot_delay: 5
            test_command: /usr/local/sbin/klokast-controller-guard --status --json
          when: ops_reboot_baseline.boot_id == (ops_reboot_before.stdout | from_json).boot_id
        - name: Read controller identity after reboot
          ansible.builtin.shell: *ops_replacement_identity_probe
          become_user: smith
          changed_when: false
          register: ops_reboot_after
        - name: Require a new boot with unchanged standby identity
          ansible.builtin.assert:
            that:
              - (ops_reboot_after.stdout | from_json).boot_id != ops_reboot_baseline.boot_id
              - (ops_reboot_after.stdout | from_json).identity == ops_reboot_baseline.identity
              - (ops_reboot_after.stdout | from_json).guard.role == 'standby'
              - (ops_reboot_after.stdout | from_json).guard.box == ops_replace_box
              - (ops_reboot_after.stdout | from_json).guard.active_box == ops_replace_active_box
    - name: Read the preserved identity after replacement
      ansible.builtin.shell: *ops_replacement_identity_probe
      become_user: smith
      changed_when: false
      register: ops_identity_after_replacement
      when: ops_replacement.stage != 'accepted' and ops_replacement.requested_configuration.identity_before is defined
    - name: Require the same machine and recovery identity as before replacement
      ansible.builtin.assert:
        that:
          - (ops_identity_after_replacement.stdout | from_json).identity == ops_replacement.requested_configuration.identity_before
      when: ops_replacement.stage != 'accepted' and ops_replacement.requested_configuration.identity_before is defined
    - name: Verify the controller baseline
      ansible.builtin.import_role:
        name: ops-controller-verification
      vars:
        ops_controller_frozen_commit: '{{ ops_replacement.requested_configuration.engine_commit if ops_replacement.stage != "accepted" else "" }}'
        ops_controller_check_source_current: '{{ ops_replacement.stage != "accepted" }}'
    - name: Verify standby authority and absence of Codex runtime
      ansible.builtin.shell: |
        set -eu
        /usr/local/sbin/klokast-controller-guard --status --json
        ! command -v codex >/dev/null 2>&1
        test ! -x /usr/local/bin/codex
        test ! -e /etc/init.d/airunner
        test ! -e /etc/runlevels/default/airunner
        if [ -n "$INSTANCE_COMMIT" ]; then
          test "$(git -C /home/smith/private/klokast/instance rev-parse HEAD)" = "$INSTANCE_COMMIT"
        fi
      environment:
        INSTANCE_COMMIT: '{{ ops_replacement.requested_configuration.instance_commit if ops_replacement.stage != "accepted" else "" }}'
      become_user: smith
      register: ops_replace_health
      changed_when: false
      failed_when: >-
        ops_replace_health.rc != 0 or
        (ops_replace_health.stdout | from_json).role != 'standby' or
        (ops_replace_health.stdout | from_json).active_box != ops_replace_active_box
    - name: Recheck current placement before acceptance
      ansible.builtin.command: /usr/local/sbin/platform-source controllers
      delegate_to: localhost
      become: false
      changed_when: false
      register: ops_accept_authority
    - name: Require the current standby before acceptance
      ansible.builtin.assert:
        that:
          - (ops_accept_authority.stdout | from_json).controllers.active.box == ops_replace_active_box
          - (ops_accept_authority.stdout | from_json).controllers.standby.box == ops_replace_box
    - name: Record acceptance only after health verification
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /mnt/dom0_data/klokast-infrastructure/staging/ops-controller-replacement
          - --box
          - '{{ ops_replace_box }}'
          - --action
          - accept
          - --operation
          - '{{ ops_replacement.operation_id }}'
      delegate_to: '{{ ops_replace_box }}-dom0'
      register: ops_replace_acceptance
      changed_when: (ops_replace_acceptance.stdout | from_json).changed

    - name: Complete durable reboot verification only after health passes
      when: ops_replace_verify_reboot | default(false) | bool
      block:
        - name: Stage the verified post-reboot identity
          ansible.builtin.copy:
            content: '{{ ops_reboot_after.stdout }}'
            dest: /mnt/dom0_data/klokast-infrastructure/staging/ops-reboot-after.json
            owner: root
            group: root
            mode: '0600'
          delegate_to: '{{ ops_replace_box }}-dom0'
        - name: Record completed reboot verification
          ansible.builtin.command:
            argv: [/usr/bin/python3, /mnt/dom0_data/klokast-infrastructure/staging/ops-controller-replacement,
                   --box, '{{ ops_replace_box }}', --action, reboot-complete, --operation,
                   '{{ ops_replacement.operation_id }}', --config,
                   /mnt/dom0_data/klokast-infrastructure/staging/ops-reboot-after.json]
          delegate_to: '{{ ops_replace_box }}-dom0'
          changed_when: true
