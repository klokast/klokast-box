---
- name: Bound temporary dom0 tools for the sealed builder
  hosts: vm_dom0
  gather_facts: false
  vars:
    dom0_tool_profile: sealed-builder
    dom0_tool_action: "{{ builder_tool_action }}"
    dom0_tool_box: "{{ builder_tool_box }}"
    dom0_tool_operation: "{{ builder_operation_id }}"
  tasks:
    - name: Run the closed builder-tool transaction
      ansible.builtin.import_role:
        name: dom0-apk-policy
        tasks_from: temporary-tools.yml
