---
- name: Reconcile only Platform-owned runner rules through existing firewall includes
  hosts: router:ops
  gather_facts: false
  vars:
    platform_resources_apply_scope_apps: [platform]
  pre_tasks:
    - name: Use local transport for the active controller itself
      ansible.builtin.set_fact:
        ansible_connection: local
      when: inventory_hostname == airunner_controller_hostname
  roles:
    - app-resources
    - platform-resources-metadata
    - app-resources-verification
