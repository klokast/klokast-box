---
- name: Retire only protected obsolete router resources after exact verification
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact cleanup selectors and private destination
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_cleanup_box ~ '-dom0'
          - router_cleanup_operation is match('^[0-9a-f]{24}$')
          - router_cleanup_token is match('^[0-9a-f]{12}$')
          - router_cleanup_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_cleanup_operation
          - router_cleanup_grant.kind == 'klokast.router-cleanup-authorization.v1'

    - name: Require the active controller before staging retirement authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Stage one exact short retirement grant
      ansible.builtin.copy:
        content: '{{ router_cleanup_grant | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_cleanup_operation }}/cleanup-grant-{{ router_cleanup_token }}.json'
        owner: root
        group: root
        mode: '0600'
        force: false

    - name: Read the retained cleanup grant
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_cleanup_operation }}/cleanup-grant-{{ router_cleanup_token }}.json'
      register: router_cleanup_retained_grant

    - name: Refuse an earlier or changed retirement grant
      ansible.builtin.assert:
        that:
          - (router_cleanup_retained_grant.content | b64decode | from_json) == router_cleanup_grant

    - name: Retire the exact native obsolete disk and boot artifacts
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/router-update-transaction
          - retire-completed
          - --box
          - '{{ router_cleanup_box }}'
          - --operation-id
          - '{{ router_cleanup_operation }}'
          - --cleanup-token
          - '{{ router_cleanup_token }}'
      register: router_cleanup_retired
      changed_when: true

    - name: Require retired copy files as well as the obsolete OS resources
      ansible.builtin.assert:
        that:
          - (router_cleanup_retired.stdout | from_json).action == 'retire-completed'
          - (router_cleanup_retired.stdout | from_json).result.kind == 'klokast.router-cleanup-complete.v2'
          - (router_cleanup_retired.stdout | from_json).result.status == 'exact-resources-retired'
          - (router_cleanup_retired.stdout | from_json).result.copy_retirement_sha256 is match('^[0-9a-f]{64}$')

    - name: Retain the protected retirement result on the controller
      ansible.builtin.copy:
        content: '{{ router_cleanup_retired.stdout }}'
        dest: '{{ router_cleanup_result_dir }}/cleanup-native-{{ router_cleanup_token }}.json'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
      no_log: true
