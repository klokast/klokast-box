---
- name: Reconcile a retained router cutover without launching it again
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Read the exact protected native completion
      ansible.builtin.command:
        argv:
          - '{{ playbook_dir }}/../bin/platform-router-update'
          - reconcile-daily
      register: router_daily_reconciliation
      changed_when: false

    - name: Show the completion and remaining cleanup state
      ansible.builtin.debug:
        msg: '{{ router_daily_reconciliation.stdout | from_json }}'
