---
- name: Set human approval mode on the active development controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  become_method: community.general.doas
  become_flags: -n
  vars:
    approval_mode_file: /etc/klokast/human-approval-mode
    development_key_dir: /home/smith/private/klokast/development-approvals
    development_signers:
      - purpose: platform-apply
        principal: human-platform-apply
        namespace: klokast-platform-apply
        allowed: /etc/klokast/secret-authority/allowed-signers-platform-apply
      - purpose: private-instance
        principal: human-private-instance
        namespace: klokast-secret-authority
        allowed: /etc/klokast/secret-authority/allowed-signers-private-instance
      - purpose: static-site
        principal: human-static-site
        namespace: klokast-secret-authority
        allowed: /etc/klokast/secret-authority/allowed-signers-static-site
  pre_tasks:
    - name: Require active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      become: false
      changed_when: false
      register: approval_controller

    - name: Require the selected approval mode and active in-Platform controller
      ansible.builtin.assert:
        that:
          - development_approval_mode | default('') in ['development', 'signed']
          - (approval_controller.stdout | from_json).active
          - (approval_controller.stdout | from_json).role == 'active'
          - (approval_controller.stdout | from_json).hostname is match('^[a-z0-9-]+-ops$')
        fail_msg: Select development or signed mode on the active in-Platform controller.

  tasks:
    - name: Remove the inaccessible first development mode location
      ansible.builtin.file:
        path: /etc/klokast/secret-authority/human-approval-mode
        state: absent

    - name: Disable automatic development signing before removing its keys
      ansible.builtin.copy:
        dest: "{{ approval_mode_file }}"
        content: "signed\n"
        owner: root
        group: root
        mode: "0644"
      when: development_approval_mode == 'signed'

    - name: Remove development signer authorization
      ansible.builtin.blockinfile:
        path: "{{ item.allowed }}"
        marker: "# {mark} KLOKAST DEVELOPMENT APPROVAL {{ item.purpose }}"
        state: absent
        create: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ development_signers }}"
      when: development_approval_mode == 'signed'

    - name: Remove development publication credentials in signed mode
      ansible.builtin.file:
        path: /etc/klokast/secret-authority/instance-development
        state: absent
      when: development_approval_mode == 'signed'

    - name: Remove development signing keys
      ansible.builtin.file:
        path: "{{ development_key_dir }}"
        state: absent
      when: development_approval_mode == 'signed'

    - name: Create private development signing directory
      ansible.builtin.file:
        path: "{{ development_key_dir }}"
        state: directory
        owner: smith
        group: smith
        mode: "0700"
      when: development_approval_mode == 'development'

    - name: Create separate development approval keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "klokast-development-{{ item.purpose }}"
          - -f
          - "{{ development_key_dir }}/{{ item.purpose }}"
        creates: "{{ development_key_dir }}/{{ item.purpose }}"
      become: false
      loop: "{{ development_signers }}"
      when: development_approval_mode == 'development'

    - name: Keep development private keys owner-only
      ansible.builtin.file:
        path: "{{ development_key_dir }}/{{ item.purpose }}"
        owner: smith
        group: smith
        mode: "0600"
      loop: "{{ development_signers }}"
      when: development_approval_mode == 'development'

    - name: Add scoped development signer authorization
      ansible.builtin.blockinfile:
        path: "{{ item.allowed }}"
        marker: "# {mark} KLOKAST DEVELOPMENT APPROVAL {{ item.purpose }}"
        block: >-
          {{ item.principal }} namespaces="{{ item.namespace }}"
          {{ (lookup('file', development_key_dir ~ '/' ~ item.purpose ~ '.pub').split()[:2]) | join(' ') }}
        create: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ development_signers }}"
      when: development_approval_mode == 'development'

    - name: Enable automatic development signing after signer setup
      ansible.builtin.copy:
        dest: "{{ approval_mode_file }}"
        content: "development\n"
        owner: root
        group: root
        mode: "0644"
      when: development_approval_mode == 'development'

    - name: Install the separate development publication App when supplied
      when:
        - development_approval_mode == 'development'
        - development_github_app_id is defined
      no_log: true
      block:
        - name: Check publication App enrollment input
          ansible.builtin.assert:
            that:
              - development_github_app_id | string is match('^[0-9]+$')
              - development_github_installation_id | string is match('^[0-9]+$')
              - "'PRIVATE KEY' in development_github_app_pem"

        - name: Create root-only development App storage
          ansible.builtin.file:
            path: /etc/klokast/secret-authority/instance-development
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Install development App identifiers
          ansible.builtin.copy:
            dest: /etc/klokast/secret-authority/instance-development/github-app.env
            content: |
              GITHUB_APP_ID={{ development_github_app_id }}
              GITHUB_APP_INSTALLATION_ID={{ development_github_installation_id }}
            owner: root
            group: root
            mode: "0600"

        - name: Install development App private key
          ansible.builtin.copy:
            dest: /etc/klokast/secret-authority/instance-development/github-app.pem
            content: "{{ development_github_app_pem }}"
            owner: root
            group: root
            mode: "0600"

        - name: Verify repository and permission scope and revoke the test token
          ansible.builtin.command:
            argv: [/usr/local/sbin/ksa-instance, engine, development-check]
          changed_when: false
