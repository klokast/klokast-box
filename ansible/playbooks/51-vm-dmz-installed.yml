---
- name: Switch the dmz VM to installed-stage boot for the selected node
  hosts: vm_dom0
  gather_facts: false
  vars:
    dmz_installed_spec: >-
      {{ node_xen_guest_specs.dmz | combine({'stage': 'installed'}, recursive=True) }}
  tasks:
    - name: Ensure the dmz guest is stopped before extracting boot artifacts
      ansible.builtin.import_role:
        name: xen-guest-instance
      vars:
        xen_guest_name: "{{ node_xen_guest_specs.dmz.guest_name }}"
        xen_guest_config_path: "{{ node_xen_guest_specs.dmz.config_path }}"
        xen_guest_runtime_state: stopped

    - name: Copy the installed dmz kernel and initramfs into dom0 shared storage
      ansible.builtin.import_role:
        name: xen-guest-artifacts
      vars:
        xen_guest_name: "{{ node_xen_guest_specs.dmz.guest_name }}"
        xen_guest_lv_path: "{{ node_xen_guest_specs.dmz.required_lvs | first }}"
        xen_guest_kernel_source_name: vmlinuz-virt
        xen_guest_initramfs_source_name: initramfs-virt
        xen_guest_kernel_dest_path: "{{ dom0_xen_images_path }}/dmz-kernel"
        xen_guest_initramfs_dest_path: "{{ dom0_xen_images_path }}/dmz-initramfs"

    - name: Seed first-boot dmz guest access on the installed root filesystem
      ansible.builtin.import_role:
        name: xen-guest-bootstrap
      vars:
        xen_guest_name: "{{ node_xen_guest_specs.dmz.guest_name }}"
        xen_guest_lv_path: "{{ node_xen_guest_specs.dmz.required_lvs | first }}"
        xen_guest_bootstrap_authorized_key_file: "{{ lookup('env', 'HOME') }}/.ssh/github-klokast-codex.pub"

    - name: Render the dmz Xen config in installed stage
      ansible.builtin.import_role:
        name: xen-guest
      vars:
        xen_guest_spec: "{{ dmz_installed_spec }}"

    - name: Start the dmz guest in installed stage
      ansible.builtin.import_role:
        name: xen-guest-instance
      vars:
        xen_guest_name: "{{ node_xen_guest_specs.dmz.guest_name }}"
        xen_guest_config_path: "{{ node_xen_guest_specs.dmz.config_path }}"
        xen_guest_runtime_state: running

    - name: Show the next dmz installed-guest bootstrap steps
      ansible.builtin.debug:
        msg:
          - "The dmz guest now boots from its installed disk without the ISO."
          - "Run the dmz base playbook next over the dom0 bootstrap SSH path to create neo/doas/python3."
