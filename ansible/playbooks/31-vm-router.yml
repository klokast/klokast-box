---
# provision-box runs provision-router phase --phase accept before these checks.
- name: Require the protected accepted router before provisioning dependent guests
  hosts: vm_dom0
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify the exact accepted router boot assignment
      ansible.builtin.import_role:
        name: router-boot-assignment
      vars:
        router_boot_assignment_allow_verify: true

    - name: Refuse an incomplete first router installation
      ansible.builtin.assert:
        that:
          - router_boot_assignment_present | bool
          - not router_boot_pending_present | bool
        fail_msg: >-
          The router has no verified accepted assignment. Resume its recorded
          first installation before provisioning dependent guests.

- name: Verify accepted router services and release without package changes
  hosts: router
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check the accepted packages, kernel, and configuration
      ansible.builtin.import_role:
        name: router-accepted-manifest-verification

    - name: Check the live accepted router services
      ansible.builtin.import_role:
        name: router-accepted-health-verification
