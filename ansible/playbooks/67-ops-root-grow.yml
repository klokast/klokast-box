---
- name: Grow the selected controller LV without shrinking or stopping its VM
  hosts: vm_dom0
  gather_facts: false
  pre_tasks:
    - name: Require active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require one exact controller disk
      ansible.builtin.assert:
        that:
          - ops_grow_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - ansible_play_hosts_all == [ops_grow_box ~ '-dom0']
          - node_xen_guest_specs.ops.required_lvs == ['/dev/vg0/lv_ops']
          - node_xen_guest_specs.ops.lv_size == '100G'

    - name: Require an existing running controller and existing LV
      ansible.builtin.shell: |
        set -eu
        /usr/sbin/xl list ops >/dev/null
        /sbin/lvs /dev/vg0/lv_ops >/dev/null
      changed_when: false
  tasks:
    - name: Expand the controller LV to at least 100 GiB
      community.general.lvol:
        vg: vg0
        lv: lv_ops
        size: 100G
        shrink: false
        state: present

- name: Expand the controller root only after Xen reports the new disk size
  hosts: ops
  gather_facts: false
  pre_tasks:
    - name: Select local transport for the invoking controller only
      ansible.builtin.set_fact:
        ansible_connection: local
        ansible_host: localhost
      when: inventory_hostname == lookup('pipe', 'hostname') | trim

    - name: Require one exact controller guest
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == [ops_grow_box ~ '-ops']

    - name: Wait for online disk size discovery before changing partitions
      ansible.builtin.command:
        argv: [cat, /sys/class/block/xvda/size]
      register: ops_grow_disk
      changed_when: false
      retries: 10
      delay: 2
      until: ops_grow_disk.stdout | int >= 209715200
      failed_when: ops_grow_disk.stdout | int < 209715200

    - name: Require the expected root filesystem
      ansible.builtin.shell: |
        set -eu
        test "$(awk '$2 == "/" {print $1 " " $3}' /proc/mounts)" = '/dev/xvda3 ext4'
      changed_when: false
  tasks:
    - name: Grow the root with temporary native tools
      block:
        - name: Install partition and filesystem growth tools
          ansible.builtin.command:
            argv: [apk, --timeout, '10', add, --update-cache, --no-progress, --virtual, .klokast-ops-grow, cloud-utils-growpart, e2fsprogs-extra]
          changed_when: true

        - name: Grow and verify the root partition and filesystem
          ansible.builtin.script:
            cmd: ../roles/ops-controller/files/ops-root-grow
            executable: /usr/bin/python3
          register: ops_grow_result
          changed_when: "'root-grown' in ops_grow_result.stdout"
      always:
        - name: Remove only this operation's temporary tool dependency
          ansible.builtin.command:
            argv: [apk, del, .klokast-ops-grow]
          changed_when: true
