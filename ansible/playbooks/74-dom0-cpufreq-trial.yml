---
# Temporary: one boot of Xen with cpufreq=hwp, for the journal case k002-slow-cpu.
# It reboots no machine. Remove this playbook, its helper and its test after the trial.
- name: Arm or clear a one-time Xen cpufreq=hwp boot entry
  hosts: dom0
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require active controller authority
      ansible.builtin.command: /usr/local/sbin/klokast-controller-guard --require-active
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Require one explicit box and one known action
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == cpufreq_trial_box ~ '-dom0'
          - cpufreq_trial_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - cpufreq_trial_action in ['arm', 'clear', 'status']
  tasks:
    - name: Run the trial action with the staged transaction helper
      block:
        - name: Allocate a protected staging directory
          ansible.builtin.tempfile:
            path: /run
            prefix: klokast-cpufreq-trial-
            state: directory
          register: cpufreq_trial_directory
          changed_when: false
        - name: Stage the trial helper and the host transaction helper
          ansible.builtin.copy:
            src: '../roles/dom0-update/files/{{ item }}'
            dest: '{{ cpufreq_trial_directory.path }}/{{ item }}'
            owner: root
            group: root
            mode: '0600'
          loop: [dom0_cpufreq_trial.py, dom0_update.py]
          changed_when: false
        - name: Run the action under the native operation locks
          ansible.builtin.command:
            argv: [/usr/bin/python3, -B, '{{ cpufreq_trial_directory.path }}/dom0_cpufreq_trial.py',
                   '{{ cpufreq_trial_action }}', --box, '{{ cpufreq_trial_box }}']
          register: cpufreq_trial_result
          changed_when: cpufreq_trial_action != 'status'
        - name: Report the GRUB state
          ansible.builtin.debug:
            msg: '{{ cpufreq_trial_result.stdout | from_json }}'
      always:
        - name: Remove the staging directory
          ansible.builtin.file:
            path: '{{ cpufreq_trial_directory.path }}'
            state: absent
          when: cpufreq_trial_directory.path is defined
          changed_when: false
