---
- name: Apply or verify one selected router access configuration
  hosts: router
  gather_facts: true
  vars:
    platform_box_access_reply_pattern: >-
      ^pong from {{ (node_name ~ '-router') | regex_escape }}(?:\.{{ platform_magicdns_suffix | regex_escape }})? \([0-9a-fA-F:.]+\) via (?:DERP\([a-z0-9]+\)|[0-9.]+:[0-9]+|\[[0-9a-fA-F:]+\]:[0-9]+) in [0-9]+(?:\.[0-9]+)?(?:ms|s)$
  tasks:
    - name: Require one closed box access operation
      ansible.builtin.assert:
        that:
          - platform_box_access_operation in ['apply', 'verify']
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == node_name ~ '-router'
        fail_msg: >-
          The box access workflow requires one exact router and an apply or
          verify operation.

    - name: Apply the selected router access configuration
      ansible.builtin.import_role:
        name: router
      when: platform_box_access_operation == 'apply'

    - name: Flush router handlers before access verification
      ansible.builtin.meta: flush_handlers
      when: platform_box_access_operation == 'apply'

    - name: Verify the selected router configuration and declared paths
      ansible.builtin.import_role:
        name: router-verification
      check_mode: false

    - name: Check controller reachability to the selected router
      ansible.builtin.command:
        argv:
          - tailscale
          - ping
          - --c
          - "1"
          - --until-direct=false
          - --timeout=5s
          - "{{ ansible_host }}"
      delegate_to: localhost
      become: false
      register: platform_box_access_controller_ping
      changed_when: false
      check_mode: false

    - name: Require a recognized reply from the selected router
      ansible.builtin.assert:
        that:
          - platform_box_access_controller_ping.stdout_lines | length == 1
          - platform_box_access_controller_ping.stdout is match(platform_box_access_reply_pattern)
        fail_msg: >-
          The controller did not receive one recognized Tailnet reply from
          the selected router. Both direct and DERP paths are permitted.

    - name: Report observed DERP transport after successful access checks
      ansible.builtin.debug:
        msg: "Controller-to-router probe used DERP. Access checks passed."
      when: "'via DERP(' in platform_box_access_controller_ping.stdout"
