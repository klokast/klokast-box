---
- name: Retire exact unused replacement resources under a short scoped grant
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require exact unused cleanup selectors and grant purpose
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_cleanup_box ~ '-dom0'
          - router_cleanup_operation is match('^[0-9a-f]{24}$')
          - router_cleanup_token is match('^[0-9a-f]{12}$')
          - router_cleanup_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_cleanup_operation
          - router_cleanup_grant.kind == 'klokast.router-preparation-cleanup-authorization.v1'

    - name: Require the active controller before granting unused cleanup
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Stage only this short purpose-specific unused cleanup grant
      ansible.builtin.copy:
        content: '{{ router_cleanup_grant | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_cleanup_operation }}/preparation-cleanup-grant-{{ router_cleanup_token }}.json'
        owner: root
        group: root
        mode: '0600'
        force: false

    - name: Read the retained unused cleanup grant
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_cleanup_operation }}/preparation-cleanup-grant-{{ router_cleanup_token }}.json'
      register: router_cleanup_retained

    - name: Refuse an earlier or changed unused cleanup grant
      ansible.builtin.assert:
        that: [(router_cleanup_retained.content | b64decode | from_json) == router_cleanup_grant]

    - name: Run the bounded native unused cleanup supervisor
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, abort-preparation,
               --box, '{{ router_cleanup_box }}', --operation-id, '{{ router_cleanup_operation }}',
               --cleanup-token, '{{ router_cleanup_token }}']
      register: router_cleanup_native
      changed_when: true

    - name: Retain the exact native unused cleanup result
      ansible.builtin.copy:
        content: '{{ router_cleanup_native.stdout }}'
        dest: '{{ router_cleanup_result_dir }}/preparation-retired-{{ router_cleanup_token }}.json'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false

