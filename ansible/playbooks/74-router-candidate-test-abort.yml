---
- name: Record exact absence after diagnostic candidate allocation failed
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one exact candidate test target
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_candidate_abort_box ~ '-dom0'
          - router_candidate_abort_operation is match('^[0-9a-f]{24}$')

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Inspect the exact diagnostic operation directory before staging code
      ansible.builtin.stat:
        path: '/mnt/dom0_data/klokast-router-candidate-tests/{{ router_candidate_abort_operation }}'
        follow: false
      register: router_candidate_abort_directory

    - name: Require a private root-owned diagnostic operation directory
      ansible.builtin.assert:
        that:
          - router_candidate_abort_directory.stat.isdir | default(false)
          - router_candidate_abort_directory.stat.pw_name == 'root'
          - router_candidate_abort_directory.stat.mode == '0700'

    - name: Stage the corrected exact allocation record helper
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../lib/router_candidate_disk.py'
        dest: '/mnt/dom0_data/klokast-router-candidate-tests/{{ router_candidate_abort_operation }}/router_candidate_disk.py'
        owner: root
        group: root
        mode: '0600'

    - name: Stage the fixed failed-allocation reconciliation command
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../roles/router-candidate-preparation/files/router-candidate-test-abort-dom0'
        dest: '/mnt/dom0_data/klokast-router-candidate-tests/{{ router_candidate_abort_operation }}/router-candidate-test-abort-dom0'
        owner: root
        group: root
        mode: '0700'

    - name: Record exact absence without guessing a disk UUID
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-candidate-tests/{{ router_candidate_abort_operation }}/router-candidate-test-abort-dom0'
          - --box
          - '{{ router_candidate_abort_box }}'
          - --operation-id
          - '{{ router_candidate_abort_operation }}'
      register: router_candidate_abort_result
      changed_when: true

    - name: Require the exact aborted allocation record
      ansible.builtin.assert:
        that:
          - (router_candidate_abort_result.stdout | from_json).box == router_candidate_abort_box
          - (router_candidate_abort_result.stdout | from_json).operation_id == router_candidate_abort_operation
          - (router_candidate_abort_result.stdout | from_json).stage == 'aborted'
