---
- name: Verify saved templates or remove checked disposable artifacts
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  tasks:
    - name: Validate the explicit cleanup target and action
      ansible.builtin.assert:
        that:
          - cleanup_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - cleanup_current is match('^[0-9a-f]{24}$')
          - cleanup_action | default('plan') in ['plan', 'apply', 'verify', 'preflight']
          - cleanup_observation_id | default(cleanup_current) is match('^[0-9a-f]{24}$')
          - cleanup_result_dir == '/var/lib/klokast/updates/discovery/builds/' ~ (cleanup_observation_id | default(cleanup_current))
          - cleanup_action | default('plan') == 'verify' or cleanup_observation_id | default(cleanup_current) == cleanup_current
          - inventory_hostname == cleanup_box ~ '-dom0'
          - cleanup_action | default('plan') != 'apply' or cleanup_plan_sha256 | default('') is match('^[0-9a-f]{64}$')

    - name: Check same-box controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-local-image-box, '{{ cleanup_box }}']
      delegate_to: localhost
      become: false
      changed_when: false
      register: cleanup_controller

    - name: Require the matching local controller
      ansible.builtin.assert:
        that:
          - (cleanup_controller.stdout | from_json).configured | bool
          - (cleanup_controller.stdout | from_json).local_image_box == cleanup_box

    - name: Verify mounted storage before any setup or inspection
      ansible.builtin.command:
        argv: [/bin/mountpoint, -q, /mnt/dom0_data]
      changed_when: false

    - name: Create protected image directories during preflight
      ansible.builtin.file:
        path: '/mnt/dom0_data/klokast-vm-templates/{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: ['', candidates, staging]
      when: cleanup_action | default('plan') == 'preflight'

    - name: Inspect persistent template storage
      ansible.builtin.stat:
        path: /mnt/dom0_data/klokast-vm-templates
        get_checksum: false
      register: cleanup_base

    - name: Require protected template storage before staging the helper
      ansible.builtin.assert:
        that:
          - cleanup_base.stat.isdir | default(false)
          - not (cleanup_base.stat.islnk | default(true))
          - cleanup_base.stat.uid == 0
          - not (cleanup_base.stat.wgrp | default(true))
          - not (cleanup_base.stat.woth | default(true))
      when: cleanup_base.stat.exists

    - name: Stage the public setup cleanup helper
      ansible.builtin.copy:
        src: ../roles/vm-template-cleanup/files/vm-template-cleanup
        dest: /mnt/dom0_data/klokast-vm-templates/cleanup-helper.py
        owner: root
        group: root
        mode: '0600'
      when: cleanup_base.stat.exists

    - name: Find candidate directories for public build evidence
      ansible.builtin.find:
        paths: /mnt/dom0_data/klokast-vm-templates/candidates
        file_type: directory
        recurse: false
        use_regex: true
        patterns: ['^[0-9a-f]{24}$']
      register: cleanup_candidates
      when: cleanup_action | default('plan') in ['plan', 'apply']

    - name: Stage controller build receipts for existing candidates
      ansible.builtin.include_tasks: ../roles/vm-template-cleanup/tasks/evidence.yml
      loop: "{{ cleanup_candidates.files | default([]) }}"
      loop_control:
        loop_var: cleanup_candidate
      when: cleanup_action | default('plan') in ['plan', 'apply']

    - name: Verify saved image bytes or compute or apply the checked cleanup plan
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/timeout', '1800', '/usr/bin/python3', '/mnt/dom0_data/klokast-vm-templates/cleanup-helper.py', cleanup_action | default('plan'), '--box', cleanup_box, '--current', cleanup_current] + (['--preserve-qualified'] if cleanup_preserve_qualified | default(false) | bool else []) + (['--plan-sha256', cleanup_plan_sha256] if cleanup_action | default('plan') == 'apply' else []) }}"
      register: cleanup_result
      changed_when: cleanup_action | default('plan') == 'apply'
      when: cleanup_action | default('plan') != 'verify' or cleanup_base.stat.exists

    - name: Record absent template storage for an image request
      ansible.builtin.set_fact:
        cleanup_result:
          stdout: "{{ {'box': cleanup_box, 'current': cleanup_current, 'verified': false, 'reason': 'missing'} | to_json }}"
      when: cleanup_action | default('plan') == 'verify' and not cleanup_base.stat.exists

    - name: Report cleanup evidence
      ansible.builtin.debug:
        msg: "{{ cleanup_result.stdout | from_json }}"

    - name: Save the bounded cleanup result on the controller
      ansible.builtin.copy:
        content: "{{ cleanup_result.stdout }}\n"
        dest: "{{ cleanup_result_dir }}/cleanup-{{ cleanup_action | default('plan') }}.json"
        mode: '0600'
      delegate_to: localhost
      become: false
