---
- name: Build the Alpine VIRT router guest disk for the selected node
  hosts: vm_dom0
  gather_facts: false
  tasks:
    - name: Unlock reviewed router image maintenance packages in RAM
      ansible.builtin.import_role:
        name: dom0-apk-policy
        tasks_from: maintenance-unlock.yml
      vars:
        dom0_maintenance_packages:
          - curl
          - kpartx
          - sfdisk
          - xorriso

    - name: Build the router image with transient dom0 tooling
      block:
        - name: Prepare shared Alpine VIRT assets on dom0
          ansible.builtin.import_role:
            name: alpine-virt-assets

        - name: Build the installed Alpine router root disk
          ansible.builtin.import_role:
            name: router-alpine-rootfs

        - name: Copy the installed router kernel and initramfs into dom0 shared storage
          ansible.builtin.import_role:
            name: xen-guest-artifacts
          vars:
            xen_guest_name: "{{ node_xen_guest_specs.router.guest_name }}"
            xen_guest_lv_path: "{{ node_xen_guest_specs.router.required_lvs | first }}"
            xen_guest_kernel_source_name: vmlinuz-virt
            xen_guest_initramfs_source_name: initramfs-virt
            xen_guest_kernel_dest_path: "{{ dom0_xen_images_path }}/router-kernel"
            xen_guest_initramfs_dest_path: "{{ dom0_xen_images_path }}/router-initramfs"

        - name: Render the installed-stage router Xen guest configuration
          ansible.builtin.import_role:
            name: xen-guest
          vars:
            xen_guest_spec: "{{ node_xen_guest_specs.router }}"
      always:
        - name: Remove router image maintenance packages and lock APK
          ansible.builtin.import_role:
            name: dom0-apk-policy
            tasks_from: maintenance-lock.yml

    - name: Persist router build state on the diskless dom0 host
      ansible.builtin.shell: |
        set -eu
        apk cache sync >/dev/null
        backupdir="$(awk -F= '$1 == "LBU_BACKUPDIR" {print $2}' /etc/lbu/lbu.conf | tail -n 1)"
        if [ -n "$backupdir" ]; then
          mount_info="$(awk -v backupdir="$backupdir" '$2 == backupdir {print $1 " " $4; exit}' /proc/mounts)"
          if [ -n "$mount_info" ]; then
            set -- $mount_info
            case ",$2," in
              *,ro,*) mount -o remount,rw "$1" "$backupdir" ;;
            esac
          fi
        fi
        lbu commit -d
      args:
        executable: /bin/sh
      changed_when: false
