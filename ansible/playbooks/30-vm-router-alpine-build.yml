---
- name: Verify dom0 network prerequisites before preparing the common router template
  hosts: vm_dom0
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the active controller for router provisioning
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require the exact router dom0 target
      ansible.builtin.assert:
        that:
          - inventory_hostname == node_name ~ '-dom0'
          - dom0_wan_bridge_name is match('^[a-zA-Z0-9_-]+$')
          - (dom0_wan_uplink_interface | default('auto')) is match('^[a-zA-Z0-9_.-]+$')

    - name: Verify one physical WAN uplink on the live bridge
      ansible.builtin.shell: |
        set -eu
        bridge={{ dom0_wan_bridge_name | quote }}
        configured={{ (dom0_wan_uplink_interface | default('auto')) | quote }}
        hardware_nic() {
          [ -d "/sys/class/net/$1/device" ] || return 1
          subsystem=$(readlink -f "/sys/class/net/$1/device/subsystem" 2>/dev/null) || return 1
          case "${subsystem##*/}" in
            pci|usb) return 0 ;;
            *) return 1 ;;
          esac
        }
        if [ "$configured" != auto ]; then
          if ! hardware_nic "$configured" ||
             [ "$(basename "$(readlink -f "/sys/class/net/$configured/master")")" != "$bridge" ]; then
            printf 'Configured physical WAN uplink %s is not on %s\n' "$configured" "$bridge" >&2
            exit 1
          fi
          printf '%s\n' "$configured"
          exit 0
        fi
        count=0
        for port in "/sys/class/net/$bridge/brif/"*; do
          [ -e "$port" ] || continue
          name=${port##*/}
          hardware_nic "$name" || continue
          count=$((count + 1))
          uplink=$name
        done
        if [ "$count" -ne 1 ]; then
          printf 'WAN bridge %s must have one physical uplink; found %s\n' "$bridge" "$count" >&2
          exit 1
        fi
        printf '%s\n' "$uplink"
      args:
        executable: /bin/sh
      register: router_wan_uplink
      changed_when: false
