---
- name: Verify dom0 network prerequisites before preparing the common router template
  hosts: vm_dom0
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the active controller for router provisioning
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require the exact router dom0 target
      ansible.builtin.assert:
        that:
          - inventory_hostname == node_name ~ '-dom0'
          - dom0_wan_bridge_name is match('^[a-zA-Z0-9_-]+$')
          - dom0_wan_uplink_interface_resolved is match('^[a-zA-Z0-9_.-]+$')

    - name: Read the live WAN uplink bridge
      ansible.builtin.command:
        argv:
          - /bin/readlink
          - -f
          - '/sys/class/net/{{ dom0_wan_uplink_interface_resolved }}/master'
      register: router_wan_master
      changed_when: false

    - name: Require the WAN uplink on the approved bridge
      ansible.builtin.assert:
        that:
          - router_wan_master.stdout | basename == dom0_wan_bridge_name
        fail_msg: >-
          The live WAN uplink is not on the approved bridge. Complete the
          dom0 bridge phase before preparing or starting a router.
