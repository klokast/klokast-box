---
- name: Stage one exact K001 cold supervisor selector without stopping the router
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require the exact K001 request and private controller operation
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'k001-dom0'
          - router_cold_request_box == 'k001'
          - router_cold_request_operation is match('^[0-9a-f]{24}$')
          - router_cold_request_engine is match('^[0-9a-f]{40}$')
          - router_cold_request_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_request_operation
          - router_cold_request_value.kind == 'klokast.router-cold-supervised-request.v1'
          - router_cold_request_value.box == 'k001'
          - router_cold_request_value.operation_id == router_cold_request_operation
          - router_cold_request_value.engine_commit == router_cold_request_engine

    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read development implementation metadata
      ansible.builtin.command:
        argv: [/usr/local/sbin/platform-source, implementation]
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_request_authority

    - name: Read controller source commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_request_commit

    - name: Read controller source changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: '{{ playbook_dir }}/../..'
      delegate_to: localhost
      become: false
      changed_when: false
      register: router_cold_request_changes

    - name: Bind the request to the current development implementation
      ansible.builtin.assert:
        that:
          - (router_cold_request_authority.stdout | from_json).commit == router_cold_request_engine
          - router_cold_request_commit.stdout == router_cold_request_engine

    - name: Inspect controller evidence directory
      ansible.builtin.stat:
        path: '{{ router_cold_request_result }}'
        follow: false
      delegate_to: localhost
      become: false
      register: router_cold_request_evidence

    - name: Require owner-only controller evidence
      ansible.builtin.assert:
        that:
          - router_cold_request_evidence.stat.isdir | default(false)
          - not (router_cold_request_evidence.stat.islnk | default(false))
          - router_cold_request_evidence.stat.pw_name == 'smith'
          - router_cold_request_evidence.stat.mode == '0700'

    - name: Inspect any prior request input
      ansible.builtin.stat:
        path: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_request_operation }}/supervised-request-input.json'
        follow: false
      register: router_cold_request_prior

    - name: Read prior request input without replacing it
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_request_operation }}/supervised-request-input.json'
      when: router_cold_request_prior.stat.exists
      register: router_cold_request_prior_content
      no_log: true

    - name: Refuse a changed request input
      ansible.builtin.assert:
        that:
          - not router_cold_request_prior.stat.exists or
            (router_cold_request_prior.stat.isreg | default(false) and
             router_cold_request_prior.stat.uid == 0 and
             router_cold_request_prior.stat.mode == '0600' and
             (router_cold_request_prior_content.content | b64decode | from_json) == router_cold_request_value)

    - name: Stage the exact request input for the installed engine
      ansible.builtin.copy:
        content: '{{ router_cold_request_value | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_request_operation }}/supervised-request-input.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Let the installed engine validate the live original and stage the selector
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-request-stage,
               --box, k001, --operation-id, '{{ router_cold_request_operation }}']
      changed_when: false
      register: router_cold_request_staged

    - name: Require the exact installed-engine request result
      ansible.builtin.assert:
        that:
          - (router_cold_request_staged.stdout | from_json).kind == 'klokast.router-command-result.v1'
          - (router_cold_request_staged.stdout | from_json).box == 'k001'
          - (router_cold_request_staged.stdout | from_json).action == 'cold-request-stage'
          - (router_cold_request_staged.stdout | from_json).engine_commit == router_cold_request_engine
          - (router_cold_request_staged.stdout | from_json).result == router_cold_request_value

    - name: Keep the immutable staged selector receipt on the controller
      ansible.builtin.copy:
        content: '{{ router_cold_request_staged.stdout }}'
        dest: '{{ router_cold_request_result }}/cold-supervisor-request-stage.json'
        mode: '0600'
      delegate_to: localhost
      become: false
