---
- name: Read one protected router check source without changing the guest
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require exact controller result and target paths
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_check_box ~ '-dom0'
          - router_check_operation is match('^[0-9a-f]{24}$')
          - router_check_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_check_operation
          - router_check_output is match('^(accepted-source(-final)?|cold-accepted-source|replacement-source(-final)?|[a-z0-9-]+-accepted(-final)?)[.]json$')

    - name: Require the active controller before reading the accepted source
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read the protected current router generation
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, accepted-source, --box, '{{ router_check_box }}']
      changed_when: false
      register: router_check_source

    - name: Store only the protected accepted-source projection on the controller
      ansible.builtin.copy:
        content: '{{ router_check_source.stdout }}'
        dest: '{{ router_check_result_dir }}/{{ router_check_output }}'
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
