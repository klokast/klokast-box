---
- name: Prepare and enroll a qualified native runner image
  hosts: dom0
  gather_facts: false
  any_errors_fatal: true
  roles:
    - infrastructure-guest

- name: Verify the exact enrolled runner through Tailscale SSH
  hosts: air
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for Tailscale maintenance access
      ansible.builtin.wait_for_connection:
        timeout: 120
    - name: Read the runner device and Xen identities
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import json, pathlib, subprocess
            status = json.loads(subprocess.check_output(['tailscale', 'status', '--json']))
            prefs = json.loads(subprocess.check_output(['tailscale', 'debug', 'prefs']))
            print(json.dumps({'hostname': status['Self']['HostName'], 'tags': status['Self']['Tags'],
                              'device_id': status['Self']['ID'], 'online': status['BackendState'] == 'Running',
                              'ssh': prefs['RunSSH'],
                              'uuid': pathlib.Path('/sys/hypervisor/uuid').read_text().strip()}))
      register: air_enrolled
      changed_when: false
    - name: Require the assigned Xen VM and enrolled Tailscale device
      ansible.builtin.assert:
        that:
          - (air_enrolled.stdout | from_json).hostname == node_hostname
          - (air_enrolled.stdout | from_json).tags == ['tag:airunner']
          - (air_enrolled.stdout | from_json).online
          - (air_enrolled.stdout | from_json).ssh
          - (air_enrolled.stdout | from_json).uuid == air_assignment.uuid
          - air_assignment.enrollment_result is not defined or (air_enrolled.stdout | from_json).device_id == air_assignment.enrollment_result.device_id
      vars:
        air_assignment: '{{ (hostvars[node_name ~ "-dom0"].infrastructure_enrollment.stdout | from_json).state }}'
    - name: Verify the managed runner firewall
      ansible.builtin.import_role:
        name: podman-vm-firewall
    - name: Configure the native runner workspace
      ansible.builtin.import_role:
        name: air-workspace

- name: Persist only the verified runner permanent boot recipe
  hosts: dom0
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install the permanent runner Xen configuration
      ansible.builtin.copy:
        src: /mnt/dom0_data/klokast-infrastructure/air/air.cfg
        dest: /etc/xen/air.cfg
        remote_src: true
        owner: root
        group: root
        mode: '0600'
    - name: Enable the verified runner at dom0 boot
      ansible.builtin.file:
        src: /etc/xen/air.cfg
        dest: /etc/xen/auto/air.cfg
        state: link
    - name: Persist runner boot links on diskless dom0
      ansible.builtin.command: lbu commit -d
      changed_when: false
