---
- name: Refresh root-only Tailscale secrets on an ops controller VM
  hosts: ops
  gather_facts: false
  vars:
    ops_private_state_transfer_root_secrets: true
  tasks:
    - name: Refresh root-only Tailscale OAuth material
      ansible.builtin.import_role:
        name: ops-private-state-transfer
        tasks_from: root-secret-files

    - name: Check target Tailscale auth-key minting configuration
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/ts-authkey-ops
          - --check-config
          - --hostname
          - "{{ node_hostname }}"
          - --tags
          - "{{ vm_tailscale_authkey_advertise_tags }}"
      register: ops_target_authkey_wrapper_check
      changed_when: false

    - name: Check target airunner Tailscale auth-key minting configurations
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/ts-authkey-airunner
          - --check-config
          - --hostname
          - "{{ item.value.name }}"
          - --tags
          - "{{ ops_airunner_tailscale_advertise_tags }}"
      loop: "{{ ops_airunner_instances | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: ops_target_airunner_authkey_wrapper_check
      changed_when: false

    - name: Check target Tailscale device lifecycle configuration
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/ts-devices-list
      register: ops_target_devices_list_check
      changed_when: false
      no_log: true

    - name: Assert target Tailscale device lifecycle configuration works
      ansible.builtin.assert:
        that:
          - (ops_target_devices_list_check.stdout | from_json).devices is defined
        fail_msg: The target Tailscale device lifecycle wrapper did not return a device list.

    - name: Check target root-only Tailscale secret file modes
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ ops_controller_root_secret_files }}"
      register: ops_target_root_secret_stats
      no_log: true

    - name: Assert target root-only Tailscale secret files are locked down
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - item.stat.pw_name == "root"
          - item.stat.gr_name == "root"
          - item.stat.mode == "0600"
        fail_msg: A target Tailscale secret file is missing or has unsafe ownership or mode.
      loop: "{{ ops_target_root_secret_stats.results }}"
      no_log: true
