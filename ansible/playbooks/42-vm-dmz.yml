---
- name: Create or verify DMZ through the common image entrypoint
  hosts: vm_dom0
  gather_facts: false
  tasks:
    - name: Run DMZ provisioning on the active controller
      ansible.builtin.command:
        argv: ['{{ playbook_dir }}/../bin/platform-update', provision, --box, '{{ node_name }}', --role, dmz]
      delegate_to: localhost
      become: false
      changed_when: false
