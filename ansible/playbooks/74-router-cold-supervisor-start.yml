---
- name: Start one explicitly approved supervised K001 cold window
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  vars:
    router_cold_directory: '/mnt/dom0_data/klokast-router-updates/cold-backups/{{ router_cold_operation }}'
    ansible_async_dir: '{{ router_cold_directory }}/async'
  tasks:
    - name: Require the exact supervised outage grant
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'k001-dom0'
          - router_cold_box == 'k001'
          - router_cold_operation is match('^[0-9a-f]{24}$')
          - router_cold_engine is match('^[0-9a-f]{40}$')
          - router_cold_request_sha256 is match('^[0-9a-f]{64}$')
          - router_cold_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_operation
          - router_cold_grant.kind == 'klokast.router-cold-outage-authorization.v1'
          - router_cold_grant.box == router_cold_box
          - router_cold_grant.operation_id == router_cold_operation
          - router_cold_grant.engine_commit == router_cold_engine
          - router_cold_grant.request_sha256 == router_cold_request_sha256
          - router_cold_grant.outage_authorized is sameas true

    - name: Require the active controller before dispatch
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Refuse an earlier local supervisor launch
      ansible.builtin.stat:
        path: '{{ router_cold_directory }}/{{ item }}'
        follow: false
      loop: [supervisor-worker.log, supervisor-job.json]
      register: router_cold_prior_launch

    - name: Require a supervisor that has never been launched
      ansible.builtin.assert:
        that: [not item.stat.exists]
        fail_msg: Cold supervisor launch is uncertain or already recorded; collect the original job instead.
      loop: '{{ router_cold_prior_launch.results }}'

    - name: Stage the immutable short outage grant
      ansible.builtin.copy:
        content: '{{ router_cold_grant | to_json }}'
        dest: '{{ router_cold_directory }}/outage-authorization.json'
        owner: root
        group: root
        mode: '0600'
        force: false

    - name: Read the retained outage grant
      ansible.builtin.slurp:
        src: '{{ router_cold_directory }}/outage-authorization.json'
      register: router_cold_retained_grant

    - name: Refuse a changed outage grant
      ansible.builtin.assert:
        that: [(router_cold_retained_grant.content | b64decode | from_json) == router_cold_grant]

    - name: Create the private operation job cache
      ansible.builtin.file:
        path: '{{ ansible_async_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Launch the bounded local supervisor and its recovery parent
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, cold-run,
               --box, k001, --operation-id, '{{ router_cold_operation }}']
      async: 5400
      poll: 0
      register: router_cold_worker
      changed_when: true

    - name: Require one retained supervisor job
      ansible.builtin.assert:
        that:
          - router_cold_worker.started | bool
          - router_cold_worker.ansible_job_id is match('^[A-Za-z0-9_.-]{1,128}$')

    - name: Bind the exact worker to its approved request
      ansible.builtin.set_fact:
        router_cold_worker_receipt:
          kind: klokast.router-cold-supervisor-worker.v1
          box: '{{ router_cold_box }}'
          operation_id: '{{ router_cold_operation }}'
          engine_commit: '{{ router_cold_engine }}'
          request_sha256: '{{ router_cold_request_sha256 }}'
          ansible_job_id: '{{ router_cold_worker.ansible_job_id }}'

    - name: Save the exact job on dom0 before replying to the controller
      ansible.builtin.copy:
        content: '{{ router_cold_worker_receipt | to_json }}'
        dest: '{{ router_cold_directory }}/supervisor-job.json'
        owner: root
        group: root
        mode: '0600'
        force: false

    - name: Save the launch receipt on the controller
      ansible.builtin.copy:
        content: '{{ router_cold_worker_receipt | to_json }}'
        dest: '{{ router_cold_result }}/cold-supervisor-worker.json'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
