---
- name: Retire selected unused cold-test resources before a router outage
  hosts: k001-dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one exact active-controller abort selector
      ansible.builtin.assert:
        that:
          - router_cold_abort_box == 'k001'
          - router_cold_abort_operation is match('^[0-9a-f]{24}$')
          - router_cold_abort_engine is match('^[0-9a-f]{40}$')
          - router_cold_abort_token is match('^[0-9a-f]{12}$')
          - router_cold_abort_result == '/var/lib/klokast/updates/discovery/router/' ~ router_cold_abort_operation

    - name: Require active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Select one exact native cleanup contract
      ansible.builtin.set_fact:
        router_cold_abort_action: '{{ "cold-bootstrap-retire-staging" if router_cold_abort_staging_only | default(false) | bool else "cold-retire-prepared-bootstrap" if router_cold_abort_artifacts_only | default(false) | bool else "cold-abort-prepared" }}'
        router_cold_abort_kind: '{{ "klokast.router-cold-staging-cleanup.v1" if router_cold_abort_staging_only | default(false) | bool else "klokast.router-cold-bootstrap-cleanup.v1" if router_cold_abort_artifacts_only | default(false) | bool else "klokast.router-cold-prepared-abort.v1" }}'
        router_cold_abort_status: '{{ "unused-staging-retired" if router_cold_abort_staging_only | default(false) | bool else "unused-bootstrap-retired" if router_cold_abort_artifacts_only | default(false) | bool else "retired" }}'

    - name: Retire only the exact selected pre-outage resources
      ansible.builtin.command:
        argv: [/usr/local/sbin/router-update-transaction, '{{ router_cold_abort_action }}',
               --box, k001, --operation-id, '{{ router_cold_abort_operation }}']
      register: router_cold_abort_receipt
      changed_when: true

    - name: Require the exact installed-engine abort result
      ansible.builtin.assert:
        that:
          - (router_cold_abort_receipt.stdout | from_json).kind == 'klokast.router-command-result.v1'
          - (router_cold_abort_receipt.stdout | from_json).box == 'k001'
          - (router_cold_abort_receipt.stdout | from_json).action == router_cold_abort_action
          - (router_cold_abort_receipt.stdout | from_json).engine_commit == router_cold_abort_engine
          - (router_cold_abort_receipt.stdout | from_json).result.kind == router_cold_abort_kind
          - (router_cold_abort_receipt.stdout | from_json).result.operation_id == router_cold_abort_operation
          - (router_cold_abort_receipt.stdout | from_json).result.status == router_cold_abort_status

    - name: Save the exact pre-outage abort receipt
      ansible.builtin.copy:
        content: '{{ router_cold_abort_receipt.stdout }}'
        dest: '{{ router_cold_abort_result }}/cold-prepared-abort-{{ router_cold_abort_token }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false

- name: Persist the retired cold backup LVM metadata
  ansible.builtin.import_playbook: 74-router-diagnostic-lbu-commit.yml
  vars:
    router_diagnostic_lbu_box: '{{ router_cold_abort_box }}'
