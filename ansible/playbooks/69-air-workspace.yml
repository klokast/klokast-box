---
- name: Configure native runner workspaces
  hosts: air
  gather_facts: false
  pre_tasks:
    - name: Require active controller authority
      tags: [always]
      ansible.builtin.command: /usr/local/sbin/klokast-controller-guard --require-active
      delegate_to: localhost
      become: false
      changed_when: false
  roles:
    - air-workspace

- name: Install existing controller contacts on runners
  ansible.builtin.import_playbook: 69-air-controller-contacts.yml
