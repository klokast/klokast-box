---
- name: Retire exact controller transfer bytes for an unused native template
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require exact controller cache cleanup arguments
      ansible.builtin.assert:
        that:
          - router_cache_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
          - router_cache_operation is match('^[0-9a-f]{24}$')
          - router_cache_reference_token is match('^[0-9a-f]{12}$')
    - name: Require the active controller
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      changed_when: false
    - name: Retire only the exact obsolete template's transfer files
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import json,sys
            from pathlib import Path
            sys.path.insert(0,sys.argv[1])
            import router_template_cache as cache
            import router_update_controller as transport
            box,operation,token=sys.argv[2:]
            state=Path('/var/lib/klokast/updates/discovery/router')
            reference=transport.load(state/operation/('cache-reference-'+token+'.json'))
            result=cache.retire('/var/cache/klokast/updates/router',state,box,operation,reference)
            print(json.dumps(result,sort_keys=True))
          - '{{ playbook_dir }}/../lib'
          - '{{ router_cache_box }}'
          - '{{ router_cache_operation }}'
          - '{{ router_cache_reference_token }}'
      register: router_cache_cleanup
      changed_when: (router_cache_cleanup.stdout | from_json).removed_now | length > 0
