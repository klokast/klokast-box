---
- name: Restore verified dom0 clock synchronization for VM update evidence
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  tasks:
    - name: Require one selected dom0
      ansible.builtin.assert:
        that:
          - update_time_box in ['k001', 'k002']
          - inventory_hostname == update_time_box ~ '-dom0'

    - name: Verify active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_time_controller

    - name: Require the configured active controller
      ansible.builtin.assert:
        that:
          - (update_time_controller.stdout | from_json).configured | bool
          - (update_time_controller.stdout | from_json).active | bool

    - name: Limit the optional live clocksource trial to k001
      ansible.builtin.assert:
        that:
          - (update_time_clocksource | default('keep')) in ['keep', 'xen']
          - (update_time_clocksource | default('keep')) != 'xen' or update_time_box == 'k001'

    - name: Read available dom0 clocksources
      ansible.builtin.command:
        argv: [cat, /sys/devices/system/clocksource/clocksource0/available_clocksource]
      changed_when: false
      register: update_time_available_clocksources

    - name: Require the Xen clocksource for the live trial
      ansible.builtin.assert:
        that:
          - "'xen' in update_time_available_clocksources.stdout.split()"
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Read the current dom0 clocksource
      ansible.builtin.command:
        argv: [cat, /sys/devices/system/clocksource/clocksource0/current_clocksource]
      changed_when: false
      register: update_time_current_clocksource

    - name: Select the Xen clocksource for a reversible live trial
      ansible.builtin.shell: >-
        printf '%s\n' xen > /sys/devices/system/clocksource/clocksource0/current_clocksource
      when:
        - (update_time_clocksource | default('keep')) == 'xen'
        - update_time_current_clocksource.stdout != 'xen'

    - name: Verify the selected dom0 clocksource
      ansible.builtin.command:
        argv: [cat, /sys/devices/system/clocksource/clocksource0/current_clocksource]
      changed_when: false
      register: update_time_selected_clocksource

    - name: Require the requested clocksource to be active
      ansible.builtin.assert:
        that:
          - update_time_selected_clocksource.stdout == 'xen'
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Enable the installed Alpine time service
      ansible.builtin.service:
        name: ntpd
        enabled: true
        state: started
      register: update_time_service

    - name: Persist the time service on diskless dom0
      ansible.builtin.command:
        argv: [/usr/sbin/lbu, commit, -d]
      when: update_time_service.changed

    - name: Read the controller UTC epoch for a bounded correction
      ansible.builtin.command:
        argv: [date, -u, +%s]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_time_controller_epoch

    - name: Read the dom0 UTC epoch before correction
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: update_time_dom0_before

    - name: Require a bounded clock correction
      ansible.builtin.assert:
        that:
          - >-
            ((update_time_dom0_before.stdout | int) -
             (update_time_controller_epoch.stdout | int)) | abs <= 600

    - name: Set dom0 UTC from the active controller when needed
      ansible.builtin.command:
        argv: [date, -u, -s, "@{{ update_time_controller_epoch.stdout }}"]
      when: >-
        ((update_time_dom0_before.stdout | int) -
         (update_time_controller_epoch.stdout | int)) | abs > 30

    - name: Wait for dom0 UTC to match the controller within 30 seconds
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: update_time_dom0_epoch
      changed_when: false
      until: >-
        ((update_time_dom0_epoch.stdout | int) -
         (lookup('pipe', 'date -u +%s') | int)) | abs <= 30
      retries: 24
      delay: 5

    - name: Verify the installed time service remains running
      ansible.builtin.command:
        argv: [/sbin/rc-service, ntpd, status]
      changed_when: false
