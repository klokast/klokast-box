---
- name: Restore verified dom0 clock synchronization for VM update evidence
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  tasks:
    - name: Require one selected dom0
      ansible.builtin.assert:
        that:
          - update_time_box in ['k001', 'k002']
          - inventory_hostname == update_time_box ~ '-dom0'

    - name: Verify active controller authority
      ansible.builtin.command:
        argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_time_controller

    - name: Require the configured active controller
      ansible.builtin.assert:
        that:
          - (update_time_controller.stdout | from_json).configured | bool
          - (update_time_controller.stdout | from_json).active | bool

    - name: Limit the optional live clocksource trial to k001
      ansible.builtin.assert:
        that:
          - (update_time_clocksource | default('keep')) in ['keep', 'xen']
          - (update_time_clocksource | default('keep')) != 'xen' or update_time_box == 'k001'

    - name: Read available dom0 clocksources
      ansible.builtin.command:
        argv: [cat, /sys/devices/system/clocksource/clocksource0/available_clocksource]
      changed_when: false
      register: update_time_available_clocksources

    - name: Require the Xen clocksource for the live trial
      ansible.builtin.assert:
        that:
          - "'xen' in update_time_available_clocksources.stdout.split()"
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Read the current dom0 clocksource
      ansible.builtin.command:
        argv: [cat, /sys/devices/system/clocksource/clocksource0/current_clocksource]
      changed_when: false
      register: update_time_current_clocksource

    - name: Select the Xen clocksource for a reversible live trial
      ansible.builtin.shell: >-
        printf '%s\n' xen > /sys/devices/system/clocksource/clocksource0/current_clocksource
      when:
        - (update_time_clocksource | default('keep')) == 'xen'
        - update_time_current_clocksource.stdout != 'xen'

    - name: Verify the selected dom0 clocksource
      ansible.builtin.command:
        argv: [cat, /sys/devices/system/clocksource/clocksource0/current_clocksource]
      changed_when: false
      register: update_time_selected_clocksource

    - name: Require the requested clocksource to be active
      ansible.builtin.assert:
        that:
          - update_time_selected_clocksource.stdout == 'xen'
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Install a one-shot boot selection for the tested Xen clocksource
      ansible.builtin.copy:
        dest: /etc/init.d/klokast-dom0-xen-clocksource
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/sbin/openrc-run
          description="Select the Xen clocksource before k001 dom0 services"

          depend() {
              need sysfs
              before ntpd xendomains
          }

          start() {
              ebegin "Select k001 Xen clocksource"
              if [ "$(hostname)" != "k001-dom0" ]; then
                  eend 1 "Clocksource service is on the wrong dom0"
                  return 1
              fi
              if ! grep -qw xen /sys/devices/system/clocksource/clocksource0/available_clocksource; then
                  eend 1 "Xen clocksource is unavailable"
                  return 1
              fi
              if ! printf '%s\n' xen > /sys/devices/system/clocksource/clocksource0/current_clocksource; then
                  eend 1 "Cannot select Xen clocksource"
                  return 1
              fi
              if [ "$(cat /sys/devices/system/clocksource/clocksource0/current_clocksource)" != xen ]; then
                  eend 1 "Xen clocksource was not selected"
                  return 1
              fi
              eend 0
          }
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Enable the one-shot clocksource selection before default services
      ansible.builtin.command:
        argv: [/sbin/rc-update, add, klokast-dom0-xen-clocksource, boot]
      changed_when: false
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Test the installed one-shot clocksource service
      ansible.builtin.command:
        argv: [/sbin/rc-service, klokast-dom0-xen-clocksource, start]
      changed_when: false
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Include the clocksource service in diskless persistence
      ansible.builtin.command:
        argv: [/usr/sbin/lbu, include, /etc/init.d/klokast-dom0-xen-clocksource]
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Include the clocksource boot link in diskless persistence
      ansible.builtin.command:
        argv: [/usr/sbin/lbu, include, /etc/runlevels/boot/klokast-dom0-xen-clocksource]
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Persist the tested clocksource boot selection
      ansible.builtin.command:
        argv: [/usr/sbin/lbu, commit, -d]
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Verify the diskless archive contains the clocksource boot service
      ansible.builtin.shell: |
        set -eu
        archives=$(find /media -maxdepth 2 -type f -name '*.apkovl.tar.gz' -print)
        count=$(printf '%s\n' "$archives" | awk 'NF {n++} END {print n+0}')
        if [ "$count" -ne 1 ]; then
          echo 'Expected one persisted dom0 archive' >&2
          exit 1
        fi
        tar -tzf "$archives" >/dev/null
        tar -tzf "$archives" | awk '
          {sub(/^\.\//, "", $0)}
          $0 == "etc/init.d/klokast-dom0-xen-clocksource" {service=1}
          $0 == "etc/runlevels/boot/klokast-dom0-xen-clocksource" {runlevel=1}
          END {
            if (!service || !runlevel) {
              print "Clocksource boot service is absent from the persisted archive" > "/dev/stderr"
              exit 1
            }
          }
        '
      changed_when: false
      when: (update_time_clocksource | default('keep')) == 'xen'

    - name: Enable the installed Alpine time service
      ansible.builtin.service:
        name: ntpd
        enabled: true
        state: started
      register: update_time_service

    - name: Persist the time service on diskless dom0
      ansible.builtin.command:
        argv: [/usr/sbin/lbu, commit, -d]
      when: update_time_service.changed

    - name: Read the controller UTC epoch for a bounded correction
      ansible.builtin.command:
        argv: [date, -u, +%s]
      delegate_to: localhost
      become: false
      changed_when: false
      register: update_time_controller_epoch

    - name: Read the dom0 UTC epoch before correction
      ansible.builtin.command:
        argv: [date, -u, +%s]
      changed_when: false
      register: update_time_dom0_before

    - name: Require a bounded clock correction
      ansible.builtin.assert:
        that:
          - >-
            ((update_time_dom0_before.stdout | int) -
             (update_time_controller_epoch.stdout | int)) | abs <= 600

    - name: Set dom0 UTC from the active controller when needed
      ansible.builtin.command:
        argv: [date, -u, -s, "@{{ update_time_controller_epoch.stdout }}"]
      when: >-
        ((update_time_dom0_before.stdout | int) -
         (update_time_controller_epoch.stdout | int)) | abs > 30

    - name: Wait for dom0 UTC to match the controller within 30 seconds
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: update_time_dom0_epoch
      changed_when: false
      until: >-
        ((update_time_dom0_epoch.stdout | int) -
         (lookup('pipe', 'date -u +%s') | int)) | abs <= 30
      retries: 24
      delay: 5

    - name: Verify the installed time service remains running
      ansible.builtin.command:
        argv: [/sbin/rc-service, ntpd, status]
      changed_when: false
