---
- name: Stage exact A/B qualification without stopping either router
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require one exact unarmed cutover source
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_replacement_box ~ '-dom0'
          - router_replacement_operation is match('^[0-9a-f]{24}$')
          - router_replacement_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_replacement_operation
          - router_replacement_records.keys() | list | sort == ['compatibility', 'copy-qualification', 'enrollment-source', 'readiness', 'transaction-request']
          - router_replacement_records['transaction-request'].box == router_replacement_box
          - router_replacement_records['transaction-request'].operation_id == router_replacement_operation

    - name: Retain exact source records without overwriting an earlier attempt
      ansible.builtin.copy:
        content: '{{ item.value | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/{{ item.key }}.json'
        owner: root
        group: root
        mode: '0600'
        force: false
      loop: '{{ router_replacement_records | dict2items }}'

    - name: Read back every protected cutover source
      ansible.builtin.slurp:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_replacement_operation }}/{{ item.key }}.json'
      loop: '{{ router_replacement_records | dict2items }}'
      register: router_replacement_staged_records

    - name: Refuse changed cutover staging
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | from_json) == router_replacement_records[item.item.key]
        fail_msg: A retained router cutover record changed. Reconcile the exact operation.
      loop: '{{ router_replacement_staged_records.results }}'

    - name: Validate records and pin B's generation without a grant
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/router-update-transaction
          - stage-cutover
          - --box
          - '{{ router_replacement_box }}'
          - --operation-id
          - '{{ router_replacement_operation }}'
      register: router_replacement_stage_native
      changed_when: false

    - name: Require the exact native stage result
      ansible.builtin.assert:
        that:
          - (router_replacement_stage_native.stdout | from_json).action == 'stage-cutover'
          - (router_replacement_stage_native.stdout | from_json).engine_commit == router_replacement_records['transaction-request'].engine_commit
          - (router_replacement_stage_native.stdout | from_json).result.kind == 'klokast.router-cutover-staged.v1'
          - (router_replacement_stage_native.stdout | from_json).result.status == 'records-qualified-no-cutover'
          - (router_replacement_stage_native.stdout | from_json).result.candidate_sha256 == router_replacement_records['transaction-request'].candidate_sha256

    - name: Save the exact stage result on the controller
      ansible.builtin.copy:
        content: '{{ router_replacement_stage_native.stdout }}'
        dest: '{{ router_replacement_result_dir }}/cutover-stage-result.json'
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
