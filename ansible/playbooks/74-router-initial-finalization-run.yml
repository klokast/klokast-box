---
- name: Retire first-contact access inside a networkless Xen guest
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  tasks:
    - name: Require exact offline cleanup target and grant
      ansible.builtin.assert:
        that:
          - inventory_hostname == router_final_box ~ '-dom0'
          - router_final_operation is match('^[0-9a-f]{24}$')
          - router_final_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_final_operation

    - name: Require the activated router engine
      ansible.builtin.import_role:
        name: router-update-recovery

    - name: Bind finalization to the activated engine
      ansible.builtin.assert:
        that: [router_final_run_grant.engine_commit == router_recovery_commit.stdout]

    - name: Stage the fresh offline cleanup grant
      ansible.builtin.copy:
        content: '{{ router_final_run_grant | to_json }}'
        dest: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_final_operation }}/finalization/run-grant.json'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Create the exact bounded finalizer async directory
      ansible.builtin.file:
        path: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_final_operation }}/finalization/async'
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Finalize one stopped router without network or package downloads
      ansible.builtin.command:
        argv:
          - '/mnt/dom0_data/klokast-router-updates/operations/{{ router_final_operation }}/finalization/router-initial-finalize-dom0'
          - --box
          - '{{ router_final_box }}'
          - --operation-id
          - '{{ router_final_operation }}'
          - --engine
          - '{{ router_final_run_grant.engine_commit }}'
          - --finalize
      async: 900
      poll: 15
      vars:
        ansible_async_dir: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_final_operation }}/finalization/async'
      changed_when: true

    - name: Fetch the complete offline finalization receipt
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_final_operation }}/finalization/complete.json'
        dest: '{{ router_final_result_dir }}/initial-finalization-complete.json'
        flat: true

    - name: Fetch the private offline package and state evidence
      ansible.builtin.fetch:
        src: '/mnt/dom0_data/klokast-router-updates/operations/{{ router_final_operation }}/finalization/result.json'
        dest: '{{ router_final_result_dir }}/initial-finalization-result.json'
        flat: true
