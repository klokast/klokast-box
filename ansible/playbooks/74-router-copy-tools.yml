---
- name: Bound temporary dom0 tools for synthetic router copying
  hosts: dom0
  gather_facts: false
  become: true
  become_method: doas
  any_errors_fatal: true
  vars:
    dom0_tool_profile: router-copy
    dom0_tool_action: "{{ router_copy_tool_action }}"
    dom0_tool_box: "{{ router_copy_tool_box }}"
    dom0_tool_operation: "{{ router_copy_test_operation }}"
  tasks:
    - name: Run the closed router copy-tool transaction
      ansible.builtin.import_role:
        name: dom0-apk-policy
        tasks_from: temporary-tools.yml
