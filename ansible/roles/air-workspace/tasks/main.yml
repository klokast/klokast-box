---
- name: Set the native runner MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    content: "Did you ever tried to take that test yourself? Deckard?\n"
    owner: root
    group: root
    mode: '0644'

- name: Create protected runner maintenance storage
  ansible.builtin.file:
    path: /var/lib/klokast/air
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the workspace connection lock without replacing its inode
  ansible.builtin.copy:
    dest: /var/lib/klokast/air/workspace.lock
    content: ''
    owner: root
    group: root
    mode: '0644'
    force: false

- name: Install the versioned native runner workspace helper
  tags: [air-workspace-helpers]
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/air_workspace.py'
    dest: /usr/local/bin/klokast-air-workspace
    owner: root
    group: root
    mode: '0755'

- name: Install initial runner shell defaults without replacing user settings
  ansible.builtin.copy:
    dest: /home/agent/.bashrc
    content: |
      # Interactive native runner shell. User changes are retained.
      case $- in *i*) ;; *) return ;; esac
      export PATH="$HOME/.local/bin:$PATH"
      export EDITOR=vi
    owner: agent
    group: agent
    mode: '0644'
    force: false

- name: Install shared runner shell behavior while preserving user settings
  ansible.builtin.blockinfile:
    path: /home/agent/.bashrc
    create: true
    owner: agent
    group: agent
    mode: '0644'
    marker: '# {mark} klokast air workspace'
    block: |
      export EDITOR=vim
      export VISUAL=vim
      export GIT_EDITOR=vim
      export IGNOREEOF=999

      if command -v tmux >/dev/null 2>&1 &&
         [ -z "${TMUX:-}" ] &&
         [ -n "${PS1:-}" ] &&
         [ -t 0 ] &&
         [ -t 1 ]; then
          if /usr/local/bin/klokast-air-workspace open --reconnect; then
              exit
          fi
          printf '%s\n' 'air workspace: automatic attach failed; this recovery shell remains open.' >&2
      fi

- name: Source initial interactive shell defaults from new login shells
  ansible.builtin.copy:
    dest: /home/agent/.bash_profile
    content: |
      # User changes are retained.
      if [ -f "$HOME/.profile" ]; then . "$HOME/.profile"; fi
      if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
    owner: agent
    group: agent
    mode: '0644'
    force: false

- name: Create runner handoff helper directory
  ansible.builtin.file:
    path: /usr/local/lib/klokast-air
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the qualified selected-discussion adapter
  tags: [air-workspace-helpers]
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/{{ item }}'
    dest: '/usr/local/lib/klokast-air/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - codex_handoff.py
    - codex_discussion.py
    - codex_storage_v0163.json
    - platform_proxy.py
    - codex_live.py
    - codex_workspace.py
    - air_workspace.py

- name: Install the bounded handoff entrypoint
  ansible.builtin.copy:
    dest: /usr/local/bin/klokast-codex-handoff
    content: |
      #!/bin/sh
      exec /usr/bin/python3 /usr/local/lib/klokast-air/codex_handoff.py "$@"
    owner: root
    group: root
    mode: '0755'

- name: Install initial tmux defaults without replacing user settings
  ansible.builtin.copy:
    dest: /home/agent/.tmux.conf
    content: |
      # One shared workspace; clients use tmux's normal prefix and commands.
      set -g default-shell /bin/bash
      set -g history-limit 50000
      set -g mouse on
      set -g default-terminal screen-256color
    owner: agent
    group: agent
    mode: '0644'
    force: false

- name: Apply shared runner tmux defaults while preserving user settings
  ansible.builtin.blockinfile:
    path: /home/agent/.tmux.conf
    create: true
    owner: agent
    group: agent
    mode: '0644'
    marker: '# {mark} klokast air workspace'
    block: |
      set -g history-limit 100000
      set -gw mode-keys vi
      set -s set-clipboard on
