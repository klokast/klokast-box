---
- name: Set the native runner MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    content: "Did you ever take that test yourself, Deckard?\n"
    owner: root
    group: root
    mode: '0644'

- name: Create protected runner maintenance storage
  ansible.builtin.file:
    path: /var/lib/klokast/air
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the workspace connection lock without replacing its inode
  ansible.builtin.copy:
    dest: /var/lib/klokast/air/workspace.lock
    content: ''
    owner: root
    group: root
    mode: '0644'
    force: false

- name: Install the versioned native runner workspace helper
  tags: [air-workspace-helpers]
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/air_workspace.py'
    dest: /usr/local/bin/klokast-air-workspace
    owner: root
    group: root
    mode: '0755'

- name: Install initial runner shell defaults without replacing user settings
  ansible.builtin.copy:
    dest: /home/agent/.bashrc
    content: |
      # Interactive native runner shell. User changes are retained.
      case $- in *i*) ;; *) return ;; esac
      export PATH="$HOME/.local/bin:$PATH"
      export EDITOR=vi
    owner: agent
    group: agent
    mode: '0644'
    force: false

# A migrated /home keeps this block. It set Vim and bypassed the workspace helper.
- name: Remove the legacy container shell block from a migrated home
  ansible.builtin.blockinfile:
    path: /home/agent/.bashrc
    marker: '# {mark} klokast airunner interactive shell'
    state: absent

- name: Install shared runner shell behavior while preserving user settings
  ansible.builtin.blockinfile:
    path: /home/agent/.bashrc
    create: true
    owner: agent
    group: agent
    mode: '0644'
    marker: '# {mark} klokast air workspace'
    block: |
      export EDITOR=vi
      export VISUAL=vi
      export GIT_EDITOR=vi
      export IGNOREEOF=999

      if command -v tmux >/dev/null 2>&1 &&
         [ -z "${TMUX:-}" ] &&
         [ -n "${PS1:-}" ] &&
         [ -t 0 ] &&
         [ -t 1 ]; then
          if /usr/local/bin/klokast-air-workspace open --reconnect; then
              exit
          fi
          printf '%s\n' 'air workspace: automatic attach failed; this recovery shell remains open.' >&2
      fi

- name: Source initial interactive shell defaults from new login shells
  ansible.builtin.copy:
    dest: /home/agent/.bash_profile
    content: |
      # User changes are retained.
      if [ -f "$HOME/.profile" ]; then . "$HOME/.profile"; fi
      if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
    owner: agent
    group: agent
    mode: '0644'
    force: false

- name: Create runner handoff helper directory
  ansible.builtin.file:
    path: /usr/local/lib/klokast-air
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the qualified selected-discussion adapter
  tags: [air-workspace-helpers]
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/{{ item }}'
    dest: '/usr/local/lib/klokast-air/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - codex_handoff.py
    - codex_discussion.py
    - codex_storage_v0163.json
    - platform_proxy.py
    - codex_live.py
    - codex_workspace.py
    - air_image_workspace.py
    - air_workspace.py

- name: Install the bounded handoff entrypoint
  ansible.builtin.copy:
    dest: /usr/local/bin/klokast-codex-handoff
    content: |
      #!/bin/sh
      exec /usr/bin/python3 /usr/local/lib/klokast-air/codex_handoff.py "$@"
    owner: root
    group: root
    mode: '0755'

- name: Install initial tmux defaults without replacing user settings
  ansible.builtin.copy:
    dest: /home/agent/.tmux.conf
    content: |
      # One shared workspace; clients use tmux's normal prefix and commands.
      set -g default-shell /bin/bash
      set -g history-limit 50000
      set -g mouse on
      set -g default-terminal screen-256color
    owner: agent
    group: agent
    mode: '0644'
    force: false

- name: Apply shared runner tmux defaults while preserving user settings
  ansible.builtin.blockinfile:
    path: /home/agent/.tmux.conf
    create: true
    owner: agent
    group: agent
    mode: '0644'
    marker: '# {mark} klokast air workspace'
    block: |
      set -g history-limit 100000
      set -gw mode-keys vi
      set -s set-clipboard on

- name: Install the AIR image update client
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/air-update'
    dest: /usr/local/bin/air-update
    owner: root
    group: root
    mode: '0755'

# Image replacement keeps contacts in /home but not this root file.
- name: Install the standard library controller resolver for air-update
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/ops-controller-ha'
    dest: /usr/local/bin/ops-controller-ha
    owner: root
    group: root
    mode: '0755'

- name: Create the managed Codex configuration directory
  ansible.builtin.file:
    path: /etc/codex
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Select image-managed Codex update checks
  ansible.builtin.lineinfile:
    path: /etc/codex/requirements.toml
    regexp: '^check_for_update_on_startup\s*='
    line: 'check_for_update_on_startup = false'
    insertbefore: BOF
    create: true
    owner: root
    group: root
    mode: '0644'

- name: Create the managed Claude Code configuration directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    owner: root
    group: root
    mode: '0755'

# Development permits direct controller use by the runner agent. The verified
# Instance names the controllers; platform-source refuses outside development.
- name: Read verified Instance controller placement for runner permissions
  ansible.builtin.command: /usr/local/sbin/platform-source controllers
  delegate_to: localhost
  become: false
  run_once: true
  register: air_workspace_controllers
  changed_when: false
  check_mode: false

- name: Require controller hostnames that are safe in permission rules
  ansible.builtin.assert:
    that:
      - (air_workspace_controllers.stdout | from_json).controllers | length > 0
      - (air_workspace_controllers.stdout | from_json).controllers.values() | map(attribute='hostname')
        | reject('match', '^[a-z][a-z0-9-]{0,30}-ops$') | list | length == 0
    fail_msg: platform-source returned no controller or an unsupported controller hostname
  run_once: true

# The image selects Claude Code. Alpine's musl build uses the image ripgrep.
# The classic renderer keeps answers in tmux history for copy-mode scrolling.
- name: Select image-managed Claude Code updates, search tool, renderer and controller access
  ansible.builtin.copy:
    dest: /etc/claude-code/managed-settings.json
    content: >-
      {{ {'env': {'CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN': '1',
                  'DISABLE_AUTOUPDATER': '1',
                  'USE_BUILTIN_RIPGREP': '0'},
          'permissions': {'allow': (air_workspace_controllers.stdout | from_json).controllers.values()
                                   | map(attribute='hostname') | sort
                                   | map('regex_replace', '^', 'Bash(tailscale ssh smith@')
                                   | map('regex_replace', '$', ':*)') | list}}
         | to_nice_json }}
    owner: root
    group: root
    mode: '0644'
