---
- name: Set the native runner MOTD
  ansible.builtin.copy:
    dest: /etc/motd
    content: "Did you ever take that test yourself, Deckard?\n"
    owner: root
    group: root
    mode: '0644'

- name: Create protected runner maintenance storage
  ansible.builtin.file:
    path: /var/lib/klokast/air
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the workspace connection lock without replacing its inode
  ansible.builtin.copy:
    dest: /var/lib/klokast/air/workspace.lock
    content: ''
    owner: root
    group: root
    mode: '0644'
    force: false

- name: Install the versioned native runner workspace helper
  tags: [air-workspace-helpers]
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/air_workspace.py'
    dest: /usr/local/bin/klokast-air-workspace
    owner: root
    group: root
    mode: '0755'

# The image and this role own the shell, tmux and Git behavior of the runner.
# These root-owned files are rebuilt with each AIR image; the retained home holds
# no startup file (see vm_infrastructure_storage.py AIR_HOME).
- name: Install the runner interactive shell behavior
  ansible.builtin.copy:
    dest: /etc/bash/klokast-air.sh
    content: |
      # Sourced by /etc/bash/bashrc for each interactive bash, also a login shell.
      export EDITOR=vi
      export VISUAL=vi
      export GIT_EDITOR=vi
      export IGNOREEOF=999

      if command -v tmux >/dev/null 2>&1 &&
         [ -z "${TMUX:-}" ] &&
         [ -n "${PS1:-}" ] &&
         [ -t 0 ] &&
         [ -t 1 ]; then
          if /usr/local/bin/klokast-air-workspace open --reconnect; then
              exit
          fi
          cd /home/agent/src/klokast/klokast-box 2>/dev/null || :
          printf '%s\n' 'air workspace: this is a plain shell without tmux.' >&2
      fi
    owner: root
    group: root
    mode: '0644'

- name: Install the runner tmux settings
  ansible.builtin.copy:
    dest: /etc/tmux.conf
    content: |
      # One shared workspace; clients use tmux's normal prefix and commands.
      set -g default-shell /bin/bash
      set -g history-limit 100000
      set -g mouse on
      set -g default-terminal screen-256color
      set -gw mode-keys vi
      set -s set-clipboard on
    owner: root
    group: root
    mode: '0644'

- name: Install the runner Git author
  ansible.builtin.copy:
    dest: /etc/gitconfig
    content: |
      [user]
          name = Klokast Agent
          email = agent@{{ node_hostname }}
    owner: root
    group: root
    mode: '0644'

# Each boot also removes them; this makes a converged runner match at once.
- name: Remove the home startup files that this role and the retired container role installed
  ansible.builtin.file:
    path: '/home/agent/{{ item }}'
    state: absent
  loop:
    - .bashrc
    - .bash_profile
    - .profile
    - .tmux.conf
    - .gitconfig

- name: Create the runner workspace helper directory
  ansible.builtin.file:
    path: /usr/local/lib/klokast-air
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the runner workspace checkpoint modules
  tags: [air-workspace-helpers]
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/{{ item }}'
    dest: '/usr/local/lib/klokast-air/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - platform_proxy.py
    - codex_live.py
    - codex_workspace.py
    - air_image_workspace.py
    - air_workspace.py

# Discussions stay on their runner. Remove the handoff and workspace move
# files of older images. The native histories stay in the retained home.
- name: Remove the discussion handoff and workspace placement files
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /usr/local/bin/klokast-codex-handoff
    - /usr/local/lib/klokast-air/codex_handoff.py
    - /usr/local/lib/klokast-air/codex_discussion.py
    - /usr/local/lib/klokast-air/codex_storage_v0163.json
    - /var/lib/klokast/air/placement.json

- name: Install the AIR image update client
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/air-update'
    dest: /usr/local/bin/air-update
    owner: root
    group: root
    mode: '0755'

# The retained home keeps the contacts (AIR_HOME); image replacement removes this root file.
- name: Install the standard library controller resolver for air-update
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/ops-controller-ha'
    dest: /usr/local/bin/ops-controller-ha
    owner: root
    group: root
    mode: '0755'

- name: Create the managed Codex configuration directory
  ansible.builtin.file:
    path: /etc/codex
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Select image-managed Codex update checks
  ansible.builtin.lineinfile:
    path: /etc/codex/requirements.toml
    regexp: '^check_for_update_on_startup\s*='
    line: 'check_for_update_on_startup = false'
    insertbefore: BOF
    create: true
    owner: root
    group: root
    mode: '0644'

- name: Create the managed Claude Code configuration directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    owner: root
    group: root
    mode: '0755'

# Development permits direct controller use by the runner agent. The verified
# Instance names the controllers; platform-source refuses outside development.
- name: Read verified Instance controller placement for runner permissions
  ansible.builtin.command: /usr/local/sbin/platform-source controllers
  delegate_to: localhost
  become: false
  run_once: true
  register: air_workspace_controllers
  changed_when: false
  check_mode: false

- name: Require controller hostnames that are safe in permission rules
  ansible.builtin.assert:
    that:
      - (air_workspace_controllers.stdout | from_json).controllers | length > 0
      - (air_workspace_controllers.stdout | from_json).controllers.values() | map(attribute='hostname')
        | reject('match', '^[a-z][a-z0-9-]{0,30}-ops$') | list | length == 0
    fail_msg: platform-source returned no controller or an unsupported controller hostname
  run_once: true

# The image selects Claude Code. Alpine's musl build uses the image ripgrep.
# The classic renderer keeps answers in tmux history for copy-mode scrolling.
# Claude Code deletes its own transcripts after the Platform log retention period
# (ansible/ansible.md#log-retention).
- name: Select image-managed Claude Code updates, search tool, renderer, retention and controller access
  ansible.builtin.copy:
    dest: /etc/claude-code/managed-settings.json
    content: >-
      {{ {'cleanupPeriodDays': 14,
          'env': {'CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN': '1',
                  'DISABLE_AUTOUPDATER': '1',
                  'USE_BUILTIN_RIPGREP': '0'},
          'permissions': {'allow': (air_workspace_controllers.stdout | from_json).controllers.values()
                                   | map(attribute='hostname') | sort
                                   | map('regex_replace', '^', 'Bash(tailscale ssh smith@')
                                   | map('regex_replace', '$', ':*)') | list}}
         | to_nice_json }}
    owner: root
    group: root
    mode: '0644'
