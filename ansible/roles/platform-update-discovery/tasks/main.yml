---
- name: Verify explicit active-controller role before installing discovery
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/klokast-controller-guard
      - --status
      - --json
      - --require-active
  register: platform_update_controller
  changed_when: false

- name: Refuse unconfigured controller discovery installation
  ansible.builtin.assert:
    that:
      - (platform_update_controller.stdout | from_json).configured | bool
      - (platform_update_controller.stdout | from_json).active | bool

- name: Reserve the update state parent for root-owned execution records
  ansible.builtin.file:
    path: /var/lib/klokast/updates
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create non-authoritative controller discovery and cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: smith
    group: smith
    mode: "0700"
  loop:
    - /var/lib/klokast/updates/discovery
    - /var/lib/klokast/updates/discovery/qualifications
    - /var/lib/klokast/updates/discovery/config-audits
    - /var/cache/klokast/updates

- name: Read schedule from the verified Instance
  ansible.builtin.command:
    argv: [/usr/local/sbin/ksa-apply, vm-update-policy, schedule-source]
  register: platform_update_schedule_source
  changed_when: false
  no_log: true

- name: Require the closed Instance schedule projection
  ansible.builtin.assert:
    that:
      - (platform_update_schedule_source.stdout | from_json).kind == 'klokast.vm-update-schedule.v1'
  no_log: true

- name: Use only the verified Instance timing and activation state
  ansible.builtin.set_fact:
    platform_update_schedule: "{{ platform_update_schedule_source.stdout | from_json }}"
  no_log: true

- name: Remove the obsolete discovery and hourly verification entries
  ansible.builtin.cron:
    state: absent
    name: "{{ item }}"
    user: smith
  loop: [klokast-vm-update-discovery, klokast-vm-update-verification]

- name: Schedule daily scan, verification and preparation
  ansible.builtin.cron:
    state: "{{ 'present' if platform_update_schedule.policy and platform_update_schedule.policy.enabled else 'absent' }}"
    name: klokast-vm-update-daily
    user: smith
    minute: "{{ (platform_update_schedule.policy['check-time'] if platform_update_schedule.policy else '00:10').split(':')[1] | int }}"
    hour: "{{ (platform_update_schedule.policy['check-time'] if platform_update_schedule.policy else '00:10').split(':')[0] | int }}"
    job: >-
      /usr/bin/timeout 7200 /home/smith/src/klokast/klokast-box/ansible/bin/platform-update daily
      > /var/lib/klokast/updates/discovery/cron-daily.log 2>&1

- name: Schedule replacement only after activation and recovery qualification
  ansible.builtin.cron:
    state: "{{ 'present' if platform_update_schedule.replacement_ready else 'absent' }}"
    name: klokast-vm-update-replacement
    user: smith
    minute: "{{ (platform_update_schedule.policy['maintenance-window']['start'] if platform_update_schedule.policy else '02:00').split(':')[1] | int }}"
    hour: "{{ (platform_update_schedule.policy['maintenance-window']['start'] if platform_update_schedule.policy else '02:00').split(':')[0] | int }}"
    job: >-
      /home/smith/src/klokast/klokast-box/ansible/bin/platform-update replace
      > /var/lib/klokast/updates/discovery/cron-replace.log 2>&1

- name: Enable the controller OS cron service for Instance update intent
  ansible.builtin.service:
    name: crond
    enabled: true
    state: started
  when: platform_update_schedule.policy is not none and platform_update_schedule.policy.enabled
