---
- name: Require the active controller before changing router cron entries
  ansible.builtin.command:
    argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
  become: false
  changed_when: false
  register: router_schedule_controller

- name: Require configured active-controller authority
  ansible.builtin.assert:
    that:
      - (router_schedule_controller.stdout | from_json).active | bool
      - (router_schedule_controller.stdout | from_json).configured | bool

- name: Preserve protected update state parents
  ansible.builtin.file:
    path: /var/lib/klokast/updates
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create private router schedule evidence storage
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: smith
    group: smith
    mode: '0700'
  loop: [/var/lib/klokast/updates/discovery, /var/lib/klokast/updates/discovery/router]

- name: Verify current authority before converging router cron entries
  block:
    - name: Read signed timing and native forward and rollback proof as the controller operator
      ansible.builtin.command:
        argv: ['{{ playbook_dir }}/../bin/platform-router-update', schedule-status]
      become: false
      changed_when: false
      register: router_schedule_result

    - name: Require the router-specific scheduling decision
      ansible.builtin.assert:
        that:
          - (router_schedule_result.stdout | from_json).kind == 'klokast.router-schedule-status.v1'
          - (router_schedule_result.stdout | from_json).ready is boolean

    - name: Select only the verified router scheduling decision
      ansible.builtin.set_fact:
        router_schedule_verified: '{{ router_schedule_result.stdout | from_json }}'

  rescue:
    - name: Remove exact router cron entries after verification failure
      ansible.builtin.cron:
        state: absent
        user: smith
        name: '{{ item }}'
      loop: [klokast-router-update-prepare, klokast-router-update-cutover]
    - name: Report disabled scheduling after failed authority verification
      ansible.builtin.fail:
        msg: Router scheduling verification failed. The two router cron entries are absent. Inspect the failed source or native proof check.

- name: Install preparation at the Instance check time after native qualification
  ansible.builtin.cron:
    state: "{{ 'present' if router_schedule_verified.ready else 'absent' }}"
    name: klokast-router-update-prepare
    user: smith
    minute: '{{ (router_schedule_verified.check_time or "00:10").split(":")[1] | int }}'
    hour: '{{ (router_schedule_verified.check_time or "00:10").split(":")[0] | int }}'
    job: >-
      umask 077; /usr/bin/timeout 21600 /home/smith/src/klokast/klokast-box/ansible/bin/platform-router-update scheduled --phase prepare
      > /var/lib/klokast/updates/discovery/router/cron-prepare.log 2>&1

- name: Install cutover at the Instance window start after native qualification
  ansible.builtin.cron:
    state: "{{ 'present' if router_schedule_verified.ready else 'absent' }}"
    name: klokast-router-update-cutover
    user: smith
    minute: '{{ (router_schedule_verified.cutover_time or "02:00").split(":")[1] | int }}'
    hour: '{{ (router_schedule_verified.cutover_time or "02:00").split(":")[0] | int }}'
    job: >-
      umask 077; /home/smith/src/klokast/klokast-box/ansible/bin/platform-router-update scheduled --phase cutover
      > /var/lib/klokast/updates/discovery/router/cron-cutover.log 2>&1

- name: Enable the existing controller cron service for a qualified router schedule
  ansible.builtin.service:
    name: crond
    enabled: true
    state: started
  when: router_schedule_verified.ready
