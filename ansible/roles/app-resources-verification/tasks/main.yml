---
- name: Inspect the installed app-resource reconcile helper
  ansible.builtin.stat:
    path: /usr/local/libexec/klokast-app-resources-reconcile
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  become: true
  changed_when: false
  register: app_resources_verify_helper

- name: Refuse app-resource verification with a missing or changed helper
  ansible.builtin.assert:
    that:
      - app_resources_verify_helper.stat.isreg | default(false)
      - not (app_resources_verify_helper.stat.islnk | default(false))
      - app_resources_verify_helper.stat.uid | default(-1) == 0
      - app_resources_verify_helper.stat.gid | default(-1) == 0
      - app_resources_verify_helper.stat.mode | default('') == '0755'
      - >-
        (app_resources_verify_helper.stat.checksum | default('')) ==
        (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/app-resources/files/reconcile-app-resources.py', rstrip=False) | hash('sha256'))
    fail_msg: The installed app-resource helper differs from approved source. Apply Platform resources before verification.

- name: Verify app-resource rules with a temporary desired ledger
  when: node_domain_role in ['router', 'backend', 'dmz', 'iot', 'usr']
  block:
    - name: Allocate a volatile desired ledger path for verification
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: klokast-platform-resources-
        suffix: .json
      become: true
      register: app_resources_verify_desired_file
      changed_when: false

    - name: Stage desired platform-resource ledger for verification
      ansible.builtin.copy:
        dest: "{{ app_resources_verify_desired_file.path }}"
        content: "{{ platform_resources_desired_json }}\n"
        owner: root
        group: root
        mode: "0600"
      become: true
      changed_when: false

    - name: Verify keyed app-resource snippets and live nftables state
      ansible.builtin.command:
        argv: >-
          {{
            [
              '/usr/bin/python3',
              '/usr/local/libexec/klokast-app-resources-reconcile',
              'verify',
              '--desired',
              app_resources_verify_desired_file.path,
              '--node-name',
              node_name,
              '--node-role',
              node_domain_role
            ]
            + (
              platform_resources_apply_scope_apps
              | default([])
              | map('regex_replace', '^', '--scope-app=')
              | list
            )
          }}
      become: true
      changed_when: false
  always:
    - name: Remove the volatile app-resource verification ledger
      ansible.builtin.file:
        path: "{{ app_resources_verify_desired_file.path }}"
        state: absent
      become: true
      changed_when: false
      when: app_resources_verify_desired_file.path is defined
