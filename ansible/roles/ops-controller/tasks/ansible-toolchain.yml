---
- name: Read current community.general release metadata
  environment: '{{ platform_download_environment | default({}) }}'
  ansible.builtin.command:
    argv: [curl, --fail, --silent, --show-error, --location, --proto, '=https', --proto-redir, '=https', --connect-timeout, '10', --max-time, '60', 'https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/community/general/']
  register: ops_collection_index
  changed_when: false

- name: Select the latest stable collection version
  ansible.builtin.set_fact:
    ops_collection_version: '{{ (ops_collection_index.stdout | from_json).highest_version.version }}'

- name: Require a stable collection version
  ansible.builtin.assert:
    that: ["ops_collection_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')"]

- name: Read the selected collection artifact identity
  environment: '{{ platform_download_environment | default({}) }}'
  ansible.builtin.command:
    argv: [curl, --fail, --silent, --show-error, --location, --proto, '=https', --proto-redir, '=https', --connect-timeout, '10', --max-time, '60', 'https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/community/general/versions/{{ ops_collection_version }}/']
  register: ops_collection_release_response
  changed_when: false

- name: Decode the selected collection artifact identity
  ansible.builtin.set_fact:
    ops_collection_release: '{{ ops_collection_release_response.stdout | from_json }}'

- name: Validate the published collection checksum and filename
  ansible.builtin.assert:
    that:
      - ops_collection_release.artifact.filename == 'community-general-' ~ ops_collection_version ~ '.tar.gz'
      - ops_collection_release.artifact.sha256 is match('^[0-9a-f]{64}$')

- name: Create protected controller collection and archive directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '/usr/local/share/klokast/ansible/{{ ops_collection_version }}'
    - /var/cache/klokast/ansible

- name: Fetch the checksum-verified current collection archive
  ansible.builtin.import_tasks: public-tool-download.yml
  vars:
    ops_public_tool_url: 'https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/artifacts/{{ ops_collection_release.artifact.filename }}'
    ops_public_tool_path: '/var/cache/klokast/ansible/{{ ops_collection_release.artifact.filename }}'
    ops_public_tool_sha256: '{{ ops_collection_release.artifact.sha256 }}'

- name: Install only the resolved archive without resolving dependencies
  environment: '{{ platform_download_environment | default({}) }}'
  ansible.builtin.command:
    argv:
      - /usr/bin/ansible-galaxy
      - collection
      - install
      - '/var/cache/klokast/ansible/{{ ops_collection_release.artifact.filename }}'
      - --no-deps
      - --collections-path
      - '/usr/local/share/klokast/ansible/{{ ops_collection_version }}'
    creates: '/usr/local/share/klokast/ansible/{{ ops_collection_version }}/ansible_collections/community/general/MANIFEST.json'

- name: Make the public collection readable without allowing controller writes
  ansible.builtin.file:
    path: '/usr/local/share/klokast/ansible/{{ ops_collection_version }}'
    state: directory
    owner: root
    group: root
    mode: u=rwX,go=rX
    recurse: true

- name: Compare the installed manifest with the verified upstream archive
  environment: '{{ platform_download_environment | default({}) }}'
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import pathlib, sys, tarfile
        with tarfile.open(sys.argv[1]) as archive:
            expected = archive.extractfile('MANIFEST.json').read()
        if pathlib.Path(sys.argv[2]).read_bytes() != expected:
            raise SystemExit('Installed collection manifest differs from the verified archive')
      - '/var/cache/klokast/ansible/{{ ops_collection_release.artifact.filename }}'
      - '/usr/local/share/klokast/ansible/{{ ops_collection_version }}/ansible_collections/community/general/MANIFEST.json'
  changed_when: false

- name: Verify installed collection files offline against the resolved manifest
  environment: '{{ platform_download_environment | default({}) }}'
  ansible.builtin.command:
    argv:
      - /usr/bin/ansible-galaxy
      - collection
      - verify
      - 'community.general:{{ ops_collection_version }}'
      - --offline
      - --collections-path
      - '/usr/local/share/klokast/ansible/{{ ops_collection_version }}'
  changed_when: false

- name: Require the installed doas pipelining option before activation
  ansible.builtin.command:
    argv: [ansible-doc, -t, become, community.general.doas, --json]
  environment:
    ANSIBLE_COLLECTIONS_PATH: '/usr/local/share/klokast/ansible/{{ ops_collection_version }}'
  register: ops_collection_doas
  changed_when: false
  failed_when: ops_collection_doas.rc != 0 or 'allow_pipelining' not in ops_collection_doas.stdout

- name: Select the verified current controller collection
  ansible.builtin.file:
    src: '/usr/local/share/klokast/ansible/{{ ops_collection_version }}'
    dest: /usr/local/share/klokast/ansible/current
    state: link
    owner: root
    group: root
