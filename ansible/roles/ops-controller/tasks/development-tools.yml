---
- name: Check the controller role, source checkout, and development property
  ansible.builtin.import_tasks: development-preflight.yml

- name: Create controller tool and state directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.owner }}'
    mode: '{{ item.mode }}'
  loop:
    - {path: /etc/klokast, owner: root, mode: '0755'}
    - {path: /usr/local/lib/klokast, owner: root, mode: '0755'}
    - {path: /usr/local/share/klokast/tailscale, owner: root, mode: '0755'}
    - {path: /usr/local/lib/klokast/app_support, owner: root, mode: '0755'}
    - {path: /var/lib/klokast/apply, owner: smith, mode: '0700'}
    - {path: /var/lib/klokast/platform-map, owner: smith, mode: '0700'}
    - {path: /var/log/klokast, owner: root, mode: '0755'}
    - {path: /var/lib/klokast/network, owner: root, mode: '0755'}
    - {path: /var/lib/klokast/network/overlay-ipv6-router, owner: smith, mode: '0700'}
    - {path: /var/lib/klokast/network/overlay-ipv6-ops, owner: smith, mode: '0700'}
    - {path: /var/lib/klokast/updates/recovery, owner: smith, mode: '0700'}
    - {path: /run/klokast, owner: smith, mode: '0700'}
    - {path: /var/lib/klokast/updates, owner: root, mode: '0755'}
    - {path: /var/lib/klokast/updates/executor, owner: root, mode: '0700'}
    - {path: /var/lib/klokast/updates/discovery, owner: smith, mode: '0700'}
    - {path: /var/lib/klokast/updates/discovery/builds, owner: smith, mode: '0700'}
    - {path: /var/cache/klokast/updates, owner: smith, mode: '0700'}

- name: Create the root-only Apply helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/klokast
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install root-owned Secret Authority wrapper executables
  ansible.builtin.copy:
    src: '{{ ops_controller_secret_authority_wrapper_source_root }}/{{ item }}'
    dest: '/usr/local/sbin/{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop: '{{ ops_controller_secret_authority_wrappers }}'

- name: Install the root-only Tailnet policy mutation helper
  ansible.builtin.copy:
    src: '{{ ops_controller_apply_mutation_helper_source }}'
    dest: /usr/local/libexec/klokast/ts-policy-mutate-internal
    owner: root
    group: root
    mode: '0700'

- name: Install the checked Tailnet policy renderer
  ansible.builtin.copy:
    src: '{{ ops_controller_apply_renderer_source }}'
    dest: /usr/local/sbin/render-tailscale-policy
    owner: root
    group: root
    mode: '0755'

- name: Check the resource compiler modules in the controller checkout
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -B
      - -c
      - >-
        import sys;
        sys.path.insert(0, '/home/smith/src/klokast/klokast-box/ansible/lib');
        import platform_resource_model, platform_resource_guests,
        platform_resource_compiler, platform_resource_runtime
  changed_when: false

- name: Install the checked Platform resource compiler
  ansible.builtin.copy:
    src: '{{ ops_controller_apply_platform_resources_source }}'
    dest: /usr/local/sbin/platform-resources
    owner: root
    group: root
    mode: '0755'

- name: Install the checked overlay IPv6 network helpers
  ansible.builtin.copy:
    src: '{{ item.source }}'
    dest: '{{ item.destination }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - source: '{{ ops_controller_apply_router_network_helper_source }}'
      destination: /usr/local/sbin/overlay-ipv6-router
    - source: '{{ ops_controller_apply_ops_network_helper_source }}'
      destination: /usr/local/sbin/overlay-ipv6-ops

- name: Install the controller authority guard
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../roles/ops-controller/files/klokast-controller-guard'
    dest: /usr/local/sbin/klokast-controller-guard
    owner: root
    group: root
    mode: '0755'

- name: Set the development deployment property once
  ansible.builtin.copy:
    dest: /etc/klokast/deployment.json
    content: '{"schema_version":1,"lifecycle":"development"}'
    force: false
    owner: root
    group: root
    mode: '0644'

- name: Install controller source and maintenance modules
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/local/lib/klokast/{{ item | basename }}'
    owner: root
    group: root
    mode: '0644'
  with_fileglob: '{{ playbook_dir }}/../lib/*.py'

- name: Install shared application support modules
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/local/lib/klokast/app_support/{{ item | basename }}'
    owner: root
    group: root
    mode: '0644'
  with_fileglob: '{{ playbook_dir }}/../lib/app_support/*.py'

- name: Install the application Tailscale SSH transport adapter
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/platform-tailscale-ssh'
    dest: /usr/local/bin/platform-tailscale-ssh
    owner: root
    group: root
    mode: '0755'

- name: Install the shared application Ansible invocation command
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/platform-ansible'
    dest: /usr/local/bin/platform-ansible
    owner: root
    group: root
    mode: '0755'

- name: Install development controller entry points
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../bin/{{ item }}'
    dest: '/usr/local/sbin/{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop: [platform-source, platform-maintenance, platform-inventory, platform-registry]

- name: Create a stable installation lock
  ansible.builtin.copy:
    dest: /var/lib/klokast/updates/operation.lock
    content: ''
    force: false
    owner: root
    group: smith
    mode: '0660'

- name: Build the mutable development CLI with vendored dependencies
  ansible.builtin.command:
    argv: [/usr/local/bin/go, build, -mod=vendor, -trimpath, -o, /home/smith/private/klokast/klokast-development, ./cmd/klokast]
    chdir: /home/smith/src/klokast/klokast-box
  environment:
    GOTOOLCHAIN: local
    GOPROXY: 'off'
    GOSUMDB: 'off'
  become: true
  become_user: smith
  changed_when: true

- name: Install the development CLI
  ansible.builtin.copy:
    src: /home/smith/private/klokast/klokast-development
    dest: /usr/local/bin/klokast
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Install the current VM enrollment validator
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../../klokast-ops/tailscale/bin/ts-authkey-mint'
    dest: /usr/local/sbin/ts-authkey-mint
    owner: root
    group: root
    mode: '0755'
    validate: /bin/bash -n %s

- name: Install the current Platform Tailnet policy template
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../../klokast-ops/tailscale/policy.hujson.j2'
    dest: /usr/local/share/klokast/tailscale/policy.hujson.j2
    owner: root
    group: root
    mode: '0644'
