---
- name: Create private bounded nightly result storage
  ansible.builtin.file:
    path: /var/lib/klokast/ops-nightly
    state: directory
    owner: smith
    group: smith
    mode: '0700'
  tags: ops-nightly-tools
- name: Install the controller nightly entrypoint
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      set -eu
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      cd /home/smith/src/klokast/klokast-box
      exec ansible/bin/ops-controller-nightly "$@"
    dest: /usr/local/sbin/ops-controller-nightly
    owner: root
    group: root
    mode: '0755'
  tags: ops-nightly-tools
- name: Select the qualified service roles for nightly updates
  ansible.builtin.set_fact:
    ops_controller_nightly_selected_roles: "{{ ops_controller_nightly_service_roles | default([] if ops_controller_nightly_services | default(false) | bool else ['vpn-egress', 'dmz', 'bak', 'router']) }}"
- name: Require valid and exclusive nightly service selection
  ansible.builtin.assert:
    that:
      - ops_controller_nightly_selected_roles is sequence
      - ops_controller_nightly_selected_roles is not string
      - ops_controller_nightly_selected_roles is not mapping
      - ops_controller_nightly_selected_roles | difference(['bak', 'dmz', 'iot', 'vpn-egress', 'router']) | length == 0
      - not (ops_controller_nightly_services | default(false) | bool and ops_controller_nightly_selected_roles | length > 0)
    fail_msg: Use supported service roles, or all-services selection with an empty role list.
- name: Run standby and selected service image updates at 03:00 UTC
  ansible.builtin.cron:
    name: klokast-ops-controller-nightly
    user: smith
    minute: '0'
    hour: '3'
    disabled: '{{ not (ops_controller_nightly_enabled | default(true) | bool) }}'
    job: >-
      /usr/bin/timeout 43200 /usr/local/sbin/ops-controller-nightly {{ '--services' if ops_controller_nightly_services | default(false) | bool else ops_controller_nightly_selected_roles | map('regex_replace', '^', '--service-role ') | join(' ') }} >/dev/null 2>&1
    state: present
- name: Keep the existing cron service enabled
  ansible.builtin.service:
    name: crond
    state: started
    enabled: true
