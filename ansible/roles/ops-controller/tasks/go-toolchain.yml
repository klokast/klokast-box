---
- name: Create the controller tool download cache
  ansible.builtin.file:
    path: /var/cache/klokast
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the pinned Go toolchain directory
  ansible.builtin.file:
    path: /usr/local/share/klokast/toolchains/go1.26.6
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the checksum-pinned official Go toolchain
  ansible.builtin.get_url:
    url: https://go.dev/dl/go1.26.6.linux-amd64.tar.gz
    dest: /var/cache/klokast/go1.26.6.linux-amd64.tar.gz
    checksum: sha256:708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89
    owner: root
    group: root
    mode: '0644'

- name: Expand the pinned Go toolchain
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'set -e; /bin/tar -xzf "$1" -C "$2"; /bin/touch "$2/.extracted"'
      - sh
      - /var/cache/klokast/go1.26.6.linux-amd64.tar.gz
      - /usr/local/share/klokast/toolchains/go1.26.6
    creates: /usr/local/share/klokast/toolchains/go1.26.6/.extracted

- name: Publish the Go compiler command
  ansible.builtin.file:
    src: /usr/local/share/klokast/toolchains/go1.26.6/go/bin/go
    dest: /usr/local/bin/go
    state: link
    owner: root
    group: root

- name: Verify the pinned Go compiler version
  ansible.builtin.command:
    argv: [/usr/local/bin/go, version]
  register: ops_controller_go_version
  changed_when: false
  failed_when: ops_controller_go_version.rc != 0 or 'go1.26.6 linux/amd64' not in ops_controller_go_version.stdout

