---
- name: Assert Cloudflare guardian inputs are defined
  ansible.builtin.assert:
    that:
      - cloudflare_guardian_name | default('') | length > 0
      - cloudflare_guardian_config_root | default('') is match('^/')
      - cloudflare_guardian_state_root | default('') is match('^/')
      - cloudflare_guardian_audit_log | default('') is match('^/')
      - cloudflare_guardian_static_site_box | default('') | length > 0
      - cloudflare_guardian_static_site_domain | default('') | length > 0
      - cloudflare_guardian_cloudflare_account_id | default('') | length > 0
      - cloudflare_guardian_cloudflare_zone_id | default('') | length > 0
      - cloudflare_guardian_static_site_tunnel_name | default('') | length > 0
      - cloudflare_guardian_static_site_service_url | default('') | length > 0
    fail_msg: Cloudflare guardian variables are incomplete.

- name: Ensure Cloudflare guardian packages are installed
  community.general.apk:
    name: "{{ cloudflare_guardian_packages }}"
    state: present
  become: true

- name: Ensure Cloudflare guardian directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  become: true
  loop:
    - path: /usr/local/sbin
      mode: "0755"
    - path: "{{ cloudflare_guardian_config_root }}"
      mode: "0700"
    - path: "{{ cloudflare_guardian_state_root }}"
      mode: "0700"
    - path: "{{ cloudflare_guardian_audit_log | dirname }}"
      mode: "0750"

- name: Install Cloudflare guardian executable
  ansible.builtin.copy:
    src: "{{ cloudflare_guardian_source }}"
    dest: /usr/local/sbin/cloudflare-guardian
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install Cloudflare guardian policy
  ansible.builtin.copy:
    dest: "{{ cloudflare_guardian_config_root }}/policy.json"
    owner: root
    group: root
    mode: "0600"
    content: "{{ cloudflare_guardian_policy | to_nice_json }}\n"
  become: true

- name: Install Cloudflare guardian allowed signers when provided
  ansible.builtin.copy:
    dest: "{{ cloudflare_guardian_config_root }}/allowed-signers"
    owner: root
    group: root
    mode: "0600"
    content: |
      {% for signer in cloudflare_guardian_allowed_signers %}
      {{ signer }}
      {% endfor %}
  become: true
  when: cloudflare_guardian_allowed_signers | default([]) | length > 0

- name: Install failing Cloudflare guardian unseal placeholder when missing
  ansible.builtin.copy:
    dest: "{{ cloudflare_guardian_config_root }}/unseal-cloudflare-authority"
    owner: root
    group: root
    mode: "0700"
    force: false
    content: |
      #!/bin/sh
      set -eu
      echo "Cloudflare authority unseal command is not configured" >&2
      exit 2
  become: true

- name: Check Cloudflare guardian status
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/cloudflare-guardian
      - --guardian
      - "{{ cloudflare_guardian_name }}"
      - status
      - --redacted
  become: true
  register: cloudflare_guardian_status
  changed_when: false

- name: Show redacted Cloudflare guardian status
  ansible.builtin.debug:
    msg: "{{ cloudflare_guardian_status.stdout | from_json }}"
