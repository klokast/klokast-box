---
cloudflare_guardian_name: "{{ node_name }}-dom0"
cloudflare_guardian_config_root: /etc/klokast/cloudflare-guardian
cloudflare_guardian_state_root: /var/lib/klokast/cloudflare-guardian
cloudflare_guardian_audit_log: /var/log/klokast/cloudflare-guardian.jsonl
cloudflare_guardian_source: "{{ playbook_dir }}/../../klokast-ops/cloudflare-guardian/bin/cloudflare-guardian"
cloudflare_guardian_packages:
  - openssh-client-default
  - python3

cloudflare_guardian_static_site_box: k001
cloudflare_guardian_static_site_domain: www.klokast.ai
cloudflare_guardian_cloudflare_account_id: ""
cloudflare_guardian_cloudflare_zone_id: ""
cloudflare_guardian_static_site_tunnel_name: "klokast-static-{{ cloudflare_guardian_static_site_box }}"
cloudflare_guardian_static_site_service_url: http://127.0.0.1:18081
cloudflare_guardian_allowed_signers: []
cloudflare_guardian_policy:
  static_site:
    guardian: "{{ cloudflare_guardian_name }}"
    box: "{{ cloudflare_guardian_static_site_box }}"
    domain: "{{ cloudflare_guardian_static_site_domain }}"
    cloudflare_account_id: "{{ cloudflare_guardian_cloudflare_account_id }}"
    cloudflare_zone_id: "{{ cloudflare_guardian_cloudflare_zone_id }}"
    tunnel_name: "{{ cloudflare_guardian_static_site_tunnel_name }}"
    service_url: "{{ cloudflare_guardian_static_site_service_url }}"
