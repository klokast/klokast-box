---
- name: Ensure app-resource include directory exists
  ansible.builtin.file:
    path: /etc/klokast/app-resources
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure keyed app-resource include directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - /etc/klokast/app-resources/router-forward.d
    - /etc/klokast/app-resources/vm-input.d

- name: Ensure app-resource include glob sentinels exist
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "# Empty placeholder so nft include globs always match.\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - /etc/klokast/app-resources/router-forward.d/000-empty.nft
    - /etc/klokast/app-resources/vm-input.d/000-empty.nft

- name: Retire legacy aggregate app-resource include files
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "# Legacy aggregate include retired by keyed platform-resources.\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - /etc/klokast/app-resources/router-forward.nft
    - /etc/klokast/app-resources/vm-input.nft

- name: Ensure app-resource reconcile helper directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install app-resource reconcile helper
  ansible.builtin.copy:
    src: reconcile-app-resources.py
    dest: /usr/local/libexec/klokast-app-resources-reconcile
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Reconcile app-resource rules with a temporary desired ledger
  when: node_domain_role in ['router', 'backend', 'dmz', 'iot', 'usr', 'ops']
  block:
    - name: Allocate a volatile desired ledger path
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: klokast-platform-resources-
        suffix: .json
      become: true
      register: app_resources_desired_file
      changed_when: false

    - name: Stage desired platform-resource ledger for keyed materialization
      ansible.builtin.copy:
        dest: "{{ app_resources_desired_file.path }}"
        content: "{{ platform_resources_desired_json }}\n"
        owner: root
        group: root
        mode: "0600"
      become: true
      changed_when: false

    - name: Reconcile keyed app-resource snippets
      ansible.builtin.command:
        argv: >-
          {{
            [
              '/usr/bin/python3',
              '/usr/local/libexec/klokast-app-resources-reconcile',
              'apply',
              '--desired',
              app_resources_desired_file.path,
              '--node-name',
              node_name,
              '--node-role',
              node_domain_role
            ]
            + (
              platform_resources_apply_scope_apps
              | default([])
              | map('regex_replace', '^', '--scope-app=')
              | list
            )
          }}
      become: true
      register: app_resources_reconcile
      changed_when: (app_resources_reconcile.stdout | from_json).changed | default(false)

    - name: Validate nftables after app-resource rendering
      ansible.builtin.command: /usr/sbin/nft -c -f /etc/nftables.nft
      become: true
      changed_when: false

    - name: Apply nftables after app-resource rendering
      ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.nft
      become: true
      changed_when: app_resources_reconcile.changed | default(false)
  always:
    - name: Remove the volatile app-resource desired ledger
      ansible.builtin.file:
        path: "{{ app_resources_desired_file.path }}"
        state: absent
      become: true
      changed_when: false
      when: app_resources_desired_file.path is defined

- name: Converge application DHCP reservations through the router include
  when: node_domain_role == 'router'
  block:
    - name: Select applications in the DHCP reservation scope
      ansible.builtin.set_fact:
        app_resources_dhcp_apps: "{{ platform_resources_apply_scope_apps | default([]) or ((platform_resources_desired_json | from_json).apps | list) }}"

    - name: Ensure the existing router DHCP include directory is present
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Render declared application DHCP reservations
      ansible.builtin.template:
        src: managed-dhcp-hosts.conf.j2
        dest: '/etc/dnsmasq.d/klokast-{{ item }}-devices.conf'
        owner: root
        group: root
        mode: '0644'
        validate: 'dnsmasq --test --conf-file=%s'
      loop: '{{ app_resources_dhcp_apps }}'
      when: router_managed_dhcp_hosts | default([]) | selectattr('node', 'equalto', node_name) | selectattr('app', 'equalto', item) | list | length > 0
      register: app_resources_dhcp_rendered

    - name: Remove application DHCP includes with no declared devices
      ansible.builtin.file:
        path: '/etc/dnsmasq.d/klokast-{{ item }}-devices.conf'
        state: absent
      loop: '{{ app_resources_dhcp_apps }}'
      when: router_managed_dhcp_hosts | default([]) | selectattr('node', 'equalto', node_name) | selectattr('app', 'equalto', item) | list | length == 0
      register: app_resources_dhcp_removed

    - name: Validate the complete router DHCP configuration
      ansible.builtin.command: dnsmasq --test
      changed_when: false

    - name: Reload DHCP reservations after a change
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
      when: app_resources_dhcp_rendered.changed or app_resources_dhcp_removed.changed
