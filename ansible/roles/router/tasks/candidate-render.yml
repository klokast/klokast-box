---
# Controller-only rendering in the selected host's inventory context. This task
# file does not connect to or change the running router.
- name: Require an exact router personalization output
  ansible.builtin.assert:
    that:
      - router_candidate_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
      - inventory_hostname == router_candidate_box ~ '-router'
      - router_candidate_result_dir is match('^/var/lib/klokast/updates/discovery/router/[0-9a-f]{24}$')
      - not (router_enable_ipv6_downstream | bool)
      - router_candidate_manifest.profile == 'router-alpine-v2'
      - router_candidate_manifest.inputs_sha256 is match('^[0-9a-f]{64}$')

- name: Require the active controller for private configuration rendering
  ansible.builtin.command:
    argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
  delegate_to: localhost
  become: false
  changed_when: false

- name: Set fixed candidate configuration
  ansible.builtin.set_fact:
    router_candidate_files:
      etc/hostname: "{{ router_candidate_box }}-router\n"
      etc/hosts: |
        127.0.0.1 localhost
        ::1 localhost
      etc/resolv.conf: |
        {% for address in router_dns_upstreams %}
        nameserver {{ address }}
        {% endfor %}
      etc/sysctl.conf: |
        net.ipv4.ip_forward=1
        net.ipv6.conf.all.forwarding=0
      etc/klokast/overlay-ipv6.nft: "# Ops IPv6 downstream is disabled.\n"
  no_log: true

- name: Add the exact compiled application rules
  ansible.builtin.set_fact:
    router_candidate_files: '{{ router_candidate_files | combine(router_candidate_includes) }}'
  no_log: true

- name: Render candidate service files through the normal router templates
  ansible.builtin.set_fact:
    router_candidate_files: >-
      {{ router_candidate_files | combine({item.path:
          lookup('ansible.builtin.template', role_path ~ '/templates/' ~ item.template)}) }}
  loop:
    - {path: etc/network/interfaces, template: interfaces.j2}
    - {path: etc/dhcpcd.conf, template: dhcpcd.conf.j2}
    - {path: etc/dnsmasq.conf, template: dnsmasq.conf.j2}
    - {path: etc/nftables.nft, template: nftables.nft.j2}
  no_log: true

- name: Write the bounded personalization input on the controller
  ansible.builtin.copy:
    content: >-
      {{ {'kind': 'klokast.router-personalization.v1', 'box': router_candidate_box,
          'role': 'router', 'inputs_sha256': router_candidate_manifest.inputs_sha256,
          'files': router_candidate_files, 'packages': router_candidate_packages} | to_nice_json }}
    dest: '{{ router_candidate_result_dir }}/personalization.json'
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
