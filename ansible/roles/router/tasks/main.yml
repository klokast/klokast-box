---
- name: Protect router assignments before legacy mutation
  ansible.builtin.include_role:
    name: router-boot-assignment

- name: Validate the router configuration phase
  ansible.builtin.assert:
    that:
      - router_configuration_phase in ['converge', 'render', 'activate', 'verify']

- name: Install router packages during legacy convergence only
  community.general.apk:
    name: [dhcpcd, dnsmasq, iproute2, nftables]
    state: present
  when: router_configuration_phase == 'converge'

- name: Render the router files without activating production networks
  ansible.builtin.include_tasks: render.yml
  when: router_configuration_phase in ['converge', 'render']

- name: Activate the rendered router service
  ansible.builtin.include_tasks: activate.yml
  when: router_configuration_phase in ['converge', 'activate']

- name: Verify the active router service
  ansible.builtin.include_role:
    name: router-verification
  when: router_configuration_phase == 'verify'
