#
# Summary:
# - Installs and keeps the Tailscale client running on Debian systemd guests.
#
---
- name: Assert Debian Tailscale inputs are valid
  ansible.builtin.assert:
    that:
      - node_hostname | length > 0
      - debian_tailscale_release is match('^[a-z][a-z0-9-]+$')
    fail_msg: "Debian Tailscale inputs are incomplete."

- name: Collect Debian Tailscale package status
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Status}"
      - "{{ item }}"
  register: debian_tailscale_package_status
  changed_when: false
  failed_when: false
  loop:
    - ca-certificates
    - curl
    - tailscale

- name: Derive Debian Tailscale package installation state
  ansible.builtin.set_fact:
    debian_tailscale_installed_packages: >-
      {{
        debian_tailscale_package_status.results
        | selectattr('rc', 'equalto', 0)
        | selectattr('stdout', 'equalto', 'install ok installed')
        | map(attribute='item')
        | list
      }}

- name: Derive Debian Tailscale missing prerequisite packages
  ansible.builtin.set_fact:
    debian_tailscale_prerequisites_missing: >-
      {{ ['ca-certificates', 'curl'] | difference(debian_tailscale_installed_packages) }}
    debian_tailscale_is_installed: "{{ 'tailscale' in debian_tailscale_installed_packages }}"

- name: Ensure Debian Tailscale apt prerequisites are installed
  ansible.builtin.apt:
    name: "{{ debian_tailscale_prerequisites_missing }}"
    state: present
    update_cache: true
  become: true
  when: debian_tailscale_prerequisites_missing | length > 0

- name: Check the Tailscale apt signing key
  ansible.builtin.stat:
    path: "{{ debian_tailscale_keyring_path }}"
  register: debian_tailscale_apt_signing_key_stat

- name: Install the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/{{ debian_tailscale_track }}/debian/{{ debian_tailscale_release }}.noarmor.gpg"
    dest: "{{ debian_tailscale_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  become: true
  register: debian_tailscale_apt_signing_key
  until: debian_tailscale_apt_signing_key is succeeded
  retries: 5
  delay: 5
  when: not debian_tailscale_apt_signing_key_stat.stat.exists

- name: Install the Tailscale apt source list
  ansible.builtin.copy:
    dest: "{{ debian_tailscale_sources_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Tailscale packages for debian {{ debian_tailscale_release }}
      deb [signed-by={{ debian_tailscale_keyring_path }}] https://pkgs.tailscale.com/{{ debian_tailscale_track }}/debian {{ debian_tailscale_release }} main
  become: true
  register: debian_tailscale_apt_source_list

- name: Ensure Tailscale is installed on Debian
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: >-
      {{
        (not (debian_tailscale_is_installed | bool))
        or (debian_tailscale_apt_signing_key.changed | default(false))
        or (debian_tailscale_apt_source_list.changed | default(false))
      }}
  become: true

- name: Ensure tailscaled is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true

- name: Collect Debian Tailscale runtime status
  ansible.builtin.command: tailscale status --json
  register: debian_tailscale_status_json
  changed_when: false
  failed_when: false

- name: Parse Debian Tailscale runtime status JSON when available
  ansible.builtin.set_fact:
    tailscale_client_status: "{{ debian_tailscale_status_json.stdout | from_json }}"
  when:
    - debian_tailscale_status_json.rc == 0
    - debian_tailscale_status_json.stdout | length > 0

- name: Collect Debian Tailscale preference state when SSH management is enabled
  ansible.builtin.command: tailscale debug prefs
  register: debian_tailscale_prefs_json
  changed_when: false
  failed_when: false
  when:
    - debian_tailscale_enable_ssh | bool
    - tailscale_client_status.BackendState | default('') == 'Running'

- name: Parse Debian Tailscale preference state when available
  ansible.builtin.set_fact:
    tailscale_client_prefs: "{{ debian_tailscale_prefs_json.stdout | from_json }}"
  when:
    - debian_tailscale_prefs_json.rc | default(1) == 0
    - debian_tailscale_prefs_json.stdout | default('') | length > 0

- name: Keep Debian Tailscale hostname aligned with the VM hostname
  ansible.builtin.command: "tailscale set --hostname={{ node_hostname }}"
  become: true
  when:
    - debian_tailscale_status_json.rc == 0
    - tailscale_client_status.Self.HostName | default('') != node_hostname

- name: Enable Tailscale SSH on Debian managed guests when requested
  ansible.builtin.command: tailscale set --ssh
  become: true
  when:
    - debian_tailscale_enable_ssh | bool
    - tailscale_client_status.BackendState | default('') == 'Running'
    - not (tailscale_client_prefs.RunSSH | default(false))
