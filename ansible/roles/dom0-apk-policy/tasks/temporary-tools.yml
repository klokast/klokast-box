---
- name: Validate the closed temporary dom0 tool transaction
  ansible.builtin.assert:
    that:
      - dom0_tool_profile | default('') == 'sealed-builder'
      - dom0_tool_action | default('') in ['begin', 'end']
      - dom0_tool_box | default('') is match('^[a-z0-9][a-z0-9-]{0,30}$')
      - inventory_hostname == dom0_tool_box ~ '-dom0'
      - dom0_tool_operation is match('^[0-9a-f]{12}$')
      - dom0_world_packages | default([]) | type_debug == 'list'
      - dom0_world_packages | length > 0
      - "'xen' in dom0_world_packages"
      - "'xen-hypervisor' in dom0_world_packages"
      - "['curl', 'kpartx', 'sfdisk', 'xorriso'] | difference(dom0_maintenance_package_allowlist) | length == 0"
    fail_msg: Temporary dom0 tools require a valid closed profile and managed package policy.

- name: Stage the exact steady-state dom0 APK world in RAM
  ansible.builtin.copy:
    dest: "/run/klokast-tools-{{ dom0_tool_profile }}-{{ dom0_tool_operation }}.world"
    content: "{{ (dom0_world_packages | sort | join('\n')) ~ '\n' }}"
    owner: root
    group: root
    mode: "0600"

- name: Stage the checked temporary-tool helper in RAM
  ansible.builtin.copy:
    src: dom0-temporary-tools.py
    dest: "/run/klokast-tools-{{ dom0_tool_profile }}-{{ dom0_tool_operation }}.py"
    owner: root
    group: root
    mode: "0500"

- name: Run the exact temporary dom0 tool action
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "/run/klokast-tools-{{ dom0_tool_profile }}-{{ dom0_tool_operation }}.py"
      - "{{ dom0_tool_action }}"
      - --profile
      - "{{ dom0_tool_profile }}"
      - --operation
      - "{{ dom0_tool_operation }}"
      - --expected-world
      - "/run/klokast-tools-{{ dom0_tool_profile }}-{{ dom0_tool_operation }}.world"

- name: Remove the temporary-tool helper after verified cleanup
  ansible.builtin.file:
    path: "/run/klokast-tools-{{ dom0_tool_profile }}-{{ dom0_tool_operation }}.py"
    state: absent
  when: dom0_tool_action == 'end'

- name: Remove the expected-world file after verified cleanup
  ansible.builtin.file:
    path: "/run/klokast-tools-{{ dom0_tool_profile }}-{{ dom0_tool_operation }}.world"
    state: absent
  when: dom0_tool_action == 'end'
