---
- name: Load accepted diskless image policy
  ansible.builtin.import_tasks: '{{ role_path }}/../../playbooks/tasks/dom0-image-policy.yml'
- name: Install signed upstream Tailscale with the legacy package transition
  when: not dom0_image_managed
  block:
    - name: Allocate controller-local public Tailscale inputs
      ansible.builtin.tempfile:
        state: directory
        prefix: klokast-dom0-tailscale.
      delegate_to: localhost
      become: false
      register: dom0_tailscale_inputs

    - name: Resolve and verify the latest stable upstream Tailscale archive
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys, tarfile
            from pathlib import Path
            repo, directory = map(Path, sys.argv[1:])
            sys.path.insert(0, str(repo / 'ansible/lib'))
            import router_tailscale
            record = router_tailscale.freeze(directory, repo, openrc=router_tailscale.COMMON_OPENRC)
            router_tailscale.verify(directory, record)
            with tarfile.open(directory / record['file']) as archive:
                for name in ('tailscale', 'tailscaled'):
                    source = archive.extractfile('tailscale_' + record['version'] + '_amd64/' + name)
                    (directory / name).write_bytes(source.read())
            print(record['version'])
          - '{{ playbook_dir }}/../..'
          - '{{ dom0_tailscale_inputs.path }}'
      delegate_to: localhost
      become: false
      changed_when: false

    # Fetch and verify before removal of the distribution package. Its daemon
    # keeps the SSH connection until the existing handoff/restart workflow.
    - name: Converge the Alpine package policy
      ansible.builtin.import_tasks: legacy.yml

    - name: Ensure the Tailscale service group exists
      ansible.builtin.group:
        name: tailscale
        system: true

    - name: Install the signed upstream Tailscale binaries
      ansible.builtin.copy:
        src: '{{ dom0_tailscale_inputs.path }}/{{ item.name }}'
        dest: '{{ item.dest }}'
        owner: root
        group: root
        mode: '0755'
      loop:
        - {name: tailscale, dest: /usr/bin/tailscale}
        - {name: tailscaled, dest: /usr/sbin/tailscaled}
        - {name: components/tailscale-openrc, dest: /etc/init.d/tailscale}
      notify: Commit dom0 package policy

    - name: Request the TUN module for upstream Tailscale
      ansible.builtin.copy:
        dest: /etc/modules-load.d/tailscale.conf
        content: "tun\n"
        owner: root
        group: root
        mode: '0644'
      notify: Commit dom0 package policy

    - name: Persist upstream Tailscale binaries outside APK
      ansible.builtin.lineinfile:
        path: '{{ lbu_protected_paths_file }}'
        line: '+{{ item }}'
        create: true
        mode: '0644'
      loop:
        - usr/bin/tailscale
        - usr/sbin/tailscaled
      notify: Commit dom0 package policy
  always:
    - name: Remove this operation's public Tailscale inputs
      ansible.builtin.file:
        path: '{{ dom0_tailscale_inputs.path }}'
        state: absent
      delegate_to: localhost
      become: false
      when: dom0_tailscale_inputs.path is defined
