---
- name: Require an exact isolated router compatibility operation
  ansible.builtin.assert:
    that:
      - router_compatibility_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
      - router_compatibility_operation is match('^[0-9a-f]{24}$')
      - inventory_hostname == router_compatibility_box ~ '-dom0'
      - router_compatibility_input_dir == '/var/cache/klokast/updates/router/compatibility-' ~ router_compatibility_operation
      - router_compatibility_result_dir == '/var/lib/klokast/updates/discovery/router/' ~ router_compatibility_operation

- name: Require active-controller authority before allocating test resources
  ansible.builtin.command:
    argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
  delegate_to: localhost
  become: false
  changed_when: false
  register: router_compatibility_controller

- name: Verify active-controller status
  ansible.builtin.assert:
    that:
      - (router_compatibility_controller.stdout | from_json).active | bool
      - (router_compatibility_controller.stdout | from_json).configured | bool

- name: Require persistent dom0 storage
  ansible.builtin.command: /bin/mountpoint -q /mnt/dom0_data
  changed_when: false

- name: Create private compatibility qualification storage
  ansible.builtin.file:
    path: /mnt/dom0_data/klokast-router-compatibility
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect the unique compatibility qualification directory
  ansible.builtin.stat:
    path: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}'
    follow: false
  register: router_compatibility_existing

- name: Refuse a reused compatibility qualification operation
  ansible.builtin.assert:
    that: [not router_compatibility_existing.stat.exists]

- name: Allocate private compatibility qualification directories
  ansible.builtin.file:
    path: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: ['', async]

- name: Stage exact compatibility qualification inputs
  ansible.builtin.copy:
    src: '{{ router_compatibility_input_dir }}/{{ item.source }}'
    dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/{{ item.target }}'
    owner: root
    group: root
    mode: '0600'
  loop:
    - {source: request.json, target: request.json}
    - {source: boot/kernel, target: kernel}
    - {source: boot/initramfs, target: initramfs}

- name: Stage fixed compatibility qualification dispatcher
  ansible.builtin.copy:
    src: router-compatibility-dom0
    dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/router-compatibility-dom0.py'
    owner: root
    group: root
    mode: '0600'

- name: Stage fixed Xen transport
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/xen_build_runtime.py'
    dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/xen_build_runtime.py'
    owner: root
    group: root
    mode: '0600'

- name: Stage the fixed read-only legacy source inspector
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../roles/router-update-inspection/files/inspect-router-update'
    dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/inspect-router-update.py'
    owner: root
    group: root
    mode: '0600'

- name: Stage the fixed opaque candidate allocation and native guard modules
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/{{ item }}.py'
    dest: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/{{ item }}.py'
    owner: root
    group: root
    mode: '0600'
  loop:
    - router_candidate_disk
    - router_native
    - router_records
    - router_initial_installation
    - router_transaction
    - router_generations
    - router_personalize
    - router_finalize

- name: Run bounded old/new/old native services on isolated copies
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/router-compatibility-dom0.py'
      - --box
      - '{{ router_compatibility_box }}'
      - --operation-id
      - '{{ router_compatibility_operation }}'
  async: 3000
  poll: 10
  vars:
    ansible_async_dir: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/async'
  register: router_compatibility_run
  failed_when: false

- name: Inspect bounded compatibility qualification evidence
  ansible.builtin.stat:
    path: '/mnt/dom0_data/klokast-router-compatibility/{{ router_compatibility_operation }}/{{ item }}'
    follow: false
    get_checksum: false
  loop: [result.json, lifecycle.json, candidate-disk.json, snapshot.json, prepare.json, seed.json, forward.json, new.json, reverse.json, old.json]
  register: router_compatibility_evidence

- name: Fetch bounded compatibility qualification records
  ansible.builtin.fetch:
    src: '{{ item.stat.path }}'
    dest: '{{ router_compatibility_result_dir }}/{{ item.item }}'
    flat: true
  loop: '{{ router_compatibility_evidence.results }}'
  when:
    - item.stat.isreg | default(false)
    - not (item.stat.islnk | default(false))
    - item.stat.size | default(1048577) <= 1048576

- name: Require every native compatibility phase to pass
  ansible.builtin.assert:
    that: [router_compatibility_run.rc | default(1) == 0]
    fail_msg: >-
      Router compatibility qualification failed. Inspect the exact operation records.
      The production router remains running; test copies have no network interface.
