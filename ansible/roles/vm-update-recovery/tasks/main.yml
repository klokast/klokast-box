---
- name: Verify the shared VM recovery installation target
  ansible.builtin.assert:
    that:
      - inventory_hostname == node_name ~ '-dom0'

- name: Verify persistent dom0 data storage before installing recovery
  ansible.builtin.command: /bin/mountpoint -q /mnt/dom0_data
  changed_when: false

- name: Create restricted persistent transaction storage
  ansible.builtin.file:
    path: "/mnt/dom0_data/klokast-vm-updates/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: ['', operations, active]

- name: Create the dom0 local administrator command directory
  ansible.builtin.file:
    path: /usr/local/sbin
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the closed shared VM transaction helper
  ansible.builtin.copy:
    src: vm-update-transaction
    dest: /usr/local/sbin/vm-update-transaction
    owner: root
    group: root
    mode: '0700'

- name: Verify recovery records use the writable persistent LVM filesystem
  ansible.builtin.command:
    argv: [/usr/local/sbin/vm-update-transaction, check-storage]
  changed_when: false

- name: Verify protected shared VM assignment records can be read
  ansible.builtin.command:
    argv: [/usr/local/sbin/vm-update-transaction, assignment-status, --role, "{{ item }}"]
  loop: [bak, dmz, iot]
  changed_when: false

- name: Install boot recovery before Xen guest autostart
  ansible.builtin.copy:
    src: klokast-vm-update-recovery.openrc
    dest: /etc/init.d/klokast-vm-update-recovery
    owner: root
    group: root
    mode: '0755'

- name: Make successful recovery a prerequisite for Xen guest autostart
  ansible.builtin.blockinfile:
    path: /etc/conf.d/xendomains
    create: true
    mode: '0644'
    marker: '# {mark} KLOKAST VM UPDATE RECOVERY'
    block: 'rc_need="${rc_need:-} localmount klokast-vm-update-recovery"'

- name: Enable the boot recovery oneshot without changing running guests
  ansible.builtin.command: /sbin/rc-update add klokast-vm-update-recovery default
  changed_when: false

- name: Include the recovery helper in diskless persistence
  ansible.builtin.command: /usr/sbin/lbu include /usr/local/sbin/vm-update-transaction
  changed_when: false

- name: Include the recovery OpenRC service in diskless persistence
  ansible.builtin.command: /usr/sbin/lbu include /etc/init.d/klokast-vm-update-recovery
  changed_when: false

- name: Persist recovery configuration without including persistent data
  ansible.builtin.command: /usr/sbin/lbu commit -d
  changed_when: false

- name: Verify the persisted recovery boot chain and data exclusion
  ansible.builtin.shell: |
    set -eu
    archives=$(find /media -maxdepth 2 -type f -name '*.apkovl.tar.gz' -print)
    count=$(printf '%s\n' "$archives" | awk 'NF {n++} END {print n+0}')
    if [ "$count" -ne 1 ]; then
      echo 'Expected one persisted dom0 apkovl archive' >&2
      exit 1
    fi
    tar -tzf "$archives" | awk '
      {sub(/^\.\//, "", $0)}
      $0 == "usr/local/sbin/vm-update-transaction" {helper=1}
      $0 == "etc/init.d/klokast-vm-update-recovery" {service=1}
      $0 == "etc/conf.d/xendomains" {config=1}
      $0 == "etc/runlevels/default/klokast-vm-update-recovery" {runlevel=1}
      /^mnt\/dom0_data(\/|$)/ {data=1}
      END {
        if (!helper || !service || !config || !runlevel || data) {
          print "Incomplete dom0 recovery boot archive or included persistent data" > "/dev/stderr"
          exit 1
        }
      }
    '
  changed_when: false
