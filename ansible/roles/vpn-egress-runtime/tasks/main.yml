---
- name: Require the declared gateway and validated private artifact
  ansible.builtin.assert:
    that:
      - inventory_hostname == infrastructure_box ~ '-vpn-egress'
      - vpn_egress_config is mapping
      - vpn_egress_binary is defined

- name: Configure independent gateway bootstrap DNS
  ansible.builtin.include_role:
    name: vm-dns
  vars:
    vm_dns_resolvers: '{{ vpn_egress_bootstrap_dns }}'
    vm_dns_vpn_client: false
    vm_dns_preserve_bootstrap: false

- name: Create the proxy service group
  ansible.builtin.group:
    name: vpn-egress
    gid: '{{ vpn_egress_gid | default(omit) }}'
    system: true

- name: Create the unprivileged proxy account
  ansible.builtin.user:
    name: vpn-egress
    group: vpn-egress
    uid: '{{ vpn_egress_uid | default(omit) }}'
    system: true
    create_home: false
    home: /var/lib/vpn-egress
    shell: /sbin/nologin
  register: vpn_egress_user

- name: Read the service group numeric identity
  ansible.builtin.getent:
    database: group
    key: vpn-egress

# Alpine's user module creates the requested primary group, but its update
# path ignores this field. Set it explicitly without changing the account UID.
- name: Set the existing proxy account group home and shell
  ansible.builtin.lineinfile:
    path: /etc/passwd
    regexp: '^(vpn-egress:[^:]*:[0-9]+:)[0-9]+:([^:]*):[^:]*:[^:]*$'
    line: '\g<1>{{ ansible_facts.getent_group["vpn-egress"][1] }}:\g<2>:/var/lib/vpn-egress:/sbin/nologin'
    backrefs: true
  notify: Restart VPN egress

- name: Restrict proxy account membership to its service group
  ansible.builtin.user:
    name: vpn-egress
    groups: vpn-egress
    append: false
  notify: Restart VPN egress

- name: Verify the unprivileged proxy account contract
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import grp, os, pwd
        user = pwd.getpwnam('vpn-egress')
        group = grp.getgrnam('vpn-egress')
        if user.pw_uid == 0 or group.gr_gid == 0 or set(os.getgrouplist(user.pw_name, user.pw_gid)) != {group.gr_gid} or user.pw_gid != group.gr_gid or user.pw_shell != '/sbin/nologin' or user.pw_dir != '/var/lib/vpn-egress':
            raise SystemExit('VPN account must be unprivileged, non-login, and use vpn-egress as its primary group')
  changed_when: false

- name: Create protected proxy configuration
  ansible.builtin.file:
    path: /etc/vpn-egress
    state: directory
    owner: root
    group: vpn-egress
    mode: '0750'

- name: Create reconstructable proxy state
  ansible.builtin.file:
    path: /var/lib/vpn-egress
    state: directory
    owner: vpn-egress
    group: vpn-egress
    mode: '0700'

- name: Create the selected domain cache directory
  ansible.builtin.file:
    path: /var/lib/vpn-egress/rules
    state: directory
    owner: vpn-egress
    group: vpn-egress
    mode: '0700'
  when: vpn_egress_domain_list is defined

- name: Install the validated selected domain list before service startup
  ansible.builtin.copy:
    src: '{{ vpn_egress_domain_list }}'
    dest: '/var/lib/vpn-egress/{{ vpn_egress_domain_path }}'
    owner: vpn-egress
    group: vpn-egress
    mode: '0600'
  when: vpn_egress_domain_list is defined
  notify: Restart VPN egress

- name: Create the protected subscription cache directory
  ansible.builtin.file:
    path: /var/lib/vpn-egress/proxies
    state: directory
    owner: vpn-egress
    group: vpn-egress
    mode: '0700'

- name: Inspect the subscription cache without changing its age
  ansible.builtin.stat:
    path: '/var/lib/vpn-egress/{{ vpn_egress_config["proxy-providers"].relays.path | regex_replace("^./", "") }}'
  register: vpn_egress_subscription_cache

- name: Seed a missing subscription cache before startup
  when: not vpn_egress_subscription_cache.stat.exists
  block:
    - name: Install the frozen initial subscription
      ansible.builtin.copy:
        src: '{{ vpn_egress_subscription_seed }}'
        dest: '/var/lib/vpn-egress/{{ vpn_egress_config["proxy-providers"].relays.path | regex_replace("^./", "") }}'
        owner: vpn-egress
        group: vpn-egress
        mode: '0600'
        force: false
      no_log: true
    - name: Preserve the initial subscription download time
      ansible.builtin.file:
        path: '/var/lib/vpn-egress/{{ vpn_egress_config["proxy-providers"].relays.path | regex_replace("^./", "") }}'
        modification_time: '{{ vpn_egress_subscription_mtime }}'
      no_log: true

- name: Install the checksum-verified proxy binary
  ansible.builtin.copy:
    src: '{{ vpn_egress_binary }}'
    dest: /usr/local/bin/mihomo
    owner: root
    group: root
    mode: '0755'
  notify: Restart VPN egress

- name: Install validated proxy configuration
  ansible.builtin.copy:
    content: '{{ vpn_egress_config | to_nice_yaml }}'
    dest: /etc/vpn-egress/config.yml
    owner: root
    group: vpn-egress
    mode: '0640'
    validate: /usr/local/bin/mihomo -t -f %s -d /var/lib/vpn-egress
  no_log: true
  notify: Restart VPN egress

- name: Install the proxy service
  ansible.builtin.template:
    src: mihomo.openrc.j2
    dest: /etc/init.d/vpn-egress
    owner: root
    group: root
    mode: '0755'
  notify: Restart VPN egress

- name: Install the gateway firewall
  ansible.builtin.template:
    src: nftables.nft.j2
    dest: /etc/nftables.nft
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nft -c -f %s
  register: vpn_egress_firewall

- name: Apply the gateway firewall including client revocations
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.nft
  changed_when: vpn_egress_firewall.changed

- name: Remove the temporary image firewall table
  ansible.builtin.command: /usr/sbin/nft destroy table inet klokast_vm_filter
  changed_when: false

- name: Keep the firewall enabled
  ansible.builtin.service:
    name: nftables
    enabled: true

- name: Start the proxy service
  ansible.builtin.service:
    name: vpn-egress
    enabled: true
    state: started

- name: Apply changed proxy settings before verification
  ansible.builtin.meta: flush_handlers
