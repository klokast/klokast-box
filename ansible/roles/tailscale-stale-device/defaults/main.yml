---
tailscale_devices_list_wrapper: /usr/local/sbin/ts-devices-list
tailscale_device_delete_stale_wrapper: /usr/local/sbin/ts-device-delete-stale
tailscale_device_privilege_command:
  - sudo
  - -n
tailscale_device_expected_hostname: "{{ node_hostname }}"
tailscale_device_expected_tag: "{{ vm_tailscale_authkey_expected_tag }}"
tailscale_device_apply: false
tailscale_device_confirm: ""
tailscale_device_expected_confirm: ""
tailscale_device_fail_on_online_exact: false
tailscale_device_fail_on_online_exact_message: >-
  Refusing to continue because {{ tailscale_device_expected_hostname }} is
  still online in local `tailscale status --json`.
