#
# Summary:
# - Finds exact-name stale Tailscale devices for one expected hostname/tag pair
#   and optionally deletes only the entries whose offline state is proven from
#   local `tailscale status --json`.
#
---
- name: Assert the requested Tailscale device selector is usable
  ansible.builtin.assert:
    that:
      - tailscale_device_expected_hostname | length > 0
      - tailscale_device_expected_tag | length > 0
    fail_msg: >-
      tailscale-stale-device requires both
      tailscale_device_expected_hostname and tailscale_device_expected_tag.

- name: List Tailscale devices through the ops wrapper
  ansible.builtin.command:
    argv: "{{ tailscale_device_privilege_command + [tailscale_devices_list_wrapper] }}"
  delegate_to: localhost
  become: false
  register: tailscale_device_devices_json
  changed_when: false
  no_log: true

- name: Collect local Tailscale status for online-state proof
  ansible.builtin.command:
    argv:
      - tailscale
      - status
      - --json
  delegate_to: localhost
  become: false
  register: tailscale_device_status_json
  changed_when: false
  no_log: true

- name: Classify Tailscale devices for the expected hostname and tag
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        expected_hostname = {{ tailscale_device_expected_hostname | to_json }}.rstrip(".").lower()
        expected_tag = {{ tailscale_device_expected_tag | to_json }}
        input_data = json.load(sys.stdin)
        devices_data = input_data["devices"]
        status_data = input_data["status"]
        devices = devices_data.get("devices") or devices_data.get("Devices") or []

        def names_for_device(device):
            names = set()
            for key in ("hostname", "HostName", "name", "Name", "dnsName", "DNSName"):
                value = device.get(key)
                if not value:
                    continue
                name = str(value).rstrip(".").lower()
                names.add(name)
                names.add(name.split(".", 1)[0])
            return names

        def full_names_for_device(device):
            names = set()
            for key in ("name", "Name", "dnsName", "DNSName"):
                value = device.get(key)
                if value:
                    names.add(str(value).rstrip(".").lower())
            return names

        def addresses_for_device(device):
            addresses = set()
            for key in ("addresses", "Addresses", "tailscaleIPs", "TailscaleIPs"):
                for value in device.get(key) or []:
                    addresses.add(str(value).split("/", 1)[0])
            return addresses

        def display_name(device):
            return (
                device.get("name")
                or device.get("Name")
                or device.get("dnsName")
                or device.get("DNSName")
                or device.get("hostname")
                or device.get("HostName")
                or ""
            )

        status_peers = list((status_data.get("Peer") or {}).values())
        if status_data.get("Self"):
            status_peers.append(status_data["Self"])

        def names_for_peer(peer):
            names = set()
            for key in ("HostName", "DNSName"):
                value = peer.get(key)
                if not value:
                    continue
                name = str(value).rstrip(".").lower()
                names.add(name)
                names.add(name.split(".", 1)[0])
            return names

        def full_names_for_peer(peer):
            names = set()
            for key in ("DNSName",):
                value = peer.get(key)
                if value:
                    names.add(str(value).rstrip(".").lower())
            return names

        def matching_status_peer(device):
            device_names = names_for_device(device)
            device_full_names = full_names_for_device(device)
            device_addresses = addresses_for_device(device)
            device_node_ids = {
                str(device.get("nodeId") or ""),
                str(device.get("nodeID") or ""),
                str(device.get("NodeID") or ""),
            }
            device_node_ids.discard("")

            for peer in status_peers:
                peer_full_names = full_names_for_peer(peer)
                peer_addresses = {str(value) for value in (peer.get("TailscaleIPs") or [])}
                peer_ids = {str(peer.get("ID") or "")}
                peer_ids.discard("")
                if device_full_names and (device_full_names & peer_full_names):
                    return peer
                if device_addresses and (device_addresses & peer_addresses):
                    return peer
                if device_node_ids and (device_node_ids & peer_ids):
                    return peer

            short_matches = [
                peer
                for peer in status_peers
                if device_names & names_for_peer(peer)
            ]
            if len(short_matches) == 1:
                return short_matches[0]
            return None

        stale_exact = []
        online_exact = []
        online_suffix = []
        unknown_exact = []

        for device in devices:
            tags = device.get("tags") or device.get("Tags") or []
            if expected_tag not in tags:
                continue

            device_id = str(device.get("id") or device.get("ID") or "")
            if not device_id:
                continue

            names = names_for_device(device)
            status_peer = matching_status_peer(device)
            online = status_peer.get("Online") if status_peer is not None else None
            summary = {
                "id": device_id,
                "name": display_name(device),
                "online": online,
                "lastSeen": device.get("lastSeen") or device.get("LastSeen") or "",
                "tags": tags,
            }

            if expected_hostname in names:
                if online is True:
                    online_exact.append(summary)
                elif online is False:
                    stale_exact.append(summary)
                else:
                    unknown_exact.append(summary)
            elif online is True and any(name.startswith(f"{expected_hostname}-") for name in names):
                online_suffix.append(summary)

        print(json.dumps({
            "expected_hostname": expected_hostname,
            "expected_tag": expected_tag,
            "stale_exact": stale_exact,
            "online_exact": online_exact,
            "online_suffix": online_suffix,
            "unknown_exact": unknown_exact,
        }, sort_keys=True))
    stdin: >-
      {{
        {
          'devices': tailscale_device_devices_json.stdout | from_json,
          'status': tailscale_device_status_json.stdout | from_json
        } | to_json
      }}
  delegate_to: localhost
  become: false
  register: tailscale_device_candidates_json
  changed_when: false
  no_log: true

- name: Record Tailscale stale-device candidates
  ansible.builtin.set_fact:
    tailscale_device_candidates: "{{ tailscale_device_candidates_json.stdout | from_json }}"

- name: Show the Tailscale stale-device plan
  ansible.builtin.debug:
    msg:
      - "Expected Tailscale machine: {{ tailscale_device_candidates.expected_hostname }} ({{ tailscale_device_candidates.expected_tag }})"
      - "Offline exact-name devices selected for deletion: {{ tailscale_device_candidates.stale_exact }}"
      - "Online exact-name devices kept: {{ tailscale_device_candidates.online_exact }}"
      - "Online suffixed devices kept: {{ tailscale_device_candidates.online_suffix }}"
      - "Exact-name devices kept because online state was not proven: {{ tailscale_device_candidates.unknown_exact }}"

- name: Refuse to continue when the exact-name device is still online
  ansible.builtin.assert:
    that:
      - tailscale_device_candidates.online_exact | length == 0
    fail_msg: "{{ tailscale_device_fail_on_online_exact_message }}"
  when: tailscale_device_fail_on_online_exact | bool

- name: Require an expected confirmation string before deleting stale devices
  ansible.builtin.assert:
    that:
      - tailscale_device_expected_confirm | length > 0
      - tailscale_device_confirm == tailscale_device_expected_confirm
    fail_msg: >-
      Refusing to delete stale Tailscale devices. Re-run with
      -e tailscale_device_apply=true
      -e 'tailscale_device_confirm={{ tailscale_device_expected_confirm }}'
  when:
    - tailscale_device_apply | bool
    - tailscale_device_candidates.stale_exact | length > 0

- name: Delete stale exact-name Tailscale devices through the ops wrapper
  ansible.builtin.command:
    argv: >-
      {{
        tailscale_device_privilege_command
        + [
          tailscale_device_delete_stale_wrapper,
          '--id', item.id,
          '--hostname', tailscale_device_candidates.expected_hostname,
          '--tag', tailscale_device_candidates.expected_tag
        ]
      }}
  loop: "{{ tailscale_device_candidates.stale_exact }}"
  delegate_to: localhost
  become: false
  register: tailscale_device_delete_results
  changed_when: true
  when: tailscale_device_apply | bool
