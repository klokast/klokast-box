---
- name: Create runner-owned bootstrap directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: agent
    group: agent
    mode: '{{ item.mode }}'
  loop:
    - {path: /home/agent/.ssh, mode: '0700'}
    - {path: /home/agent/src/klokast, mode: '0755'}

- name: Install the existing pinned GitHub public host keys
  ansible.builtin.known_hosts:
    path: /home/agent/.ssh/known_hosts
    name: github.com
    key: '{{ item }}'
    state: present
  loop: '{{ air_github_known_hosts }}'

- name: Protect the runner known-hosts file
  ansible.builtin.file:
    path: /home/agent/.ssh/known_hosts
    owner: agent
    group: agent
    mode: '0600'

- name: Generate this runner's own Git key without replacing one
  ansible.builtin.command:
    argv: [doas, -u, agent, env, HOME=/home/agent, ssh-keygen, -t, ed25519, -N, '', -C, 'agent@{{ node_hostname }} Git', -f, /home/agent/.ssh/github-klokast-codex]
    creates: /home/agent/.ssh/github-klokast-codex

- name: Install initial SSH settings without replacing user settings
  ansible.builtin.copy:
    dest: /home/agent/.ssh/config
    owner: agent
    group: agent
    mode: '0600'
    force: false
    content: |
      Host github.com
          HostName ssh.github.com
          Port 443
          User git
          HostKeyAlias github.com
          IdentityFile /home/agent/.ssh/github-klokast-codex
          IdentitiesOnly yes
          StrictHostKeyChecking yes

- name: Clone the public Platform repository only when absent
  ansible.builtin.command:
    argv: [doas, -u, agent, env, HOME=/home/agent, git, clone, 'https://github.com/klokast/klokast-box.git', /home/agent/src/klokast/klokast-box]
    creates: /home/agent/src/klokast/klokast-box/.git
  register: air_repository_clone

- name: Set the new checkout's push transport to the runner-owned Git key
  ansible.builtin.command:
    argv: [doas, -u, agent, git, -C, /home/agent/src/klokast/klokast-box, config, remote.origin.pushurl, 'git@github.com:klokast/klokast-box.git']
  when: air_repository_clone.changed

- name: Read existing runner Git author settings
  ansible.builtin.command:
    argv: [doas, -u, agent, env, HOME=/home/agent, git, config, --global, --get, '{{ item.name }}']
  loop:
    - {name: user.name, value: Klokast Agent}
    - {name: user.email, value: 'agent@{{ node_hostname }}'}
  register: air_git_author
  changed_when: false
  failed_when: air_git_author.rc not in [0, 1]

- name: Install missing Git author defaults without changing user settings
  ansible.builtin.command:
    argv: [doas, -u, agent, env, HOME=/home/agent, git, config, --global, '{{ item.item.name }}', '{{ item.item.value }}']
  loop: '{{ air_git_author.results }}'
  when: item.rc == 1

- name: Read this runner's public key for its one-time GitHub registration
  ansible.builtin.command: cat /home/agent/.ssh/github-klokast-codex.pub
  changed_when: false
  register: air_git_public_key

- name: Show the runner-owned public Git identity
  ansible.builtin.debug:
    msg: 'Register this public key as a write-enabled deploy key on klokast/klokast-box only: {{ air_git_public_key.stdout }}'

- name: Create the runner Codex configuration directory
  ansible.builtin.file:
    path: /home/agent/.codex
    state: directory
    owner: agent
    group: agent
    mode: '0700'

- name: Create an empty Codex configuration only when none exists
  ansible.builtin.copy:
    dest: /home/agent/.codex/config.toml
    content: ''
    owner: agent
    group: agent
    mode: '0600'
    force: false

- name: Remove shared execution preferences from the TUI table before convergence
  ansible.builtin.lineinfile:
    path: /home/agent/.codex/config.toml
    regexp: '^{{ item }}\s*='
    state: absent
  loop:
    - approval_policy
    - approvals_reviewer
    - sandbox_mode
    - personality
    - plan_mode_reasoning_effort

- name: Apply shared Codex model and execution preferences
  ansible.builtin.lineinfile:
    path: /home/agent/.codex/config.toml
    regexp: '^{{ item.key }}\s*='
    line: '{{ item.line }}'
    insertbefore: '^\['
    firstmatch: true
    create: true
    owner: agent
    group: agent
    mode: '0600'
  loop:
    - {key: model, line: 'model = "gpt-6-astra"'}
    - {key: model_reasoning_effort, line: 'model_reasoning_effort = "high"'}
    - {key: approval_policy, line: 'approval_policy = "never"'}
    - {key: approvals_reviewer, line: 'approvals_reviewer = "user"'}
    - {key: sandbox_mode, line: 'sandbox_mode = "danger-full-access"'}
    - {key: personality, line: 'personality = "pragmatic"'}
    - {key: plan_mode_reasoning_effort, line: 'plan_mode_reasoning_effort = "xhigh"'}

- name: Ensure the runner Codex TUI settings table exists
  ansible.builtin.lineinfile:
    path: /home/agent/.codex/config.toml
    regexp: '^\[tui\]\s*$'
    line: '[tui]'
    create: true
    owner: agent
    group: agent
    mode: '0600'

- name: Apply shared Codex TUI preferences
  ansible.builtin.lineinfile:
    path: /home/agent/.codex/config.toml
    regexp: '^{{ item.key }}\s*='
    line: '{{ item.line }}'
    insertafter: '^\[tui\]\s*$'
    firstmatch: true
    create: true
    owner: agent
    group: agent
    mode: '0600'
  loop:
    - {key: status_line, line: 'status_line = ["model-with-reasoning", "context-remaining", "weekly-limit", "codex-version", "thread-id"]'}
    - {key: status_line_use_colors, line: 'status_line_use_colors = true'}
    - {key: fullscreen_transcript, line: 'fullscreen_transcript = false'}

- name: Validate the runner Codex settings as TOML without printing them
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - 'import pathlib, tomllib; tomllib.loads(pathlib.Path("/home/agent/.codex/config.toml").read_text())'
  changed_when: false
