#
# Summary:
# - Copies root-only Tailscale OAuth files from the current controller to the
#   in-Platform ops controller.
#
---
- name: Assert root-only Tailscale secret inputs are defined
  ansible.builtin.assert:
    that:
      - ops_controller_root_secret_files | default([]) | length > 0
      - >-
        ops_controller_root_secret_files
        | select('match', '^/')
        | list
        | length == ops_controller_root_secret_files | length
    fail_msg: Ops root-only Tailscale secret variables are incomplete.

- name: Check current-controller root-only Tailscale secret files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ ops_controller_root_secret_files }}"
  delegate_to: localhost
  become: true
  become_method: "{{ ops_controller_source_become_method | default('doas') }}"
  become_flags: "{{ ops_controller_source_become_flags | default('-n') }}"
  register: ops_root_secret_sources
  no_log: true

- name: Require root-only Tailscale secret files before migration
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
    fail_msg: "Missing required current-controller Tailscale secret file."
  loop: "{{ ops_root_secret_sources.results }}"
  no_log: true

- name: Read current-controller root-only Tailscale secret files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ ops_controller_root_secret_files }}"
  delegate_to: localhost
  become: true
  become_method: "{{ ops_controller_source_become_method | default('doas') }}"
  become_flags: "{{ ops_controller_source_become_flags | default('-n') }}"
  register: ops_root_secret_payloads
  no_log: true

- name: Ensure target root-only Tailscale secret directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ ops_controller_root_secret_files | map('dirname') | unique | list }}"

- name: Install root-only Tailscale secret files on the ops controller
  ansible.builtin.copy:
    dest: "{{ item.source }}"
    content: "{{ item.content | b64decode }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ ops_root_secret_payloads.results }}"
  no_log: true
