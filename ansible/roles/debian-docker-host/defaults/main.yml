---
debian_docker_release: "{{ ansible_distribution_release | default('trixie') }}"
debian_docker_architecture: amd64
debian_docker_keyring_path: /etc/apt/keyrings/docker.asc
debian_docker_sources_path: /etc/apt/sources.list.d/docker.sources
debian_docker_users: []
debian_docker_daemon_config:
  live-restore: true
  userland-proxy: false
  log-driver: local
