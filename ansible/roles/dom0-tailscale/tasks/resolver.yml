#
# Summary:
# - Lets udhcpc write the WAN DHCP resolvers to /etc/resolv.conf. Dom0 uses no tailnet DNS.
# - The packaged udhcpc configuration is used unchanged. The dom0 update selection
#   removes the openresolv hooks and the edited udhcpc.conf of older bundles.
#
---
- name: Collect the Tailscale DNS preference
  ansible.builtin.command: tailscale debug prefs
  register: dom0_tailscale_dns_prefs
  changed_when: false
  failed_when: false

- name: Keep Tailscale out of the dom0 resolver
  # Dom0 resolves only public names: the APK mirror and the Tailscale control
  # plane. Tailscale SSH and the controller do not need MagicDNS on dom0.
  ansible.builtin.command: tailscale set --accept-dns=false
  when:
    - dom0_tailscale_dns_prefs.rc == 0
    - (dom0_tailscale_dns_prefs.stdout | from_json).CorpDNS | default(false) | bool
  notify: Commit lbu changes

- name: Read the WAN resolver configuration
  ansible.builtin.command: cat /etc/resolv.conf
  register: dom0_resolv_conf_before_renew
  changed_when: false
  failed_when: false

- name: Detect a missing WAN resolver
  ansible.builtin.set_fact:
    dom0_wan_resolver_was_missing: >-
      {{
        dom0_resolv_conf_before_renew.rc != 0
        or not (dom0_resolv_conf_before_renew.stdout is search('(?m)^nameserver[ ]+'))
      }}

- name: Request a DHCP renewal to write the WAN resolvers
  ansible.builtin.shell: |
    set -eu
    pid_file=/run/udhcpc.{{ dom0_wan_bridge_name | quote }}.pid
    pid=$(cat "$pid_file")
    case "$pid" in
      ""|*[!0-9]*) exit 1 ;;
    esac
    kill -USR1 "$pid"
  args:
    executable: /bin/sh
  changed_when: true
  when: dom0_wan_resolver_was_missing | bool

- name: Wait for the WAN resolvers
  ansible.builtin.command: cat /etc/resolv.conf
  register: dom0_resolv_conf_after_renew
  changed_when: false
  retries: 10
  delay: 1
  until:
    - dom0_resolv_conf_after_renew.rc == 0
    - dom0_resolv_conf_after_renew.stdout is search('(?m)^nameserver[ ]+')
  when: dom0_wan_resolver_was_missing | bool
