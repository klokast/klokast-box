---
alpine_virt_version: "3.23.3"
alpine_virt_arch: "{{ apk_repository_arch | default('x86_64') }}"
alpine_virt_major_minor: "{{ alpine_virt_version | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"
alpine_virt_mirror: http://dl-cdn.alpinelinux.org/alpine
alpine_virt_iso_filename: "alpine-virt-{{ alpine_virt_version }}-{{ alpine_virt_arch }}.iso"
alpine_virt_iso_url: "{{ alpine_virt_mirror }}/v{{ alpine_virt_major_minor }}/releases/{{ alpine_virt_arch }}/{{ alpine_virt_iso_filename }}"
# Callers can select a release-specific directory without changing shared inputs.
alpine_virt_asset_directory: "{{ dom0_xen_images_path }}"
alpine_virt_kernel_path: "{{ xen_shared_installer_kernel_path }}"
alpine_virt_initramfs_path: "{{ xen_shared_installer_initramfs_path }}"
alpine_virt_iso_link_path: "{{ xen_shared_installer_iso_path }}"
# An approved digest is mandatory for a router replacement caller. Legacy
# bootstrap retains its existing checksum path until its input authority moves.
alpine_virt_expected_sha256: ""
alpine_virt_asset_receipt_path: "{{ alpine_virt_asset_directory }}/alpine-virt-assets.json"
alpine_virt_iso_download_path: "{{ alpine_virt_asset_directory }}/{{ alpine_virt_iso_filename }}"
alpine_virt_checksum_path: "{{ alpine_virt_iso_download_path }}.sha256"
alpine_virt_package_repo_path: "{{ alpine_virt_asset_directory }}/alpine-virt-apks"
alpine_virt_modloop_path: "{{ alpine_virt_asset_directory }}/modloop-virt"
alpine_virt_connect_timeout_seconds: 30
alpine_virt_download_timeout_seconds: 3600
alpine_virt_retry_count: 5
alpine_virt_retry_delay_seconds: 5
alpine_virt_speed_time_seconds: 60
alpine_virt_speed_limit_bytes: 1024
alpine_virt_curl_extra_args: []
