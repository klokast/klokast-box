---
- name: Require an exact native guard qualification operation
  ansible.builtin.assert:
    that:
      - router_guard_box is match('^[a-z0-9][a-z0-9-]{0,30}$')
      - inventory_hostname == router_guard_box ~ '-dom0'
      - router_guard_operation is match('^[0-9a-f]{24}$')
      - router_guard_directory == '/var/lib/klokast/updates/discovery/router/' ~ router_guard_operation

- name: Require active controller authority for native read-only qualification
  ansible.builtin.command:
    argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
  delegate_to: localhost
  become: false
  changed_when: false

- name: Check for a reused native qualification operation
  ansible.builtin.stat:
    path: '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}'
    follow: false
  register: router_guard_existing

- name: Refuse a reused native qualification operation
  ansible.builtin.assert:
    that: [not router_guard_existing.stat.exists]

- name: Create private native qualification storage
  ansible.builtin.file:
    path: '/mnt/dom0_data/klokast-router-native-tests/{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: ['', '{{ router_guard_operation }}']

- name: Stage the bounded native guard request
  ansible.builtin.copy:
    src: '{{ router_guard_directory }}/request.json'
    dest: '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}/request.json'
    owner: root
    group: root
    mode: '0600'

- name: Stage fixed native qualification modules
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/{{ item }}.py'
    dest: '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}/{{ item }}.py'
    owner: root
    group: root
    mode: '0600'
  loop: [router_native, router_records, router_transaction, router_generations, router_personalize, router_finalize]

- name: Stage the fixed read-only source inspector
  ansible.builtin.copy:
    src: '{{ role_path }}/../router-update-inspection/files/inspect-router-update'
    dest: '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}/inspect-router-update.py'
    owner: root
    group: root
    mode: '0600'

- name: Stage the native guard qualification entry point
  ansible.builtin.copy:
    src: router-native-guards-test
    dest: '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}/router-native-guards-test'
    owner: root
    group: root
    mode: '0600'

- name: Verify native identities and refuse the still-attached source disk
  ansible.builtin.command:
    argv: [/usr/bin/python3, '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}/router-native-guards-test']
  changed_when: false

- name: Fetch the bounded native qualification result
  ansible.builtin.fetch:
    src: '/mnt/dom0_data/klokast-router-native-tests/{{ router_guard_operation }}/result.json'
    dest: '{{ router_guard_directory }}/result.json'
    flat: true
