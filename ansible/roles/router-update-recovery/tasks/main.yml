---
- name: Require the exact dom0 recovery installation target
  ansible.builtin.assert:
    that:
      - inventory_hostname == node_name ~ '-dom0'

- name: Require active controller authority before installing router recovery
  ansible.builtin.command:
    argv: [/usr/local/sbin/klokast-controller-guard, --status, --json, --require-active]
  delegate_to: localhost
  become: false
  changed_when: false
  register: router_recovery_controller

- name: Read the activated engine through the private Instance authority
  ansible.builtin.command:
    argv: [/usr/bin/sudo, -n, /usr/local/sbin/ksa-instance, --repo-root, '{{ playbook_dir }}/../..', engine, status]
  delegate_to: localhost
  become: false
  changed_when: false
  register: router_recovery_source

- name: Read the deployment source commit
  ansible.builtin.command:
    argv: [git, rev-parse, HEAD]
    chdir: '{{ playbook_dir }}/../..'
  delegate_to: localhost
  become: false
  changed_when: false
  register: router_recovery_commit

- name: Check that the engine source has no uncommitted files
  ansible.builtin.command:
    argv: [git, status, --porcelain, --untracked-files=all]
    chdir: '{{ playbook_dir }}/../..'
  delegate_to: localhost
  become: false
  changed_when: false
  register: router_recovery_status

- name: Bind installation to the clean activated controller engine
  ansible.builtin.assert:
    that:
      - (router_recovery_controller.stdout | from_json).active | bool
      - (router_recovery_controller.stdout | from_json).configured | bool
      - router_recovery_commit.stdout is match('^[0-9a-f]{40}$')
      - (router_recovery_source.stdout | from_json).valid | bool
      - (router_recovery_source.stdout | from_json).activation_present | bool
      - not ((router_recovery_source.stdout | from_json).pending_activation | bool)
      - router_recovery_commit.stdout == (router_recovery_source.stdout | from_json).engine_commit
      - router_recovery_status.stdout | length == 0

- name: Require persistent router transaction storage
  ansible.builtin.command: /bin/mountpoint -q /mnt/dom0_data
  changed_when: false

- name: Inspect pending router recovery before installing code
  ansible.builtin.stat:
    path: /mnt/dom0_data/klokast-router-updates/pending.json
    follow: false
  register: router_recovery_pending

- name: Refuse code installation during a pending router operation
  ansible.builtin.assert:
    that: [not router_recovery_pending.stat.exists]

- name: Inspect the supervised cold test fence before installing code
  ansible.builtin.stat:
    path: /mnt/dom0_data/klokast-router-updates/cold-test.json
    follow: false
  register: router_recovery_cold_test

- name: Read the protected cold test fence for a provisioning rerun
  ansible.builtin.slurp:
    src: /mnt/dom0_data/klokast-router-updates/cold-test.json
  when: router_recovery_cold_test.stat.exists
  register: router_recovery_cold_source

- name: Verify the already installed engine during a cold test
  ansible.builtin.command:
    argv: [/usr/local/sbin/router-update-transaction, check-storage, --box, '{{ node_name }}']
  changed_when: false
  when: router_recovery_cold_test.stat.exists
  register: router_recovery_cold_engine

- name: Keep the same verified recovery engine throughout a cold test
  ansible.builtin.assert:
    that:
      - (router_recovery_cold_source.content | b64decode | from_json).kind == 'klokast.router-cold-test.v1'
      - (router_recovery_cold_source.content | b64decode | from_json).engine_commit == router_recovery_commit.stdout
      - (router_recovery_cold_engine.stdout | from_json).engine_commit == router_recovery_commit.stdout
      - (router_recovery_cold_engine.stdout | from_json).result == 'persistent-storage-verified'
  when: router_recovery_cold_test.stat.exists

- name: Preserve installed recovery files during the first-install test rerun
  ansible.builtin.meta: end_role
  when: router_recovery_cold_test.stat.exists

- name: Create private persistent router recovery directories
  ansible.builtin.file:
    path: '/mnt/dom0_data/klokast-router-updates/{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: ['', records, generations, operations]

- name: Create the versioned router engine directory
  ansible.builtin.file:
    path: '/usr/local/lib/klokast/router-updates/{{ router_recovery_commit.stdout }}'
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Declare the closed router recovery module list
  ansible.builtin.set_fact:
    router_recovery_modules:
      - router_executor
      - router_dom0
      - router_native
      - router_records
      - router_initial_installation
      - router_transaction
      - router_generations
      - router_generation_device
      - router_personalize
      - router_overlay_ipv6
      - router_finalize
      - router_copy_contract
      - router_copy_native
      - router_replacement_enrollment
      - router_replacement_finalization
      - router_replacement_service
      - router_candidate
      - router_candidate_disk
      - router_candidate_preparation
      - router_initial_contact
      - router_state
      - xen_build_runtime
      - router_cold_backup
      - router_cold_disk
      - router_cold_window
      - router_cold_filesystem
      - router_cold_test_state
      - router_cold_identity
      - router_cold_recovery
      - router_cold_health
      - router_cold_supervisor
      - router_cold_return
      - router_cold_cycle
    router_recovery_hashes: {}

- name: Install the exact router engine modules
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../lib/{{ item }}.py'
    dest: '/usr/local/lib/klokast/router-updates/{{ router_recovery_commit.stdout }}/{{ item }}.py'
    owner: root
    group: root
    mode: '0600'
  loop: '{{ router_recovery_modules }}'

- name: Calculate the exact source module checksums
  ansible.builtin.set_fact:
    router_recovery_hashes: >-
      {{ router_recovery_hashes | combine({item ~ '.py':
          (lookup('ansible.builtin.file', playbook_dir ~ '/../lib/' ~ item ~ '.py', rstrip=false) | hash('sha256'))}) }}
  loop: '{{ router_recovery_modules }}'

- name: Publish the closed engine module manifest
  ansible.builtin.copy:
    content: >-
      {{ {'kind': 'klokast.router-engine-files.v1', 'engine_commit': router_recovery_commit.stdout,
          'files': router_recovery_hashes} | to_json }}
    dest: '/usr/local/lib/klokast/router-updates/{{ router_recovery_commit.stdout }}/manifest.json'
    owner: root
    group: root
    mode: '0600'

- name: Publish the installed engine selector
  ansible.builtin.copy:
    content: >-
      {{ {'kind': 'klokast.router-installed-engine.v1', 'engine_commit': router_recovery_commit.stdout} | to_json }}
    dest: /usr/local/lib/klokast/router-updates/current.json
    owner: root
    group: root
    mode: '0600'

- name: Install the fixed router engine dispatcher
  ansible.builtin.copy:
    src: router-update-transaction
    dest: /usr/local/sbin/router-update-transaction
    owner: root
    group: root
    mode: '0700'

- name: Verify installed module hashes and persistent storage
  ansible.builtin.command:
    argv: [/usr/local/sbin/router-update-transaction, check-storage, --box, '{{ node_name }}']
  changed_when: false

- name: Install router boot recovery before guest autostart
  ansible.builtin.copy:
    src: klokast-router-update-recovery.openrc
    dest: /etc/init.d/klokast-router-update-recovery
    owner: root
    group: root
    mode: '0755'

- name: Make router recovery a prerequisite for Xen autostart
  ansible.builtin.blockinfile:
    path: /etc/conf.d/xendomains
    create: true
    mode: '0644'
    marker: '# {mark} KLOKAST ROUTER UPDATE RECOVERY'
    block: 'rc_need="${rc_need:-} localmount klokast-router-update-recovery"'

- name: Enable the router recovery oneshot without restarting guests
  ansible.builtin.command: /sbin/rc-update add klokast-router-update-recovery default
  changed_when: false

- name: Include the router recovery boot chain in diskless persistence
  ansible.builtin.command:
    argv: [/usr/sbin/lbu, include, '{{ item }}']
  loop:
    - /usr/local/sbin/router-update-transaction
    - /usr/local/lib/klokast/router-updates
    - /etc/init.d/klokast-router-update-recovery
  changed_when: false

- name: Persist the installed router recovery chain
  ansible.builtin.command: /usr/sbin/lbu commit -d
  changed_when: false

- name: Verify exact recovery bytes and boot dependencies in the persisted archive
  ansible.builtin.command:
    argv: [/usr/local/sbin/router-update-transaction, verify-recovery-chain, --box, '{{ node_name }}']
  changed_when: false
