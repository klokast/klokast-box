---
- name: Verify the installed controller authority before setting up policy records
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/ksa-apply
      - inventory-source-status
  register: vm_update_authority_source
  changed_when: false
  no_log: true

- name: Require adopted Instance authority for standing update policy
  ansible.builtin.assert:
    that:
      - (vm_update_authority_source.stdout | from_json).source == 'instance_specification_v1'

- name: Verify the read-only retention source with the installed sealed checker
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/ksa-apply
      - vm-retention-status
  register: vm_update_retention_source
  changed_when: false
  no_log: true

- name: Require declared retention evidence without adoption authority
  ansible.builtin.assert:
    that:
      - (vm_update_retention_source.stdout | from_json).kind == 'klokast.vm-retention-source.v1'
      - (vm_update_retention_source.stdout | from_json).source == 'instance_specification_v1'
      - (vm_update_retention_source.stdout | from_json).adoption_authorized == false
  no_log: true

- name: Create root-owned update execution state independently of discovery
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /var/lib/klokast/updates
      mode: "0755"
    - path: /var/lib/klokast/updates/executor
      mode: "0700"
    - path: /var/lib/klokast/updates/executor/activations
      mode: "0700"

- name: Create the installation-wide VM update lock without changing existing contents
  ansible.builtin.copy:
    content: ""
    dest: /var/lib/klokast/updates/operation.lock
    force: false
    owner: root
    group: smith
    mode: "0660"

- name: Keep the installation-wide lock metadata exact
  ansible.builtin.file:
    path: /var/lib/klokast/updates/operation.lock
    state: file
    owner: root
    group: smith
    mode: "0660"
