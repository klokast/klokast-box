<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f2e8;
      --paper: #fffdf8;
      --ink: #181713;
      --muted: #5f594f;
      --soft: #82786a;
      --line: rgba(24, 23, 19, 0.18);
      --line-strong: rgba(24, 23, 19, 0.32);
      --warm: #93682e;
      --wash: rgba(255, 253, 248, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", Times, serif;
      line-height: 1.66;
      background: linear-gradient(135deg, #fffdf8 0%, #f7f2e8 44%, #e7dfd0 100%);
    }

    main {
      width: min(900px, calc(100% - 42px));
      margin: 0 auto;
      padding: 72px 0 64px;
    }

    header {
      padding: 0 0 34px;
      border-bottom: 1px solid var(--line-strong);
    }

    .mark {
      color: var(--warm);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 860px;
      margin: 18px 0 18px;
      font-size: 4.35rem;
      font-weight: 700;
      line-height: 0.99;
      letter-spacing: 0;
    }

    .lead {
      max-width: 800px;
      margin: 0;
      color: var(--muted);
      font-size: 1.22rem;
    }

    .meta {
      margin-top: 22px;
      color: var(--soft);
      font-size: 0.96rem;
    }

    a {
      color: var(--ink);
      text-decoration-color: rgba(147, 104, 46, 0.58);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:hover,
    a:focus-visible {
      color: var(--warm);
    }

    .hero-art {
      width: min(1120px, calc(100vw - 42px));
      margin: 30px 50% 0;
      transform: translateX(-50%);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
    }

    .hero-art img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1200 / 525;
      object-fit: cover;
    }

    article {
      padding-top: 38px;
    }

    section {
      padding: 0 0 18px;
    }

    h2 {
      max-width: 760px;
      margin: 34px 0 16px;
      color: var(--ink);
      font-size: 1.5rem;
      line-height: 1.18;
      letter-spacing: 0;
    }

    p {
      max-width: 760px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1.075rem;
    }

    .opening p:first-child::first-letter {
      float: left;
      padding: 7px 8px 0 0;
      color: var(--warm);
      font-size: 4.3rem;
      line-height: 0.82;
    }

    .sources {
      margin-top: 44px;
      padding-top: 30px;
      border-top: 1px solid var(--line-strong);
    }

    .sources h2 {
      margin-top: 0;
      font-size: 1.18rem;
    }

    .sources ul {
      max-width: 820px;
      margin: 0;
      padding-left: 1.15rem;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .sources li {
      margin: 9px 0;
      padding-left: 4px;
    }

    footer {
      padding-top: 28px;
      color: var(--soft);
      font-size: 0.94rem;
    }

    @media (max-width: 780px) {
      main {
        width: min(100% - 28px, 900px);
        padding-top: 46px;
      }

      h1 {
        font-size: 2.72rem;
      }

      .lead {
        font-size: 1.08rem;
      }

      .hero-art {
        width: min(100vw - 28px, 1120px);
        margin-top: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">{{SITE_MARK}}</div>
      <h1>{{TITLE}}</h1>
      <p class="lead">{{LEAD}}</p>
      <p class="meta">{{META_HTML}}</p>
      {{HERO_FIGURE}}
    </header>

    <article>
      <section class="opening">
        {{ARTICLE_HTML}}
      </section>

      <section class="sources" aria-label="Sources">
        <h2>Sources</h2>
        {{SOURCES_HTML}}
      </section>
    </article>

    <footer>
      {{FOOTER}}
    </footer>
  </main>
</body>
</html>
